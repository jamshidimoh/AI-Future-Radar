name: Payload repair runner

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Repair Telegram formatter
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/send_telegram.py')
          s = p.read_text(encoding='utf-8')
          pattern = re.compile(r'^def _chatgpt_link\(title, link\):\n.*?^def _gregorian_date', re.M | re.S)
          repl = '''def _chatgpt_link(title, link):
              prompt = f"تحلیل آموزشی فارسی برای این مطلب؛ مفاهیم پایه، موضوع اصلی، اهمیت، پیامدها و مسیر آینده را توضیح بده. عنوان: {str(title or '').strip()} منبع: {str(link or '').strip()}"
              return "https://chatgpt.com/?q=" + quote(prompt, safe="")


def _gregorian_date'''
          s, n = pattern.subn(repl, s, count=1)
          if n != 1:
              raise SystemExit('target function not found')
          p.write_text(s, encoding='utf-8')
          PY
          python -m compileall -q scripts src *.py
          python -m pytest -q tests/test_telegram_format.py tests/test_production_acceptance_guard.py tests/test_production_acceptance_contract.py tests/test_production_router_policy.py
      - name: Commit repaired source and remove repair workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/payload_repair.yml .github/workflows/_one_time_payload_fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/send_telegram.py tests/test_telegram_format.py .github/workflows/payload_repair.yml .github/workflows/_one_time_payload_fix.yml
          git commit -m "fix: repair telegram payload contract [skip ci]"
          git push origin HEAD:main
