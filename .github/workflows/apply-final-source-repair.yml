name: Apply Final Source Repair
on:
  push:
    branches: [repair-source-final]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[final-source-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply source repair and run full regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('main.py')
          s = p.read_text(encoding='utf-8')
          start = s.index('def _split_protected(items, max_protected):')
          end = s.index('\ndef _publication_summary_budget', start)
          new = '''def _split_protected(items, max_protected):\n    protected_candidates = [x for x in items if x.get("protected_content")]\n    protected = sorted(\n        protected_candidates,\n        key=lambda x: (\n            int(x.get("leader_priority", 0) or 0),\n            int(_leader_source_authority(x)),\n            str(x.get("published") or ""),\n        ),\n        reverse=True,\n    )[:max_protected]\n    protected_ids = {id(x) for x in protected}\n    regular = [x for x in items if id(x) not in protected_ids]\n    return protected, regular\n'''
          p.write_text(s[:start] + new + s[end:], encoding='utf-8')

          # No healing hooks belong in production; remove temporary repair workflows/markers.
          for name in [
              '.github/workflows/repair-protected-key.yml',
              '.github/workflows/repair-protected-order-final.yml',
              '.github/workflows/repair-protected-sort.yml',
              '.github/workflows/repair-protected-order.yml',
              '.github/workflows/repair-signal-helper.yml',
              '.github/workflows/repair-protected-sort-order.yml',
              '.github/workflows/repair-protected-ordering.yml',
              '.github/workflows/one-shot-production-repair.yml',
              '.github/workflows/production-repair-clean.yml',
              '.github/workflows/production-repair-run.yml',
              '.github/workflows/repair-final-now.yml',
              '.github/workflows/repair-protected-key-final.yml',
              '.github/workflows/repair-source-final.yml',
              '.github/workflows/apply-final-source-repair.yml',
              '.github/REPAIR_NOTE.md', '.github/KEEP', '.github/KEEP2',
              '.github/cleanup-now', '.github/DO_NOT_USE',
              '.routing_restore_pending',
              'NOOP.txt', 'tmp.txt', 'IGNORE.txt', 'BRANCH_MARKER.txt', 'BRANCH_MARKER2.txt',
              'tempbranch', 'x',
          ]:
              Path(name).unlink(missing_ok=True)
          PY
          python -m compileall -q main.py src tests
          python -m pytest -q
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: stabilize leader protection and source authority [final-source-repair]'
          git push origin HEAD:repair-source-final
