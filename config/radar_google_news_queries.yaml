# Supplemental Google News discovery queries.
# Discovery leads still pass through the normal relevance, event identity,
# quality, ranking and publication contracts. No source bypass is created here.
google_news_queries:
  - name: "Hugging Face Papers"
    query: "site:huggingface.co/papers (AI OR artificial intelligence OR machine learning OR robotics OR multimodal)"
    category: ai
    tier: 1
    content_type: research
    preferred_source: "Hugging Face Papers"
    curated_discovery: true

  # Dedicated AI-linked philosophy / consciousness lane.
  - name: "Stanford Encyclopedia of Philosophy — AI / Mind"
    query: "site:plato.stanford.edu (artificial intelligence OR philosophy of AI OR machine consciousness OR consciousness OR functionalism OR computationalism)"
    category: mind
    tier: 1
    content_type: research
    preferred_source: "Stanford Encyclopedia of Philosophy"
    curated_discovery: true

  - name: "Cambridge Core — Philosophy of AI"
    query: "site:cambridge.org/core (philosophy of AI OR artificial intelligence consciousness OR philosophy of mind AI OR computationalism AI)"
    category: mind
    tier: 1
    content_type: research
    preferred_source: "Cambridge University Press"
    curated_discovery: true

  - name: "Oxford Academic — AI Consciousness / Mind"
    query: "site:academic.oup.com (artificial consciousness OR AI consciousness OR philosophy of AI OR philosophy of mind AI OR machine consciousness)"
    category: mind
    tier: 1
    content_type: research
    preferred_source: "Oxford Academic"
    curated_discovery: true

  # High-recall mind / cognition / consciousness discovery.
