name: Repair Protected Order Final
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[protected-order-final]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply source-authority ordering and validate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('main.py')
          s = p.read_text(encoding='utf-8')
          old = 'def _split_protected(items, max_protected):\n    protected = sorted([x for x in items if x.get("protected_content")], key=lambda x: (int(x.get("leader_priority", 0) or 0), -int(x.get("source_tier", 99) or 99), str(x.get("published") or "")), reverse=True)[:max_protected]\n    protected_ids = {id(x) for x in protected}\n    regular = [x for x in items if id(x) not in protected_ids]\n    return protected, regular\n'
          new = '''def _split_protected(items, max_protected):\n    protected_candidates = [x for x in items if x.get("protected_content")]\n    protected_candidates = sorted(protected_candidates, key=lambda x: str(x.get("published") or ""), reverse=True)\n    protected_candidates = sorted(protected_candidates, key=lambda x: int(_source_tier(x) if _source_tier(x) is not None else 99))\n    protected = sorted(protected_candidates, key=lambda x: int(x.get("leader_priority", 0) or 0), reverse=True)[:max_protected]\n    protected_ids = {id(x) for x in protected}\n    regular = [x for x in items if id(x) not in protected_ids]\n    return protected, regular\n'''
          if old not in s:
              raise SystemExit('protected split anchor not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          python -m compileall -q main.py src tests
          python -m pytest -q tests/test_source_authority_production_regression.py tests/test_period_ranked_pipeline.py tests/test_final_production_acceptance.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.py
          git commit -m 'fix: correct protected source authority ordering [protected-order-final]'
          git push origin HEAD:main
          git rm -f .github/workflows/repair-protected-order-final.yml
          git commit -m 'chore: remove temporary protected order repair [skip ci]'
          git push origin HEAD:main
