name: One-time Selection Buffer Fix

on:
  push:
    paths:
      - .github/workflows/one-time-selection-buffer-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch runtime selection budget
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("production_entrypoint.py")
          text = p.read_text(encoding="utf-8")
          old = '''    protected_limit = max(0, int(policy.get("leader_protected_max", 2) or 0))
    normal_limit = max(0, int(max_posts or 0))
'''
          new = '''    protected_limit = max(0, int(policy.get("leader_protected_max", 2) or 0))
    normal_capacity = max(0, int(max_posts or 0))
    replacement_buffer = max(0, int(policy.get("replacement_buffer", 0) or 0))
    normal_limit = normal_capacity + replacement_buffer
'''
          if old not in text:
              raise SystemExit("runtime budget anchor not found")
          p.write_text(text.replace(old, new, 1), encoding="utf-8")

          tp = Path("tests/test_production_acceptance_contract.py")
          tt = tp.read_text(encoding="utf-8")
          marker = "\n\ndef test_runtime_candidates_honor_replacement_buffer():\n"
          if marker not in tt:
              tt += '''\n\ndef test_runtime_candidates_honor_replacement_buffer():
    candidates = []
    for rank in range(1, 6):
        candidates.append({"normal_period_rank": rank, "editorial_score": 70 - rank})
    candidates.extend(
        [
            {"protected_slot": True, "final_editorial_score": 70},
            {"protected_slot": True, "final_editorial_score": 69},
            {"protected_slot": True, "final_editorial_score": 68},
        ]
    )
    bounded = _bound_runtime_candidates(
        candidates,
        max_posts=3,
        policy={"leader_protected_max": 2, "replacement_buffer": 2},
    )
    assert len(bounded) == 7
    protected = [item for item in bounded if item.get("protected_slot")]
    normals = [item for item in bounded if item.get("normal_period_rank") is not None]
    assert len(protected) == 2
    assert [item.get("normal_period_rank") for item in normals] == [1, 2, 3, 4, 5]
'''
              tp.write_text(tt, encoding="utf-8")
          PY
      - name: Run focused tests
        run: |
          python -m pytest -q tests/test_production_acceptance_contract.py
      - name: Commit fix and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add production_entrypoint.py tests/test_production_acceptance_contract.py .github/workflows/one-time-selection-buffer-fix.yml
          git commit -m "fix: honor replacement buffer before summarization"
          git push
