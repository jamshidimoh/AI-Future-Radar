name: Production Closure Gate

on:
  workflow_run:
    workflows: ["Run AI Future Radar Bot"]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  closure-evidence:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate final evidence window
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request

          repo = os.environ["REPO"]
          token = os.environ["GH_TOKEN"]
          base = f"https://api.github.com/repos/{repo}"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get_json(path):
              req = urllib.request.Request(base + path, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          no_redirect_opener = urllib.request.build_opener(NoRedirect)

          def get_text(path):
              req = urllib.request.Request(base + path, headers=headers)
              try:
                  with no_redirect_opener.open(req, timeout=30) as response:
                      return response.read().decode("utf-8", errors="replace")
              except urllib.error.HTTPError as exc:
                  if exc.code not in (301, 302, 303, 307, 308):
                      raise
                  location = exc.headers.get("Location")
                  if not location:
                      raise RuntimeError("GitHub log redirect did not include a Location header") from exc
                  with urllib.request.urlopen(urllib.request.Request(location), timeout=30) as response:
                      return response.read().decode("utf-8", errors="replace")

          runs_data = get_json("/actions/workflows/run.yml/runs?branch=main&per_page=10")
          runs = [r for r in runs_data.get("workflow_runs", []) if r.get("name") == "Run AI Future Radar Bot"]
          if len(runs) < 3:
              print(f"CLOSURE: IN PROGRESS — only {len(runs)} production runs observed; 3 required.")
              sys.exit(0)

          window = runs[:3]
          print("Closure window:", [
              (r.get("run_number"), r.get("conclusion"), r.get("head_sha", "")[:8]) for r in window
          ])
          if any(r.get("conclusion") != "success" for r in window):
              print("CLOSURE: BLOCKED — one of the last three production runs failed.")
              sys.exit(1)

          logs = {}
          log_errors = {}
          for run in window:
              jobs = get_json(f"/actions/runs/{run['id']}/jobs?per_page=50").get("jobs", [])
              bot_jobs = [j for j in jobs if j.get("name") == "run-bot"]
              if not bot_jobs:
                  log_errors[run["run_number"]] = "run-bot job not found"
                  continue
              job_id = bot_jobs[0]["id"]
              try:
                  logs[run["run_number"]] = get_text(f"/actions/jobs/{job_id}/logs")
              except Exception as exc:
                  log_errors[run["run_number"]] = f"{type(exc).__name__}: {exc}"

          if log_errors or len(logs) != len(window):
              for run_number, error in sorted(log_errors.items()):
                  print(f"LOG_READ_FAILED run={run_number} error={error}")
              print("CLOSURE: BLOCKED — production evidence logs are incomplete; cannot certify closure.")
              sys.exit(1)

          def has(text, pattern):
              return re.search(pattern, text, re.I | re.M) is not None

          def any_run(pattern):
              return any(has(text, pattern) for text in logs.values())

          def all_runs(pattern):
              return len(logs) == len(window) and all(has(logs[r.get("run_number")], pattern) for r in window)

          published_run = any_run(r"\[Telegram Published\]")
          zero_publish_run = any_run(r"Posts sent: 0/") and any_run(r"normal_news=0[^\n]*tier0_news=0")
          duplicate_free = all_runs(r"history_duplicates=0 current_run_duplicates=0") and not any_run(r"duplicate publication")
          image_contract = any_run(r"full_text=\d+ photo=(?:enabled|disabled) single_message=true")
          ranking_contract = all_runs(r"\[Normal Ranking Window\].*candidate_window=\d+") and not any_run(r"normal_rank=\d{2,}")
          qa_replacement = all_runs(r"(?:translation/QA failed|Editorial Value Gate.*rejected|publishable candidate prepared)")
          leader_watch = all_runs(r"\[Protected Leader Eligibility\] candidates=\d+") and all_runs(r"\[Leader Protection Audit\]")
          provider_success = any_run(r"\[Light Router\] success=")
          provider_failure_observed = any_run(r"\[Light Router\] disabled=") or any_run(r"(?:429|quota|timeout|5\d{2}|401|403)")
          provider_isolated = provider_failure_observed and provider_success
          state_persisted = all_runs(r"Production state persisted")
          mission_portfolio = all_runs(r"mission_aware=true") and not any_run(r"generic low[- ]signal")

          # Critical product-level proof: closure is not valid merely because the
          # recovery script returned success or because Education was "not_due".
          # At least one observed production run must contain explicit evidence
          # that an Education lesson was actually delivered to Telegram.
          education_published = any_run(r"\[Education Published\].*telegram_delivery=successful")
          education_recovery_confirmed = any_run(r"\[Education Recovery\] CONFIRMED")

          evidence = {
              "01_three_successful_runs": True,
              "02_publish_and_fail_closed_zero": published_run and zero_publish_run,
              "03_no_duplicate_publication": duplicate_free,
              "04_image_preserves_full_text": image_contract,
              "05_rank_within_window_no_bypass": ranking_contract,
              "06_replacement_after_qa": qa_replacement,
              "07_leader_watch_eligible": leader_watch,
              "08_provider_failure_isolated": provider_isolated,
              "09_state_after_confirmed_delivery": state_persisted,
              "10_mission_portfolio_not_generic": mission_portfolio,
              "11_real_education_publication": education_published and education_recovery_confirmed,
          }

          for key, value in evidence.items():
              print(f"EVIDENCE {key}={'PASS' if value else 'BLOCKED'}")

          blocked = [key for key, value in evidence.items() if not value]
          if blocked:
              print("CLOSURE: BLOCKED — unresolved evidence:", ", ".join(blocked))
              print("CLOSURE: ACCEPTANCE IN PROGRESS")
              sys.exit(1)

          print("CLOSURE: CLOSED — deterministic gates and production evidence checks passed.")
          PY
