name: G9 Final Project Acceptance

on:
  push:
    branches:
      - evolution/technology-intelligence-g9
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g9-final-project-gate
  cancel-in-progress: true

jobs:
  final-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run complete deterministic regression
        run: python -m pytest -q

      - name: Run final project gate integrity contract
        run: python -m pytest -q tests/test_final_project_gate_v1.py

      - name: Verify production closure is genuinely closed
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("docs/PRODUCTION_CLOSURE_STATUS.md").read_text(encoding="utf-8")
          required = "Current declaration\n\n`CLOSED`"
          if required not in text:
              raise SystemExit("G9 BLOCKED: production closure evidence is not CLOSED")
          print("G9 production closure declaration: CLOSED")
          PY
