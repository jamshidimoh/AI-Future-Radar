name: Test Radar Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Apply one-time mission recovery fix
        if: github.event_name == 'push'
        run: |
          if [ -f scripts/_mission_recovery_fix.py ]; then
            python scripts/_mission_recovery_fix.py
            python -m py_compile main.py
            python -m pytest -q tests/test_mission_coverage_recovery.py tests/test_production_acceptance_guard.py tests/test_mission_lane_coverage_contract.py
            rm -f scripts/_mission_recovery_fix.py .github/workflows/mission-recovery-maintenance.yml
            python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/test-quality.yml')
          s = p.read_text(encoding='utf-8')
          marker = '      - name: Apply one-time mission recovery fix\n'
          start = s.index(marker)
          end = s.index('      - name: Install dependencies\n', start)
          s = s[:start] + s[end:]
          s = s.replace('permissions:\n  contents: write', 'permissions:\n  contents: read')
          p.write_text(s, encoding='utf-8')
          PY
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add main.py .github/workflows/test-quality.yml scripts/_mission_recovery_fix.py .github/workflows/mission-recovery-maintenance.yml
            git commit -m 'fix: make mission recovery lane targeted [skip ci]'
            git push
          fi

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python modules
        run: python -m compileall -q main.py src tests

      - name: Validate production imports
        run: python -c "import main, period_ranked_pipeline, production_entrypoint, production_resilient_runner; print('PRODUCTION_IMPORTS_OK')"

      - name: Validate configuration
        run: python -c "import yaml; s=yaml.safe_load(open('config/selection_policy.yaml',encoding='utf-8')); l=yaml.safe_load(open('config/leader_watchlist.yaml',encoding='utf-8')); assert s['selection']['max_posts'] == 3; assert s['selection']['candidate_window'] == 6; assert s['selection']['candidate_window'] > s['selection']['max_posts']; assert s['selection']['max_items_per_source'] >= 1; assert s['selection']['diversity_mode'] == 'adaptive'; assert s['selection']['preferred_max_same_source'] == 1; assert s['editorial']['leader_protected_max'] == 2; assert s['editorial']['technical_depth_penalty'] >= 1; names=sum([g['names'] for g in l['people'].values()],[]); assert 'Sam Altman' in names and 'Yuval Noah Harari' in names and 'Anil Seth' in names; print('CONFIG_OK', len(names))"

      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check 'ruff>=0.12,<0.13'

      - name: Ruff repository audit
        run: python -m ruff check .

      - name: Run mypy baseline
        run: python -m pip install mypy && python -m mypy
        continue-on-error: true

      - name: Run full quality contract suite
        run: python -m pytest -q
