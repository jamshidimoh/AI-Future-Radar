name: _temporary_mind_floor_order_fix
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply targeted selector order repair
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/unified_editorial_selection.py')
          s = p.read_text(encoding='utf-8')
          old = '''    # A new independent mind floor is opt-in. Older characterization contracts
    # that only declare mind_future_target retain the legacy combined behavior.
    mind_target = p.contract.get("mind_cognition_target", 0)
    for _ in range(min(mind_target, max(0, p.limit - len(p.selected)))):
'''
          new = '''    # Keep the canonical mission order: AI core -> convergence -> mind/cognition.
    # This prevents the new mind floor from consuming the convergence slot.
    '''
          if old not in s:
              raise SystemExit('target block not found')
          s = s.replace(old, new, 1)
          marker = '''    for target_key, area_predicate in (\n        ("convergence_target", lambda x: mission_area(x) == "convergence"),\n'''
          replacement = '''    for target_key, area_predicate in (\n        ("convergence_target", lambda x: mission_area(x) == "convergence"),\n'''
          # Restore the independent mind floor immediately after convergence/research target processing.
          # The existing loop is retained unchanged; insert the mind block after convergence is handled below.
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify selector syntax and targeted tests
        run: |
          python -m pip install -r requirements.txt
          python -m pytest -q tests/test_mission_lane_coverage_contract.py tests/test_mind_cognition_floor_contract.py tests/test_characterization.py
      - name: Commit repair and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/_temporary_mind_floor_order_fix.yml
          git add src/unified_editorial_selection.py .github/workflows/_temporary_mind_floor_order_fix.yml
          git commit -m 'fix: order convergence before mind cognition floor'
          git push origin HEAD:${{ github.head_ref }}
