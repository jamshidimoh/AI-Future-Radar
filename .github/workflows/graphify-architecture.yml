name: Graphify Architecture Analysis

on:
  push:
    branches:
      - analysis/graphify-architecture
  workflow_dispatch:

permissions:
  contents: read

jobs:
  graphify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Build code graph
        run: |
          uvx --from graphifyy graphify extract . --code-only --out .
          uvx --from graphifyy graphify cluster-only . --out .

      - name: Validate graph
        run: |
          test -s graphify-out/graph.json
          test -s graphify-out/GRAPH_REPORT.md
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("graphify-out/graph.json")
          g = json.loads(p.read_text(encoding="utf-8"))
          nodes = g.get("nodes", [])
          edges = g.get("edges", g.get("links", []))
          print(f"Graphify nodes: {len(nodes)}")
          print(f"Graphify edges: {len(edges)}")
          print(f"Graphify communities: {len({n.get('community') for n in nodes if n.get('community') is not None})}")
          if not nodes:
              raise SystemExit("Graphify produced an empty graph")
          PY

      - name: Upload Graphify outputs
        uses: actions/upload-artifact@v4
        with:
          name: graphify-ai-future-radar
          path: graphify-out/
          if-no-files-found: error
          retention-days: 14
