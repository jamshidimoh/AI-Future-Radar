name: G3 Evidence Graph Validation

on:
  push:
    branches:
      - evolution/technology-intelligence-g3
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g3-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run full regression suite
        env:
          PYTHONUNBUFFERED: "1"
        run: python -m pytest -q

      - name: Run G3 focused contract
        env:
          PYTHONUNBUFFERED: "1"
        run: python -m pytest -q tests/test_evidence_graph_v1.py

      - name: Validate frozen production acceptance
        env:
          PYTHONUNBUFFERED: "1"
        run: python -m pytest -q tests/test_final_production_acceptance.py tests/test_production_acceptance_contract.py

      - name: Validate G3 config is publication-decoupled
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          data = yaml.safe_load(Path("config/evidence_graph.yaml").read_text(encoding="utf-8"))
          cfg = data["evidence_graph"]
          assert cfg["version"] == 1
          assert cfg["enabled"] is False
          assert cfg["publication_decoupled"] is True
          assert cfg["retain_contradictions"] is True
          print("G3 publication-decoupling contract: PASS")
          PY
