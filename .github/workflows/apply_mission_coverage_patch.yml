name: Apply Mission Coverage Patch
on:
  push:
    branches:
      - fix/mission-coverage-recovery-v2
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply patch
        run: python tools/apply_mission_coverage_patch.py
      - name: Validate focused tests
        run: python -m pytest -q tests/test_mission_coverage_priority.py tests/test_mission_coverage_recovery.py tests/test_unified_editorial_selection.py tests/test_production_acceptance_contract.py
      - name: Commit production patch and remove temporary tooling
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f tools/apply_mission_coverage_patch.py .github/workflows/apply_mission_coverage_patch.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix: strengthen mission coverage recovery and classification [skip ci]"
          git push origin HEAD:fix/mission-coverage-recovery-v2
