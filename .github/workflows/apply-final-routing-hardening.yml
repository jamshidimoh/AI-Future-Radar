name: Apply Final Routing Hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Reset to latest remote main
        run: git fetch origin main && git reset --hard origin/main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Apply patches and validate
        run: |
          python scripts/apply_final_routing_hardening.py
          python -m compileall -q main.py src scripts tests
          python -m pip install -q --disable-pip-version-check 'ruff>=0.12,<0.13'
          python -m ruff check --select F src/llm_router_light.py src/free_model_registry.py src/production_router_policy.py tests/test_llm_health_persistence.py tests/test_nara_router_integration.py
          python -m pytest -q tests/test_production_router_policy.py tests/test_free_model_registry.py tests/test_litellm_registry_integration.py tests/test_llm_router_resilience.py tests/test_llm_health_persistence.py tests/test_nara_router_integration.py
      - name: Commit and remove one-time workflow
        run: |
          rm -f .github/workflows/apply-final-routing-hardening.yml scripts/apply_final_routing_hardening.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.py src/llm_router_light.py .github/workflows/test-quality.yml .github/workflows/apply-final-routing-hardening.yml scripts/apply_final_routing_hardening.py
          git commit -m 'fix: finalize routing and publication hardening' || exit 0
          git push origin HEAD:main
