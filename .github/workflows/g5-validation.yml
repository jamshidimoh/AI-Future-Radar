name: G5 Cross-Domain Convergence Validation

on:
  push:
    branches:
      - evolution/technology-intelligence-g5
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g5-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run full regression suite
        run: python -m pytest -q

      - name: Run G5 focused contract
        run: python -m pytest -q tests/test_convergence_intelligence_v1.py

      - name: Validate frozen production acceptance
        run: python -m pytest -q tests/test_final_production_acceptance.py tests/test_production_acceptance_contract.py

      - name: Validate G5 config is publication-decoupled
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          data = yaml.safe_load(Path("config/convergence_intelligence.yaml").read_text(encoding="utf-8"))
          cfg = data["convergence_intelligence"]
          assert cfg["version"] == 1
          assert cfg["enabled"] is False
          assert cfg["publication_decoupled"] is True
          assert cfg["minimum_domains"] >= 2
          assert cfg["minimum_independent_sources"] >= 2
          print("G5 publication-decoupling contract: PASS")
          PY
