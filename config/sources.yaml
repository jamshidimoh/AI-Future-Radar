# AI Future Radar — production source policy
# AI محور اصلی است. حوزه‌های دیگر فقط در صورت پیوند مشخص با AI وارد انتشار می‌شوند.

categories:
  ai:
    label: "هوش مصنوعی"
    emoji: "🤖"
    hashtag: "#هوش_مصنوعی"
    keywords: ["artificial intelligence", "machine learning", "LLM", "neural network", "AGI", "deep learning", "AI", "GPT", "transformer", "agentic AI", "AI agents", "reasoning model", "generative AI", "foundation model", "multimodal", "robotics", "computer use", "autoresearch", "AI safety"]
  quantum:
    label: "کوانتوم × AI"
    emoji: "⚛️"
    hashtag: "#کوانتوم_و_AI"
    keywords: ["quantum machine learning", "quantum AI", "quantum neural network", "quantum optimization for AI", "quantum inference for AI", "quantum computing AI"]
  genetics:
    label: "ژنتیک × AI"
    emoji: "🧬"
    hashtag: "#ژنتیک_و_AI"
    keywords: ["AI drug discovery", "AI genomics", "machine learning genomics", "protein design AI", "foundation model biology", "genomics AI", "CRISPR AI"]
  mind:
    label: "ذهن و آگاهی × AI"
    emoji: "🧠"
    hashtag: "#ذهن_و_AI"
    keywords: ["machine consciousness", "AI consciousness", "AGI philosophy", "consciousness AI", "sentience AI", "cognitive science AI"]
  philosophy_science:
    label: "فلسفه علم × AI"
    emoji: "🧩"
    hashtag: "#فلسفه_علم_و_AI"
    keywords: ["philosophy of science AI", "epistemology AI", "scientific method AI", "AI philosophy science", "philosophy of artificial intelligence", "AI epistemology", "AI and scientific discovery"]
  future:
    label: "آینده‌پژوهی × AI"
    emoji: "🔮"
    hashtag: "#آینده_AI"
    keywords: ["future of AI", "AI future", "AGI future", "AI governance", "AI policy", "AI economy", "AI jobs", "existential risk AI", "technological singularity AI", "future of intelligence AI"]

ai_bridge_keywords: ["artificial intelligence", "AI", "machine learning", "deep learning", "LLM", "agent", "AGI", "foundation model", "generative AI", "reasoning model", "neural network", "computer vision", "robotics", "AI safety", "AI governance", "AI drug discovery", "machine consciousness", "quantum machine learning", "AI genomics", "protein design AI", "philosophy of science AI", "epistemology AI", "scientific method AI", "future of AI"]

action_policy:
  ai_share_target: 0.70
  min_unique_sources: 3
  max_items_per_source: 2
  max_items_per_content_type: 2
  cross_domain_requires_ai_link: true
  story_similarity_threshold: 0.45
  source_rotation_days: 7
  source_rotation_penalty: 3
  leader_selection_bonus: 7
  leader_rotation_penalty: 5
  min_selection_score: 10
  leader_min_selection_score: 14
  community_min_selection_score: 28
  preferred_content_types: ["interview", "podcast", "research", "lecture", "talk", "official"]
  preferred_source_tiers: [1, 2]
  preferred_authoritative_sources:
    - {name: "MIT CSAIL - Building 32", match: ["MIT CSAIL", "Building 32", "cap.csail.mit.edu"], priority: 100, reason: "CSAIL faculty/researcher podcast and research"}
    - {name: "Stanford HAI", match: ["Stanford HAI", "Stanford Institute for Human-Centered AI", "hai.stanford.edu"], priority: 95, reason: "AI research, measurement and societal impact"}
    - {name: "BAIR", match: ["Berkeley AI Research", "BAIR", "bair.berkeley.edu"], priority: 95, reason: "academic AI research"}
    - {name: "Google DeepMind", match: ["Google DeepMind", "deepmind.google"], priority: 90, reason: "frontier AI research"}
    - {name: "OpenAI", match: ["OpenAI", "openai.com"], priority: 90, reason: "frontier models and AI research"}
    - {name: "Anthropic", match: ["Anthropic", "anthropic.com"], priority: 90, reason: "frontier models, agents and AI safety"}
    - {name: "MIT News", match: ["MIT News", "news.mit.edu"], priority: 100, reason: "top-priority university AI research reporting"}
    - {name: "Nature", match: ["Nature", "nature.com"], priority: 88, reason: "scientific research"}
    - {name: "Quanta Magazine", match: ["Quanta Magazine", "quantamagazine.org"], priority: 82, reason: "high-quality science reporting"}
    - {name: "CMU AI", match: ["Carnegie Mellon", "CMU", "cs.cmu.edu"], priority: 82, reason: "academic AI and robotics research"}

