name: selector repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Repair selector floor and regenerate characterization fixture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/unified_editorial_selection.py')
          s = p.read_text(encoding='utf-8')
          old = '            opportunity_floor = min(floor, 0.70) if target_key in {"mind_future_target", "research_target"} else floor\n'
          new = '            opportunity_floor = floor\n'
          if old not in s:
              raise SystemExit('selector opportunity floor patch target not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          python tests/characterization/gen_fixtures.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/unified_editorial_selection.py tests/characterization/select_regular_portfolio.json
          git commit -m 'fix: restore quality floor and refresh selector characterization'
          git push origin HEAD:main
      - name: Remove repair workflow
        if: success()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/_selector_repair.yml
          git commit -m 'chore: remove temporary selector repair workflow'
          git push origin HEAD:main
