# Production runtime verification trigger: diversity policy is intentional.
selection:
  max_posts: 3
  candidate_window: 6
  max_items_per_source: 2
  max_items_per_content_type: 2
  story_similarity_threshold: 0.45
  diversity_mode: adaptive
  diversity_weight: 8.0
  similarity_penalty: 12.0
  preferred_max_same_source: 1
  distinct_sources_first: true
  replacement_buffer: 3
  diversity_quality_floor_ratio: 0.80

editorial:
  leader_priority_weight: 2
  leader_protected_max: 2
  technical_depth_penalty: 3
  community_penalty: 30
  rotation_days: 7
  mission_aware: true
  strict_relevance: true

# Unified production selection contract:
# - max_posts=3 is the normal publication capacity; candidate_window=6 is the
#   pre-QA candidate pool used for replacement-aware publication.
# - max_items_per_source=2 is the adaptive ceiling and hard ceiling. One item
#   per source is preferred first; a second item is allowed only during adaptive
#   backfill when capacity remains.
# - max_items_per_content_type=2 is a soft portfolio ceiling; mission-lane
#   coverage must not be starved merely because several strong lanes are research.
#   Interview-specific protection remains controlled by interview_target_max.
# - Mission coverage is now explicit: one AI-core lane, one mind/cognition lane,
#   and one convergence lane are preferred when qualifying candidates exist.
#   The remaining capacity is optimized by quality, information gain and diversity.
# - ai_core_target_min/max, mind_cognition_target and convergence_target are
#   explicit mission coverage controls. They do not bypass relevance, authority,
#   deduplication or final publication safety checks.
# - mind_future_target remains a bounded opportunity for future-governance content
#   after the dedicated mind/convergence floors are satisfied.
# - diversity_quality_floor_ratio=0.80 remains unchanged; lane coverage never
#   admits a candidate below the quality floor when a qualifying alternative exists.
# - max_same_mission_area=2 prevents an AI-only or single-domain publication run.
# - Information gain is a bounded soft reranker. It never bypasses relevance,
#   authority, source, content-type, community, interview, or publication gates.
# - Community/aggregator sources are not eligible for the normal portfolio.
# - candidate_window and replacement_buffer preserve additional candidates for
#   post-summary or publication rejection without lowering quality floors.
# - strict_relevance=true enables hard mission-relevance filtering in production.
# - Education remains an independent scheduled product stream and is recovered
#   fail-closed when due.
# - Strategic Analytical Lane: at most one mission-critical analytical signal per
#   run may use the normal quota without the ranking score floor, but only after
#   trusted source validation, deduplication, source grounding, editorial QA and
#   normal Telegram quota checks. It is not a Tier-0 bypass.
