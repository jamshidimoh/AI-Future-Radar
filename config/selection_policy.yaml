# Production runtime verification trigger: diversity policy is intentional.
selection:
  max_posts: 3
  candidate_window: 6
  max_items_per_source: 2
  max_items_per_content_type: 1
  story_similarity_threshold: 0.45
  diversity_mode: adaptive
  diversity_weight: 8.0
  similarity_penalty: 12.0
  preferred_max_same_source: 1
  distinct_sources_first: true
  replacement_buffer: 3
  # Diversity is a soft preference. A materially weaker candidate must not win
  # solely because it opens a new mission area or source.
  diversity_quality_floor_ratio: 0.80

editorial:
  leader_priority_weight: 2
  leader_protected_max: 2
  technical_depth_penalty: 3
  community_penalty: 30
  rotation_days: 7
  mission_aware: true
  strict_relevance: true

# Unified production selection contract:
# - max_posts=3 is the normal publication capacity; candidate_window=6 is the
#   pre-QA candidate pool used for replacement-aware publication.
# - max_items_per_source=2 is the adaptive ceiling and hard ceiling. One item
#   per source is preferred first; a second item is allowed only during adaptive
#   backfill when capacity remains.
# - max_items_per_content_type=1 prevents a run from becoming a single-format
#   feed. Subsequent periods can still rotate back to a previously used format.
# - Within a run, distinct sources are preferred first; source repetition is
#   allowed only during adaptive backfill when capacity remains.
# - Historical source usage is a bounded preference signal, never a hard exclusion.
# - ai_core_target_min/max and mind_future_target are explicit mission
#   coverage opportunities. They do not bypass relevance, authority, dedup,
#   editorial quality, or publication gates.
# - mind_future_target=2 prioritizes up to two normal slots for the mission area
#   containing consciousness, cognition, philosophy of mind/science/technology,
#   AI philosophy, and technology-linked future/governance. Awareness/philosophy
#   candidates are therefore considered when they are sufficiently competitive.
# - max_same_mission_area=6 is a portfolio ceiling, not a diversity quota.
# - Technology-linked consciousness/philosophy terms are mapped in mission_policy
#   to mind_cognition and remain subject to authority, quality, deduplication and
#   publication gates.
# - Information gain is a bounded soft reranker: the next candidate is evaluated
#   against already selected topics. Similar stories receive diminishing-return
#   penalties; distinct high-quality stories receive a modest novelty bonus.
# - Information gain never bypasses relevance, authority, source, content-type,
#   community, interview, or publication-quality gates.
# - Community/aggregator sources are not eligible for the normal portfolio.
# - Candidate_window exists to support replacement after summary, editorial, or
#   downstream publication rejection without relaxing publication quality gates.
# - replacement_buffer=3 keeps three additional normal candidates available
#   beyond the publication capacity of 3 so semantic/publication rejection can be
#   absorbed without lowering the score floor.
# - strict_relevance=true enables hard mission-relevance filtering in the
#   production orchestration path.
# - Education remains an independent scheduled product stream and is recovered
#   fail-closed when due; its cadence/publication contract is not replaced by the
#   normal news portfolio selection.
# - Strategic Analytical Lane: at most one mission-critical analytical signal per
#   run may use the normal quota without the ranking score floor, but only after
#   Leader classification (accepted+analytical+context), leader priority, trusted
#   Tier-1/2 source validation, deduplication, Persian translation, source grounding,
#   editorial-value QA and normal Telegram quota checks. It is not a Tier-0 bypass.
# - 2026-09-14: portfolio diversity strengthened so AI, convergence and mind/future
#   signals compete as distinct coverage areas instead of one dominant news class.
