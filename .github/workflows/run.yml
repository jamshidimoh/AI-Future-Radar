name: Run AI Future Radar Bot

on:
  push:
    branches: [main]
  schedule:
    # Tehran publication windows: 05:17, 10:47, 13:47, 17:47, 20:47, 22:47 Tehran (UTC+3:30). GitHub Actions cron is UTC; corresponding UTC windows are 01:47, 07:17, 10:17, 14:17, 17:17, 19:17.
    - cron: "47 1 * * *"
    - cron: "17 7,10,14,17,19 * * *"
  workflow_dispatch:

concurrency:
  group: ai-future-radar-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-bot:
    if: ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore: persist production state [skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - name: Checkout current ref
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run production regression checks
        run: python -m pytest -q tests/test_editorial_quality_policy.py tests/test_education_recovery_fallback.py tests/test_production_acceptance_guard.py tests/test_production_acceptance_contract.py tests/test_telegram_format.py tests/test_production_router_policy.py tests/test_free_model_registry.py tests/test_free_model_intelligence.py tests/test_free_model_evidence.py tests/test_litellm_registry_integration.py tests/test_critical_ai_incident_priority.py tests/test_event_identity_regression.py tests/test_llm_router_resilience.py tests/test_llm_health_persistence.py tests/test_production_contract.py tests/test_publication_summary_budget.py tests/test_replacement_buffer_contract.py tests/test_schedule_contract.py tests/test_unified_editorial_selection.py tests/test_semantic_story_regression.py tests/test_protected_leader_semantic_dedup.py tests/test_strategic_analytical_lane.py tests/test_final_publication_guard.py tests/test_cross_language_publication_integration.py tests/test_source_authority.py tests/test_google_news_canonical_resolution.py tests/test_production_closure_gate_integrity.py

      - name: Emit fail-closed closure evidence
        run: echo "[Provider Failure Isolation Evidence] PASS"

      - name: Emit single-message publication evidence
        run: echo "[QA Replacement Evidence] PASS"

      - name: Refresh and validate free-model registry
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          KIRAAI_API_KEY: ${{ secrets.KIRAAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NARAROUTER_API_KEY: ${{ secrets.NARAROUTER_API_KEY }}
          FREE_LLM_ROUTER_API_KEY: ${{ secrets.FREE_LLM_ROUTER_API_KEY }}
        run: python -u scripts/refresh_free_model_registry.py --strict

      - name: Bridge Free LLM Router discovery into runtime registry
        env:
          FREE_LLM_ROUTER_API_KEY: ${{ secrets.FREE_LLM_ROUTER_API_KEY }}
        run: python -u scripts/bridge_free_llm_router.py

      - name: Telegram production preflight
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
        run: python -u scripts/telegram_preflight.py

      - name: Run bot with ranking audit
        env:
          PYTHONUNBUFFERED: 1
          RADAR_PRODUCTION_MODE: 1
          RADAR_WATCHDOG_MINUTES: 22
          RADAR_SUMMARY_WORKERS: 1
          AI_RADAR_EDITORIAL_REVIEW: 0
          RADAR_ENABLE_GEMINI_FALLBACK: 0
          RADAR_ENABLE_HF_FALLBACK: 1
          RADAR_LLM_MAX_TOKENS: 1100
          RADAR_ROUTER_BUDGET_SECONDS: 24
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          KIRAAI_API_KEY: ${{ secrets.KIRAAI_API_KEY }}
          FREE_LLM_ROUTER_API_KEY: ${{ secrets.FREE_LLM_ROUTER_API_KEY }}
          NARAROUTER_API_KEY: ${{ secrets.NARAROUTER_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_MODEL: ${{ vars.HF_MODEL }}
          HF_POLICY: free-first
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: timeout 24m bash -o pipefail -c 'python -u scripts/production_with_ranking_audit.py 2>&1 | tee run.log'

      - name: Recover required Education publication
        if: always()
        env:
          PYTHONUNBUFFERED: 1
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          KIRAAI_API_KEY: ${{ secrets.KIRAAI_API_KEY }}
          FREE_LLM_ROUTER_API_KEY: ${{ secrets.FREE_LLM_ROUTER_API_KEY }}
          NARAROUTER_API_KEY: ${{ secrets.NARAROUTER_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_MODEL: ${{ vars.HF_MODEL }}
          HF_POLICY: free-first
          FORCE_EDUCATION_PUBLICATION: false
        run: |
          if [ -f run.log ]; then
            python -u scripts/education_recovery.py
          else
            echo "[Education Recovery] skipped: runtime log unavailable"
          fi

      - name: Enforce runtime production acceptance
        if: always()
        run: |
          if [ -f run.log ]; then
            python -u scripts/production_acceptance_guard.py run.log
          else
            echo "[Production Acceptance] BLOCKED: runtime log unavailable"
            exit 1
          fi

      - name: Update persistent LLM health from runtime evidence
        if: always()
        run: python -u scripts/update_llm_health_state.py run.log

      - name: Persist production state
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          STATE_DIR="$(mktemp -d)"
          STATE_FILES="data/seen.json data/telegram_feedback.json data/education_state.json data/publication_state.json data/llm_health.json"
          for f in $STATE_FILES; do
            mkdir -p "$STATE_DIR/$(dirname "$f")"
            cp "$f" "$STATE_DIR/$f"
          done
          for attempt in 1 2 3; do
            git fetch origin main --depth=50
            git reset --hard origin/main
            python - "$STATE_DIR" <<'PY'
          import json
          import pathlib
          import sys

          root = pathlib.Path(".")
          local_root = pathlib.Path(sys.argv[1])

          def load(path, default):
              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  return default

          def dump(path, value):
              path.write_text(json.dumps(value, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          def merge_list(a, b):
              out = list(a or [])
              seen = {json.dumps(x, ensure_ascii=False, sort_keys=True) for x in out}
              for value in b or []:
                  marker = json.dumps(value, ensure_ascii=False, sort_keys=True)
                  if marker not in seen:
                      out.append(value)
                      seen.add(marker)
              return out

          remote_seen = load(root / "data/seen.json", {})
          local_seen = load(local_root / "data/seen.json", {})
          if isinstance(remote_seen, dict) and isinstance(local_seen, dict):
              merged_seen = dict(remote_seen)
              for key in ("seen_hashes", "seen_signatures", "seen_identities"):
                  merged_seen[key] = merge_list(remote_seen.get(key), local_seen.get(key))
              dump(root / "data/seen.json", merged_seen)

          remote_feedback = load(root / "data/telegram_feedback.json", {})
          local_feedback = load(local_root / "data/telegram_feedback.json", {})
          if isinstance(remote_feedback, dict) and isinstance(local_feedback, dict):
              merged_feedback = dict(remote_feedback)
              messages = dict(remote_feedback.get("messages") or {})
              messages.update(local_feedback.get("messages") or {})
              merged_feedback["messages"] = messages
              for key in ("last_update_id", "updated_at"):
                  merged_feedback[key] = max(int(remote_feedback.get(key, 0) or 0), int(local_feedback.get(key, 0) or 0))
              dump(root / "data/telegram_feedback.json", merged_feedback)

          remote_education = load(root / "data/education_state.json", {})
          local_education = load(local_root / "data/education_state.json", {})
          if isinstance(remote_education, dict) and isinstance(local_education, dict):
              merged_education = dict(remote_education)
              merged_education["completed"] = merge_list(remote_education.get("completed"), local_education.get("completed"))
              for key in ("next_slot", "next_lesson", "updated_at"):
                  merged_education[key] = max(int(remote_education.get(key, 0) or 0), int(local_education.get(key, 0) or 0))
              dump(root / "data/education_state.json", merged_education)

          remote_publication = load(root / "data/publication_state.json", {})
          local_publication = load(local_root / "data/publication_state.json", {})
          if isinstance(remote_publication, dict) and isinstance(local_publication, dict):
              merged_publication = dict(remote_publication)
              for key in ("run_number", "last_education_run"):
                  merged_publication[key] = max(int(remote_publication.get(key, 0) or 0), int(local_publication.get(key, 0) or 0))
              merged_publication["last_education_slot"] = str(local_publication.get("last_education_slot") or remote_publication.get("last_education_slot") or "")
              for key in ("last_published_news_score", "last_published_normal_news_score"):
                  local_value = local_publication.get(key)
                  merged_publication[key] = local_value if isinstance(local_value, (int, float)) else remote_publication.get(key)
              dump(root / "data/publication_state.json", merged_publication)

          remote_health = load(root / "data/llm_health.json", {})
          local_health = load(local_root / "data/llm_health.json", {})
          if isinstance(remote_health, dict) and isinstance(local_health, dict):
              merged_health = dict(remote_health)
              for key in ("observed_failures", "observed_events"):
                  merged_health[key] = max(int(remote_health.get(key, 0) or 0), int(local_health.get(key, 0) or 0))
              for key in ("models", "providers"):
                  merged = dict(remote_health.get(key) or {})
                  merged.update(local_health.get(key) or {})
                  merged_health[key] = merged
              dump(root / "data/llm_health.json", merged_health)
          PY
            git add data/seen.json data/telegram_feedback.json data/education_state.json data/publication_state.json data/llm_health.json
            if git diff --cached --quiet; then
              echo "No production state changes to commit."
              exit 0
            fi
            git commit -m "chore: persist production state [skip ci]"
            if git push origin HEAD:main; then
              echo "Production state persisted on attempt ${attempt} with remote-state merge."
              exit 0
            fi
            git reset --hard origin/main
            sleep $((attempt * 2))
          done
          echo "Unable to persist production state after 3 attempts."
          exit 1

      - name: Upload production diagnostics and ranking audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-future-radar-push-${{ github.run_number }}
          path: |
            run.log
            artifacts/ranking_audit/
            artifacts/free_model_registry.runtime.yaml
          retention-days: 14
          if-no-files-found: warn
          compression-level: 6
