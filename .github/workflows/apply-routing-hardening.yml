name: Apply Routing Hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply deterministic patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          
          root = Path('.')
          
          # 1) Remove the only routing-specific Ruff F841 without changing behavior.
          p = root / 'src' / 'llm_router_light.py'
          s = p.read_text(encoding='utf-8')
          old = 'except concurrent.futures.TimeoutError as exc:\n            last_error = TimeoutError(f"{name}: provider timeout")'
          new = 'except concurrent.futures.TimeoutError:\n            last_error = TimeoutError(f"{name}: provider timeout")'
          if old not in s:
              raise SystemExit('llm_router_light.py expected timeout block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          
          # 2) Make protected leader content participate in the publication summary budget.
          p = root / 'main.py'
          s = p.read_text(encoding='utf-8')
          old = '        if item.get("protected_slot"):\n            try: score = float(item.get("final_editorial_score", item.get("editorial_score", 0)) or 0)'
          new = '        if item.get("protected_slot") or item.get("protected_content"):\n            try: score = float(item.get("final_editorial_score", item.get("editorial_score", 0)) or 0)'
          if old not in s:
              raise SystemExit('main.py protected summary block not found')
          s = s.replace(old, new, 1)
          
          # 3) Replace the publication loop with bounded lazy downstream refill.
          pattern = re.compile(
              r'    print\("\[7/7\] Telegram publication"\); sent = 0\n'
              r'    for item in selected:.*?'
              r'    save_seen\(seen_hashes, seen_signatures, source_history\); print\(f"Posts sent: \{sent\}/\{len\(selected\)\}"\)',
              re.S,
          )
          replacement = '''    print("[7/7] Telegram publication"); sent = 0
    initial_selected_count = len(selected)
    publication_attempted = set()
    lazy_replacements = 0
    contract = load_editorial_contract()
    replacement_limit = max(0, int(contract.get("replacement_buffer", 0) or 0))
    next_candidate_index = 0

    def _publication_identity(item):
        return str(item.get("canonical_url") or item.get("link") or item.get("url") or item.get("title") or id(item))

    publication_attempted.update(_publication_identity(item) for item in selected)

    def _prepare_lazy_replacement():
        nonlocal lazy_replacements, next_candidate_index
        if lazy_replacements >= replacement_limit:
            return None
        while next_candidate_index < len(editorial_pool):
            candidate = editorial_pool[next_candidate_index]
            next_candidate_index += 1
            identity = _publication_identity(candidate)
            if identity in publication_attempted:
                continue
            candidate_score = float(candidate.get("final_editorial_score", candidate.get("editorial_score", 0)) or 0)
            is_protected = bool(candidate.get("protected_content"))
            if is_protected:
                if candidate_score < PROTECTED_SUMMARY_SCORE_FLOOR:
                    continue
            else:
                normal_rank = candidate.get("normal_period_rank")
                try:
                    normal_rank = int(normal_rank)
                except (TypeError, ValueError):
                    continue
                if normal_rank > int(contract.get("candidate_window", RANK_WINDOW)):
                    continue
                if candidate_score < NORMAL_SCORE_FLOOR:
                    continue
            candidate = dict(candidate)
            summary = summarize_fn(candidate)
            if not summary:
                candidate["_publication_blocked"] = True
                print(f"[Publication Lazy Refill] summary blocked; skipping candidate: {str(candidate.get('title',''))[:120]}", flush=True)
                continue
            candidate.update(summary)
            candidate["final_editorial_score"] = float(candidate.get("final_editorial_score", candidate.get("editorial_score", 0)) or 0)
            candidate["source_image"] = resolve_image_fn(candidate)
            publication_attempted.add(identity)
            lazy_replacements += 1
            print(
                f"[Publication Lazy Refill] prepared replacement={lazy_replacements}/{replacement_limit} "
                f"normal_rank={candidate.get('normal_period_rank')} score={candidate.get('final_editorial_score')} "
                f"title={str(candidate.get('title',''))[:120]}",
                flush=True,
            )
            return candidate
        return None

    for item in selected:
        if item.get("_publication_blocked"):
            continue
        try:
            source_name = str(item.get("source") or item.get("source_name") or "منبع"); link = str(item.get("link") or item.get("url") or ""); post = format_fn(item, source_name, link, is_video=str(item.get("source_type") or "").lower() in {"youtube", "video"}, published=item.get("published", ""), content_type=item.get("content_type", "news"), source_tier=item.get("source_tier", 3), source_type=item.get("source_type", "news"), leader=item.get("leader") or item.get("watch_person") or "")
            if not _publication_text_within_limit(post):
                replacement = _prepare_lazy_replacement()
                if replacement is not None:
                    selected.append(replacement)
                continue
            result = deliver_fn(post, image_url=str(item.get("source_image") or ""), source_link=link)
            if hasattr(result, "status"):
                status = getattr(result, "status"); status_value = getattr(status, "value", str(status))
                if status_value == "delivered":
                    sent += 1; persist_fn(item, seen_hashes, seen_signatures, source_history); continue
                if status_value in {"policy_blocked", "rejected", "duplicate"}:
                    print(f"[Publication Contract] candidate rejected reason={getattr(result, 'reason', '')}; continuing to next ranked candidate", flush=True)
                    replacement = _prepare_lazy_replacement()
                    if replacement is not None:
                        selected.append(replacement)
                    continue
                raise RuntimeError(f"Telegram transport failure: {getattr(result, 'reason', 'unknown')}")
            if not result:
                raise RuntimeError("Telegram delivery returned false")
            sent += 1; persist_fn(item, seen_hashes, seen_signatures, source_history)
        except Exception as exc:
            print(f"[ERROR] Telegram send failed for {item.get('title','')[:100]}: {exc}", flush=True)
    print(f"[Publication Lazy Refill] initial={initial_selected_count} lazy_replacements={lazy_replacements} final_attempt_queue={len(selected)}", flush=True)
    save_seen(seen_hashes, seen_signatures, source_history); print(f"Posts sent: {sent}/{len(selected)}")'''
          m = pattern.search(s)
          if not m:
              raise SystemExit('main.py publication loop pattern not found')
          s = s[:m.start()] + replacement + s[m.end():]
          p.write_text(s, encoding='utf-8')
          
          # 4) Make the changed-surface Ruff gate correspond to the routing surface.
          p = root / '.github' / 'workflows' / 'test-quality.yml'
          s = p.read_text(encoding='utf-8')
          old = '      - name: Ruff changed-surface gate\n        run: python -m ruff check --select F src/llm_router_light.py tests/test_hf_light_router.py'
          new = '      - name: Ruff changed-surface gate\n        run: python -m ruff check --select F src/llm_router_light.py src/free_model_registry.py src/production_router_policy.py tests/test_llm_health_persistence.py tests/test_nara_router_integration.py'
          if old not in s:
              raise SystemExit('test-quality Ruff gate not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          
          # 5) Extend Nara production validation with a non-publishing live smoke test.
          p = root / '.github' / 'workflows' / 'manual-routing-validation.yml'
          s = p.read_text(encoding='utf-8')
          marker = '      - name: Telegram preflight\n'
          smoke = '''      - name: Nara live smoke test\n        env:\n          NARAROUTER_API_KEY: ${{ secrets.NARAROUTER_API_KEY }}\n        run: |\n          python - <<'PY'\n          import os\n          import requests\n          key = os.environ.get("NARAROUTER_API_KEY", "").strip()\n          if not key:\n              print("[Nara Smoke] skipped: secret not configured")\n              raise SystemExit(0)\n          response = requests.post(\n              "https://router.bynara.id/v1/chat/completions",\n              headers={"Authorization": f"Bearer {key}", "Content-Type": "application/json"},\n              json={"model": "auto/bynara", "messages": [{"role": "user", "content": "Reply only with OK"}], "max_tokens": 8, "temperature": 0},\n              timeout=15,\n          )\n          print(f"[Nara Smoke] status={response.status_code}")\n          if response.ok:\n              data = response.json()\n              text = (((data.get("choices") or [{}])[0].get("message") or {}).get("content") or "").strip()\n              print(f"[Nara Smoke] success text={text[:32]}")\n          elif response.status_code in {401, 402, 403, 404, 429, 503}:\n              print(f"[Nara Smoke] non-success but expected provider-state response: {response.status_code}")\n          else:\n              response.raise_for_status()\n          PY\n'''
          if smoke not in s:
              if marker not in s:
                  raise SystemExit('manual validation insertion marker not found')
              s = s.replace(marker, smoke + marker, 1)
              p.write_text(s, encoding='utf-8')
          
          print('ROUTING_HARDENING_PATCHED')
          PY
      - name: Validate patches
        run: |
          python -m compileall -q main.py src scripts tests
          python -m pip install -q --disable-pip-version-check 'ruff>=0.12,<0.13'
          python -m ruff check --select F src/llm_router_light.py src/free_model_registry.py src/production_router_policy.py tests/test_llm_health_persistence.py tests/test_nara_router_integration.py
          python -m pytest -q tests/test_production_router_policy.py tests/test_free_model_registry.py tests/test_litellm_registry_integration.py tests/test_llm_router_resilience.py tests/test_llm_health_persistence.py tests/test_nara_router_integration.py
      - name: Commit patched repository and remove this workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f .github/workflows/apply-routing-hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.py src/llm_router_light.py .github/workflows/test-quality.yml .github/workflows/manual-routing-validation.yml .github/workflows/apply-routing-hardening.yml
          git commit -m 'fix: harden routing health and lazy publication refill' || exit 0
          git push origin HEAD:main
