education_curriculum_expansion:
  enabled: true
  version: "2026.10"
  reviewed_at: "2026-10-13"
  policy:
    rule: "Add new, non-repeating educational pairs as the existing curriculum is consumed. Prefer durable concepts that expand AI, agent, evaluation, infrastructure, multimodality, safety, and reliability coverage. Runtime freshness and authority gates remain mandatory."
  lessons:
    - id: 115
      status: established
      title: "Retrieval-Augmented Generation و Grounded Generation"
      domain: "AI systems"
      a: {term: "Retrieval-Augmented Generation (RAG)", fa: "تولید تقویت‌شده با بازیابی", seed: "الگویی که پیش از تولید پاسخ، اطلاعات مرتبط را از یک مجموعه منبع بازیابی می‌کند و آن اطلاعات را در اختیار مدل قرار می‌دهد تا پاسخ به شواهد بیرونی متصل شود."}
      b: {term: "Grounded Generation", fa: "تولید متکی بر شواهد", seed: "تولید پاسخ با تکیه بر اطلاعات یا شواهدی که سامانه به‌صورت صریح در اختیار مدل قرار داده است و می‌توان مبنای پاسخ را نسبت به آن بررسی کرد."}
      relation: "RAG یک معماری مشخص برای بازیابی و سپس تولید است؛ grounded generation مفهوم وسیع‌تری برای پیوند دادن خروجی مدل با شواهد در دسترس است."
      sources:
        - {name: "NIST AI Resource Center", url: "https://airc.nist.gov/", year: 2026}
        - {name: "Microsoft Learn AI", url: "https://learn.microsoft.com/en-us/ai/", year: 2026}
    - id: 116
      status: established
      title: "AI Evaluation و Continuous Evaluation"
      domain: "AI evaluation"
      a: {term: "AI Evaluation", fa: "ارزیابی هوش مصنوعی", seed: "فرایند سنجش یک سامانه یا مدل با معیارها و آزمون‌های مشخص برای بررسی کیفیت، قابلیت اطمینان، ایمنی یا تناسب آن با هدف."}
      b: {term: "Continuous Evaluation", fa: "ارزیابی پیوسته", seed: "اجرای ارزیابی به‌صورت تکرارشونده در طول چرخه توسعه و بهره‌برداری تا تغییرات مدل، داده یا محیط باعث افت نامشهود کیفیت نشوند."}
      relation: "AI evaluation یک فعالیت کلی است؛ continuous evaluation همان فعالیت را به یک چرخه مستمر در طول عمر سامانه تبدیل می‌کند."
      sources:
        - {name: "NIST AI Resource Center", url: "https://airc.nist.gov/", year: 2026}
        - {name: "Anthropic Engineering", url: "https://www.anthropic.com/engineering", year: 2026}
    - id: 117
      status: established
      title: "AI Observability و AI Tracing"
      domain: "AI reliability"
      a: {term: "AI Observability", fa: "قابلیت مشاهده سامانه AI", seed: "توانایی فهم رفتار، خطا، کارایی و وضعیت یک سامانه AI از طریق سیگنال‌های ثبت‌شده در زمان اجرا."}
      b: {term: "AI Tracing", fa: "ردگیری اجرای AI", seed: "ثبت مسیر گام‌به‌گام اجرای درخواست، فراخوانی ابزار، مدل، زمان‌بندی و نتیجه‌ها برای بررسی و اشکال‌زدایی رفتار سامانه."}
      relation: "Observability دامنه وسیع‌تری از مشاهده وضعیت سامانه است؛ tracing یکی از ابزارهای کلیدی برای مشاهده مسیر دقیق اجرای یک درخواست است."
      sources:
        - {name: "NIST AI Resource Center", url: "https://airc.nist.gov/", year: 2026}
        - {name: "OpenAI Platform Documentation", url: "https://platform.openai.com/docs/", year: 2026}
    - id: 118
      status: emerging
      title: "Model Routing و Model Cascading"
      domain: "AI infrastructure"
      a: {term: "Model Routing", fa: "مسیریابی مدل", seed: "انتخاب یک مدل مناسب برای هر درخواست بر پایه ویژگی‌های کار، هزینه، کیفیت، ظرفیت یا محدودیت‌های عملیاتی."}
      b: {term: "Model Cascading", fa: "زنجیره‌سازی مدل‌ها", seed: "فرایندی که در آن یک سامانه می‌تواند از یک مدل اولیه استفاده کند و در صورت نامناسب بودن نتیجه یا برآورده نشدن شرایط، به مدل دیگری منتقل شود."}
      relation: "Routing بیشتر بر انتخاب مدل برای یک درخواست تمرکز دارد؛ cascading توالی تصمیم و انتقال بین مدل‌ها را نیز در بر می‌گیرد."
      sources:
        - {name: "NIST AI Resource Center", url: "https://airc.nist.gov/", year: 2026}
        - {name: "OpenAI Platform Documentation", url: "https://platform.openai.com/docs/", year: 2026}
    - id: 119
      status: established
      title: "Structured Output و Schema-Constrained Generation"
      domain: "LLM systems"
      a: {term: "Structured Output", fa: "خروجی ساختاریافته", seed: "تولید پاسخ در یک ساختار قابل پیش‌بینی مانند مجموعه‌ای از فیلدها یا قالب داده‌ای که برنامه بتواند آن را مستقیماً پردازش کند."}
      b: {term: "Schema-Constrained Generation", fa: "تولید مقید به شِمای داده", seed: "هدایت تولید مدل با یک schema مشخص تا پاسخ از نظر ساختار داده با قرارداد مورد انتظار سامانه سازگار بماند."}
      relation: "Structured output نتیجه قابل پردازش را توصیف می‌کند؛ schema-constrained generation یکی از روش‌های کنترل تولید برای رسیدن به آن نتیجه است."
      sources:
        - {name: "OpenAI Platform Documentation", url: "https://platform.openai.com/docs/", year: 2026}
        - {name: "Google AI Developers", url: "https://ai.google.dev/", year: 2026}
    - id: 120
      status: established
      title: "Multimodal AI و Multimodal Agent"
      domain: "multimodal AI"
      a: {term: "Multimodal AI", fa: "هوش مصنوعی چندوجهی", seed: "سامانه‌ای که می‌تواند بیش از یک نوع داده مانند متن، تصویر، صدا یا ویدئو را دریافت، پردازش یا تولید کند."}
      b: {term: "Multimodal Agent", fa: "عامل چندوجهی", seed: "عامل AI که در چرخه تصمیم و اقدام خود از ورودی یا خروجی‌های چندوجهی استفاده می‌کند و آن‌ها را با ابزارها و برنامه‌ریزی عامل ترکیب می‌کند."}
      relation: "Multimodal AI یک قابلیت یا معماری پردازشی را توصیف می‌کند؛ multimodal agent این قابلیت را در یک چرخه عامل‌محور به کار می‌گیرد."
      sources:
        - {name: "Google AI Developers", url: "https://ai.google.dev/", year: 2026}
        - {name: "Microsoft Learn AI", url: "https://learn.microsoft.com/en-us/ai/", year: 2026}
    - id: 121
      status: established
      title: "AI Safety Evaluation و Red Teaming"
      domain: "AI safety"
      a: {term: "AI Safety Evaluation", fa: "ارزیابی ایمنی AI", seed: "آزمون نظام‌مند رفتار یک سامانه هوش مصنوعی برای شناسایی ریسک‌ها، شکست‌ها و شرایطی که می‌توانند باعث پیامد نامطلوب شوند."}
      b: {term: "Red Teaming", fa: "آزمون مهاجمانه", seed: "تلاش برنامه‌ریزی‌شده برای پیدا کردن راه‌های سوءاستفاده، شکست یا دور زدن کنترل‌های سامانه با قرار دادن آن در سناریوهای چالش‌برانگیز."}
      relation: "Safety evaluation حوزه وسیع سنجش ریسک است؛ red teaming یک روش فعال و مهاجمانه برای آشکار کردن شکست‌های احتمالی است."
      sources:
        - {name: "NIST AI Resource Center", url: "https://airc.nist.gov/", year: 2026}
        - {name: "Anthropic Engineering", url: "https://www.anthropic.com/engineering", year: 2026}
    - id: 122
      status: established
      title: "AI Governance و AI Assurance"
      domain: "AI governance"
      a: {term: "AI Governance", fa: "حاکمیت هوش مصنوعی", seed: "مجموعه سیاست‌ها، نقش‌ها، تصمیم‌ها و سازوکارهای نظارتی برای هدایت توسعه و استفاده مسئولانه از سامانه‌های AI."}
      b: {term: "AI Assurance", fa: "تضمین AI", seed: "فرایندهای جمع‌آوری شواهد و بررسی‌های نظام‌مند برای اطمینان از اینکه یک سامانه AI با الزامات، کنترل‌ها و معیارهای تعریف‌شده سازگار است."}
      relation: "Governance چارچوب تصمیم‌گیری و مسئولیت را مشخص می‌کند؛ assurance شواهد و ارزیابی لازم برای اعتماد به اجرای آن چارچوب را فراهم می‌کند."
      sources:
        - {name: "NIST AI Resource Center", url: "https://airc.nist.gov/", year: 2026}
        - {name: "Microsoft Learn AI", url: "https://learn.microsoft.com/en-us/ai/", year: 2026}

    - id: 123
      status: established
      title: "Agent Evaluation Task و Trial"
      domain: "AI evaluation"
      a: {term: "Agent Evaluation Task", fa: "وظیفه آزمون عامل", seed: "تعریف یک مسئله آزمون با ورودی مشخص، محیط و معیارهای صریح برای موفقیت یا شکست عامل."}
      b: {term: "Trial", fa: "نوبت اجرای آزمون", seed: "یک بار اجرای وظیفه آزمون؛ چون رفتار عامل و مدل می‌تواند بین اجراها تغییر کند، یک Task ممکن است به چند Trial نیاز داشته باشد."}
      relation: "Task مسئله و معیار موفقیت را تعریف می‌کند؛ Trial یک اجرای مشخص از آن آزمون است. تفکیک این دو برای مقایسه منصفانه، تحلیل نوسان عملکرد و بازتولید خطا ضروری است."
      sources:
        - {name: "Anthropic: Demystifying evals for AI agents", url: "https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents", year: 2026}
        - {name: "OpenAI: Evaluate agent workflows", url: "https://platform.openai.com/docs/guides/agent-evals", year: 2026}
    - id: 124
      status: established
      title: "Computer Use Agent و Action Handler"
      domain: "AI agents"
      a: {term: "Computer Use Agent", fa: "عامل کار با رابط رایانه", seed: "عاملی که وضعیت رابط کاربری را از تصویر یا سیگنال‌های محیط دریافت می‌کند و برای پیشبرد وظیفه، اقدام‌هایی مانند کلیک، تایپ یا پیمایش پیشنهاد می‌دهد."}
      b: {term: "Action Handler", fa: "اجراکننده اقدام", seed: "بخش برنامه که اقدام پیشنهادی مدل را دریافت می‌کند، اعتبار آن را بررسی می‌کند، در محیط اجرا می‌کند و وضعیت تازه را برای گام بعدی برمی‌گرداند."}
      relation: "پیشنهاد مدل به‌خودی‌خود اجرای امن نیست؛ Action Handler مرز میان خروجی مدل و اثر واقعی روی مرورگر یا دسکتاپ است و باید مجوز، محدوده اقدام و نتیجه اجرا را کنترل کند."
      sources:
        - {name: "OpenAI: Computer use", url: "https://platform.openai.com/docs/guides/tools-computer-use", year: 2026}
        - {name: "Google AI: Computer Use", url: "https://ai.google.dev/gemini-api/docs/computer-use", year: 2026}
    - id: 125
      status: established
      title: "Realtime Voice Agent و Turn Detection"
      domain: "Multimodal AI"
      a: {term: "Realtime Voice Agent", fa: "عامل صوتی بلادرنگ", seed: "عاملی که ورودی و خروجی صوتی را در یک نشست پیوسته و با تأخیر کم پردازش می‌کند و می‌تواند گفت‌وگو را با ابزار یا تصمیم‌گیری ترکیب کند."}
      b: {term: "Turn Detection", fa: "تشخیص پایان نوبت گفتار", seed: "سازوکاری برای برآورد اینکه کاربر مکث کرده، صحبتش تمام شده یا هنوز در حال بیان درخواست است؛ این تصمیم زمان پاسخ‌گویی عامل را کنترل می‌کند."}
      relation: "Realtime به معماری ارتباط کم‌تأخیر اشاره دارد؛ Turn Detection مرز نوبت‌های مکالمه را تعیین می‌کند. تشخیص زودهنگام یا دیرهنگام نوبت می‌تواند باعث قطع حرف کاربر یا افزایش زمان پاسخ شود."
      sources:
        - {name: "OpenAI: Realtime API", url: "https://platform.openai.com/docs/guides/realtime", year: 2026}
        - {name: "Google AI: Gemini Live API", url: "https://ai.google.dev/gemini-api/docs/live", year: 2026}
    - id: 126
      status: established
      title: "MCP Authorization و Tool-Level Approval"
      domain: "AI security"
      a: {term: "MCP Authorization", fa: "مجوزدهی در پروتکل MCP", seed: "سازوکار احراز و واگذاری دسترسی میان MCP client و سرور، با رعایت دامنه مجوزها و الزامات پروتکل."}
      b: {term: "Tool-Level Approval", fa: "تأیید در سطح ابزار", seed: "سیاست برنامه برای تعیین اینکه کدام فراخوانی ابزار، به‌ویژه اقدام دارای اثر بیرونی، مجاز است یا پیش از اجرا به تأیید انسان نیاز دارد."}
      relation: "مجوزدهی پروتکلی هویت و دسترسی پایه را مشخص می‌کند؛ تأیید در سطح ابزار کنترل دقیق‌تری روی عملیات، داده و پیامد آن دارد. داشتن توکن معتبر به‌تنهایی مجوز اجرای هر اقدام را ایجاد نمی‌کند."
      sources:
        - {name: "Model Context Protocol: Authorization", url: "https://modelcontextprotocol.io/specification/2025-11-25/basic/authorization", year: 2025}
        - {name: "NIST: AI Agent Standards Initiative", url: "https://www.nist.gov/artificial-intelligence/ai-agent-standards-initiative", year: 2026}
    - id: 127
      status: established
      title: "Agent Handoff و Multi-Agent Orchestration"
      domain: "AI agents"
      a: {term: "Agent Handoff", fa: "واگذاری کار بین عامل‌ها", seed: "انتقال کنترل یا ادامه یک کار از یک عامل به عامل دیگر، معمولاً همراه با زمینه، هدف و مسئولیت مرحله بعد."}
      b: {term: "Multi-Agent Orchestration", fa: "هماهنگ‌سازی چندعامل", seed: "طراحی جریان کلی کار بین چند عامل؛ از جمله انتخاب مسئول، ترتیب اجرا، تقسیم وظیفه، تجمیع نتیجه و مدیریت شکست."}
      relation: "Handoff یک رویداد مشخص انتقال کنترل است؛ Orchestration منطق جامع هماهنگی کل جریان را تعیین می‌کند. تعداد بیشتر عامل‌ها بدون تقسیم مسئولیت روشن لزوماً کیفیت را بهتر نمی‌کند."
      sources:
        - {name: "OpenAI: Agents guide", url: "https://platform.openai.com/docs/guides/agents", year: 2026}
        - {name: "Anthropic: Building Effective AI Agents", url: "https://www.anthropic.com/research/building-effective-agents", year: 2026}
    - id: 128
      status: established
      title: "Schema Conformance و Semantic Validation"
      domain: "LLM systems"
      a: {term: "Schema Conformance", fa: "انطباق با شِمای داده", seed: "درستی شکل پاسخ نسبت به قرارداد داده؛ مانند وجود فیلدهای لازم، نوع داده و قالب قابل پردازش."}
      b: {term: "Semantic Validation", fa: "اعتبارسنجی معنایی", seed: "بررسی اینکه محتوای پاسخ از نظر معنا، شواهد، قیود کسب‌وکار و نتیجه مورد انتظار واقعاً درست است."}
      relation: "پاسخ می‌تواند از نظر JSON و شِما کاملاً معتبر اما از نظر محتوا نادرست باشد. سامانه قابل‌اعتماد باید کنترل ساختار را از بررسی معنا و پشتوانه ادعا جدا کند."
      sources:
        - {name: "OpenAI: Structured model outputs", url: "https://platform.openai.com/docs/guides/structured-outputs", year: 2026}
        - {name: "Google AI: Structured outputs", url: "https://ai.google.dev/gemini-api/docs/structured-output", year: 2026}
    - id: 129
      status: established
      title: "Indirect Prompt Injection و Tool Output Isolation"
      domain: "AI security"
      a: {term: "Indirect Prompt Injection", fa: "تزریق غیرمستقیم دستور", seed: "حالتی که دستورهای خصمانه در محتوای بازیابی‌شده، صفحه وب، فایل یا خروجی ابزار پنهان می‌شوند و تلاش می‌کنند رفتار عامل را منحرف کنند."}
      b: {term: "Tool Output Isolation", fa: "جداسازی خروجی ابزار", seed: "طراحی جریان اجرا به‌گونه‌ای که محتوای برگشتی ابزار به‌عنوان داده غیرقابل‌اعتماد تلقی شود، نه دستور معتبر برای تغییر سیاست یا فراخوانی ابزارهای بعدی."}
      relation: "تزریق غیرمستقیم یک تهدید ناشی از اعتماد نابجا به داده بیرونی است؛ جداسازی خروجی ابزار، محدودسازی اختیار و کنترل اقدام‌های حساس، احتمال تبدیل آن داده به عمل ناخواسته را کاهش می‌دهد."
      sources:
        - {name: "OpenAI: Safety best practices", url: "https://platform.openai.com/docs/guides/safety-best-practices", year: 2026}
        - {name: "NIST: AI Agent Standards Initiative", url: "https://www.nist.gov/artificial-intelligence/ai-agent-standards-initiative", year: 2026}
    - id: 130
      status: established
      title: "Agent Sandbox و Least-Privilege Execution"
      domain: "AI infrastructure"
      a: {term: "Agent Sandbox", fa: "محیط ایزوله عامل", seed: "محیط اجرای محدودشده‌ای که دسترسی عامل به فایل‌ها، شبکه، پردازش و میزبان را از محیط اصلی جدا می‌کند تا اثر خطا یا اقدام مخرب محدود بماند."}
      b: {term: "Least-Privilege Execution", fa: "اجرای با حداقل دسترسی", seed: "اعطای فقط همان مجوزها، ابزارها و منابعی که یک وظیفه مشخص به آن‌ها نیاز دارد و حذف دسترسی‌های غیرضروری."}
      relation: "Sandbox مرز محیط اجرا را محدود می‌کند؛ Least Privilege دامنه اختیار عامل را. این دو مکمل‌اند و هیچ‌کدام به‌تنهایی جای کنترل خروجی ابزار، ثبت رویداد و تأیید اقدام حساس را نمی‌گیرند."
      sources:
        - {name: "OpenAI: Agents guide and sandbox agents", url: "https://platform.openai.com/docs/guides/agents", year: 2026}
        - {name: "NIST: AI Agent Standards Initiative", url: "https://www.nist.gov/artificial-intelligence/ai-agent-standards-initiative", year: 2026}
