<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Future Radar — ChatGPT</title></head>
<body><p>در حال انتقال به ChatGPT…</p><script>
(function () {

  const title = (p.get('t') || '').trim();
  const source = (p.get('u') || '').trim();

    document.body.innerHTML = '<p>پیوند ChatGPT ناقص است.</p>';
    return;

  const prompt = [

    '',
    'ساختار تحلیل:',
    '1) مفاهیم پایه و پیش‌نیازها: اصطلاحات، فناوری‌ها، نظریه‌ها و مفاهیمی را که برای فهم مطلب ضروری‌اند شناسایی و به زبان روشن توضیح بده. فقط مفاهیم مرتبط را بیاور و از تعریف‌های زائد پرهیز کن.',
    '2) تشریح موضوع: توضیح بده دقیقاً چه ایده، فناوری، پژوهش، رویداد یا ادعایی مطرح شده، چگونه کار می‌کند و چه مسئله‌ای را هدف می‌گیرد. متن خبر را صرفاً بازنویسی نکن؛ لایه مفهومی آن را روشن کن.',
    '3) ترند و زمینه: مشخص کن این مطلب بخشی از کدام روند بزرگ‌تر فناوری است، روند از کجا به کجا حرکت می‌کند و این مطلب چه سیگنال یا تغییری نسبت به وضعیت قبلی نشان می‌دهد.',
    '4) اهمیت و پیامدها: توضیح بده چرا موضوع مهم است و چه پیامدهای محتملی برای پژوهش، صنعت، کسب‌وکار، جامعه یا مسیر توسعه فناوری دارد؛ فقط موارد مرتبط را مطرح کن.',
    '5) پیوندهای بین‌رشته‌ای: اگر ارتباط معناداری با حوزه‌هایی مانند هوش مصنوعی، رباتیک، کوانتوم، BCI، bio-AI، شناخت/آگاهی یا سایر فناوری‌های نوظهور وجود دارد، آن ارتباط را دقیق و مشخص توضیح بده؛ ارتباط مصنوعی یا کلی ایجاد نکن.',
    '6) مسیر آینده: بر اساس اطلاعات موجود، روند احتمالی کوتاه‌مدت و میان‌مدت را توضیح بده و میان واقعیت‌های موجود، استنباط تحلیلی و پیش‌بینی آینده مرز روشن بگذار. از قطعیت کاذب پرهیز کن.',

    '',
    'قواعد کیفیت: تحلیل باید اختصاصی برای همین مطلب باشد، از کلی‌گویی و تکرار خلاصه اصلی پرهیز کند، مفاهیم پایه را متناسب با پیچیدگی مطلب توضیح دهد، و هرجا داده کافی برای نتیجه‌گیری وجود ندارد آن را صریحاً بیان کند. بخش‌های غیرمرتبط را حذف کن.',
    '',
