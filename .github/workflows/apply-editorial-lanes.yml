name: Apply editorial lanes

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[migrate-lanes]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Migrate editorial lanes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def must_replace(path, pattern, replacement, count=1, flags=re.S):
              p=Path(path); s=p.read_text(encoding='utf-8'); ns,n=re.subn(pattern,replacement,s,count=count,flags=flags)
              if n != count: raise SystemExit(f'patch failed: {path} expected {count}, got {n} for {pattern[:100]}')
              p.write_text(ns,encoding='utf-8')

          # Production entrypoint: technical lane and normal competitive gate.
          must_replace('production_entrypoint.py', r'from src\.protected_editorial_lane import SPECIAL_MAX_PER_PERIOD, choose_additive_candidates\n', 'from src.protected_editorial_lane import SPECIAL_MAX_PER_PERIOD, choose_additive_candidates\nfrom src.technical_trend_lane import choose_technical_trend_candidate\n')
          must_replace('production_entrypoint.py', r'MAX_MIND_IDEAS_VOICES_PER_PERIOD = SPECIAL_MAX_PER_PERIOD\n', 'MAX_MIND_IDEAS_VOICES_PER_PERIOD = SPECIAL_MAX_PER_PERIOD\nMAX_TECHNICAL_TREND_PER_PERIOD = 1\nNORMAL_RELATIVE_SCORE_GAP = 8.0\n')
          must_replace('production_entrypoint.py', r'def _item_final_score\(item: dict\) -> float:\n    if _is_mind_ideas_voices\(item\):', 'def _is_technical_trend(item: dict) -> bool:\n    return bool(item.get("technical_trend_lane_selected") or item.get("editorial_lane") == "technical_trend")\n\n\ndef _item_final_score(item: dict) -> float:\n    if _is_technical_trend(item):\n        try:\n            return float(item.get("technical_trend_score", 0.0) or 0.0)\n        except (TypeError, ValueError):\n            return 0.0\n    if _is_mind_ideas_voices(item):', count=1)
          must_replace('production_entrypoint.py', r'def _bound_runtime_candidates\(candidates, max_posts: int, policy: dict\):\n    candidates = list\(candidates or \[\]\)\n    mind = \[item for item in candidates if _is_mind_ideas_voices\(item\)\]\[:MAX_MIND_IDEAS_VOICES_PER_PERIOD\]\n    non_mind = \[item for item in candidates if not _is_mind_ideas_voices\(item\)\]\n', 'def _competitive_normal_candidates(candidates):\n    candidates=list(candidates or [])\n    regular=[x for x in candidates if not _is_mind_ideas_voices(x) and not _is_technical_trend(x) and not x.get("_rank_is_tier0")]\n    protected=[x for x in candidates if x.get("_rank_is_tier0")]\n    if not regular:\n        return candidates\n    scores=[float(x.get("final_editorial_score", x.get("editorial_score", 0)) or 0.0) for x in regular]\n    best=max(scores)\n    cutoff=max(float(NORMAL_SCORE_FLOOR), best-NORMAL_RELATIVE_SCORE_GAP)\n    kept=[x for x in regular if float(x.get("final_editorial_score", x.get("editorial_score", 0)) or 0.0) >= cutoff]\n    print(f"[Normal Competitive Gate] candidates={len(regular)} best={best:.2f} cutoff={cutoff:.2f} gap={NORMAL_RELATIVE_SCORE_GAP:.1f} kept={len(kept)} dropped={len(regular)-len(kept)}", flush=True)\n    return protected+kept\n\n\ndef _bound_runtime_candidates(candidates, max_posts: int, policy: dict):\n    candidates = list(candidates or [])\n    mind = [item for item in candidates if _is_mind_ideas_voices(item)][:MAX_MIND_IDEAS_VOICES_PER_PERIOD]\n    technical = [item for item in candidates if _is_technical_trend(item)][:MAX_TECHNICAL_TREND_PER_PERIOD]\n    non_mind = [item for item in candidates if not _is_mind_ideas_voices(item) and not _is_technical_trend(item)]\n', count=1)
          must_replace('production_entrypoint.py', r'for item in protected \+ normals \+ mind:', 'for item in protected + normals + technical + mind:', count=1, flags=0)
          must_replace('production_entrypoint.py', r'normal=\{len\(normals\)\} protected=\{len\(protected\)\} mind_ideas_voices=\{len\(mind\)\} output=\{len\(bounded\)\}', 'normal={len(normals)} protected={len(protected)} technical_trend={len(technical)} mind_ideas_voices={len(mind)} output={len(bounded)}', count=1, flags=0)

          old='''        normal_candidates = unique_candidates(original_select(items, max(candidate_window, min(len(items), max_posts)), max_per_source, max_per_type, policy))
        normal_ids = {id(item) for item in normal_candidates}
        mind_candidates = choose_additive_candidates(items, existing_ids=normal_ids, max_items=MAX_MIND_IDEAS_VOICES_PER_PERIOD)
        for item in mind_candidates:
            print(f"[Mind/Ideas/Voices Selection] rank={item.get('mind_period_rank')} score={item.get('mind_editorial_score')} normal_score={item.get('editorial_score', 0)} normal_rank=None title={str(item.get('title', ''))[:120]}", flush=True)
        candidates = unique_candidates(normal_candidates + mind_candidates)
        print(f"[Dual Lane Selection] normal={len(normal_candidates)} mind_ideas_voices={len(mind_candidates)} mind_cap={MAX_MIND_IDEAS_VOICES_PER_PERIOD} mind_score_floor=not_applied", flush=True)
'''
          new='''        normal_candidates = _competitive_normal_candidates(unique_candidates(original_select(items, max(candidate_window, min(len(items), max_posts)), max_per_source, max_per_type, policy)))
        normal_ids = {id(item) for item in normal_candidates}
        mind_candidates = choose_additive_candidates(items, existing_ids=normal_ids, max_items=MAX_MIND_IDEAS_VOICES_PER_PERIOD)
        mind_ids = {id(item) for item in mind_candidates}
        for item in mind_candidates:
            print(f"[Mind/Ideas/Voices Selection] rank={item.get('mind_period_rank')} score={item.get('mind_editorial_score')} normal_score={item.get('editorial_score', 0)} normal_rank=None title={str(item.get('title', ''))[:120]}", flush=True)
        technical_candidates = choose_technical_trend_candidate(items, existing_ids=normal_ids | mind_ids, max_items=MAX_TECHNICAL_TREND_PER_PERIOD)
        for item in technical_candidates:
            print(f"[Technical Trend Selection] rank={item.get('technical_trend_period_rank')} score={item.get('technical_trend_score')} source={item.get('source')} title={str(item.get('title', ''))[:120]}", flush=True)
        candidates = unique_candidates(normal_candidates + technical_candidates + mind_candidates)
        print(f"[Triple Lane Selection] normal={len(normal_candidates)} technical_trend={len(technical_candidates)} mind_ideas_voices={len(mind_candidates)} technical_cap={MAX_TECHNICAL_TREND_PER_PERIOD} mind_cap={MAX_MIND_IDEAS_VOICES_PER_PERIOD} mind_score_floor=not_applied", flush=True)
'''
          if old not in Path('production_entrypoint.py').read_text(encoding='utf-8'): raise SystemExit('selection block not found')
          Path('production_entrypoint.py').write_text(Path('production_entrypoint.py').read_text(encoding='utf-8').replace(old,new,1),encoding='utf-8')

          # Render state and technical policy.
          must_replace('production_entrypoint.py', r'"mind_ideas_voices_delivered_count": 0, "tier0_news_delivered_count": 0', '"mind_ideas_voices_delivered_count": 0, "technical_trend_delivered_count": 0, "tier0_news_delivered_count": 0', count=1, flags=0)
          must_replace('production_entrypoint.py', r'            if _is_mind_ideas_voices\(item\):\n                item\["final_editorial_score"\] = float\(item.get\("mind_editorial_score", 0\) or 0\)\n                lane = "mind_ideas_voices"\n            else:', '            if _is_mind_ideas_voices(item):\n                item["final_editorial_score"] = float(item.get("mind_editorial_score", 0) or 0)\n                lane = "mind_ideas_voices"\n            elif _is_technical_trend(item):\n                item["final_editorial_score"] = float(item.get("technical_trend_score", 0) or 0)\n                lane = "technical_trend"\n            else:', count=1)
          must_replace('production_entrypoint.py', r'is_mind = _is_mind_ideas_voices\(item\)\n                is_tier0 = _is_tier0_publication_candidate\(item\)', 'is_mind = _is_mind_ideas_voices(item)\n                is_technical = _is_technical_trend(item)\n                is_tier0 = _is_tier0_publication_candidate(item)', count=1)
          must_replace('production_entrypoint.py', r'if not is_mind and not is_tier0:', 'if not is_mind and not is_technical and not is_tier0:', count=1, flags=0)
          must_replace('production_entrypoint.py', r'if is_mind:\n                    render_state\["mind_ideas_voices_delivered_count"\] \+= 1\n                elif is_tier0:', 'if is_mind:\n                    render_state["mind_ideas_voices_delivered_count"] += 1\n                elif is_technical:\n                    render_state["technical_trend_delivered_count"] += 1\n                elif is_tier0:', count=1)
          must_replace('production_entrypoint.py', r'lane = "mind_ideas_voices" if is_mind else \("tier0" if is_tier0 else "normal"\)', 'lane = "mind_ideas_voices" if is_mind else ("technical_trend" if is_technical else ("tier0" if is_tier0 else "normal"))', count=1, flags=0)
          must_replace('production_entrypoint.py', r'is_mind = _is_mind_ideas_voices\(story\)\n        priority_person = _is_tier0_publication_candidate\(story\)', 'is_mind = _is_mind_ideas_voices(story)\n        is_technical = _is_technical_trend(story)\n        priority_person = _is_tier0_publication_candidate(story)', count=1)
          marker='        if strategic_analytical and render_state["strategic_analytical_news_delivered_count"] >= STRATEGIC_ANALYTICAL_MAX_PER_PERIOD:\n'
          block='''        if is_technical:\n            if render_state["technical_trend_delivered_count"] >= MAX_TECHNICAL_TREND_PER_PERIOD:\n                return policy_blocked("technical_trend_quota_exhausted")\n            if not _news_language_ok(story):\n                return policy_blocked("news_language_gate")\n            score = _item_final_score(story)\n            print(f"[Publication Policy] PUBLISH technical_trend rank={story.get('technical_trend_period_rank')} score={score} normal_floor=not_applied normal_rank=None independent_lane=true cap={MAX_TECHNICAL_TREND_PER_PERIOD}", flush=True)\n            return delivered({"message_id": None})\n'''
          p=Path('production_entrypoint.py'); s=p.read_text(encoding='utf-8')
          if marker not in s: raise SystemExit('policy marker missing')
          p.write_text(s.replace(marker,block+marker,1),encoding='utf-8')
          must_replace('production_entrypoint.py', r'normal_max=\{MAX_NORMAL_NEWS_PER_PERIOD\} mind_ideas_voices=\{render_state\[\'mind_ideas_voices_delivered_count\'\]\}', 'normal_max={MAX_NORMAL_NEWS_PER_PERIOD} technical_trend={render_state[\'technical_trend_delivered_count\']} technical_max={MAX_TECHNICAL_TREND_PER_PERIOD} mind_ideas_voices={render_state[\'mind_ideas_voices_delivered_count\']}', count=1, flags=0)

          # Interview/podcast recall in Mind lane.
          must_replace('src/protected_editorial_lane.py', r'INTERVIEW_TYPES = \{\n    "interview", "podcast", "talk", "lecture", "fireside", "conversation", "discussion", "q&a",\n\}\n', 'INTERVIEW_TYPES = {\n    "interview", "podcast", "talk", "lecture", "fireside", "conversation", "discussion", "q&a",\n}\nINTERVIEW_SIGNAL_TERMS = (r"\\binterview\\b", r"\\bpodcast\\b", r"\\bconversation\\b", r"\\bfireside\\b", r"\\bq&a\\b", r"\\bdiscussion\\b", r"\\bguest\\b", r"\\bepisode\\b")\n', count=1)
          must_replace('src/protected_editorial_lane.py', r'def _thematic_signal\(item: dict\[str, Any\]\) -> bool:\n    return any\(re.search\(pattern, _text\(item\)\) for pattern in SPECIAL_SIGNAL_PATTERNS\)\n\n\ndef is_mind_ideas_voices_candidate', 'def _thematic_signal(item: dict[str, Any]) -> bool:\n    return any(re.search(pattern, _text(item)) for pattern in SPECIAL_SIGNAL_PATTERNS)\n\n\ndef _interview_signal(item: dict[str, Any]) -> bool:\n    content_type = str(item.get("content_type") or "").strip().casefold()\n    source_type = str(item.get("source_type") or item.get("type") or item.get("format") or "").strip().casefold()\n    text = _text(item)\n    return content_type in INTERVIEW_TYPES or source_type in INTERVIEW_TYPES or any(re.search(pattern, text) for pattern in INTERVIEW_SIGNAL_TERMS)\n\n\ndef is_mind_ideas_voices_candidate', count=1)
          must_replace('src/protected_editorial_lane.py', r'    content_type = str\(item.get\("content_type"\) or ""\)\.strip\(\)\.casefold\(\)\n    if mission == "mind_cognition" or thematic:\n        return True\n    if content_type in INTERVIEW_TYPES and \(registry_person or explicit_person or mission in MISSION_AREAS\):\n', '    content_type = str(item.get("content_type") or "").strip().casefold()\n    interview = _interview_signal(item)\n    if mission == "mind_cognition" or thematic:\n        return True\n    if interview and (registry_person or explicit_person or mission in MISSION_AREAS or thematic):\n', count=1)

          # Provider failure isolation.
          must_replace('main.py', r'except \(QuotaExceeded, TimeoutError, requests\.exceptions\.RequestException\) as exc:', 'except (QuotaExceeded, TimeoutError, ValueError, requests.exceptions.RequestException) as exc:', count=1, flags=0)

          # Publication summary + refill cap.
          p=Path('main.py'); s=p.read_text(encoding='utf-8')
          if 'def _is_technical_trend(item):' not in s:
              s=s.replace('def _publication_summary_budget(items, max_posts, policy):\n','def _is_technical_trend(item):\n    return bool(item.get("technical_trend_lane_selected") or item.get("editorial_lane") == "technical_trend")\n\n\ndef _publication_summary_budget(items, max_posts, policy):\n',1)
          s=s.replace('normal = [x for x in items if x not in protected and not _is_mind_ideas_voices(x)]','technical = [x for x in items if _is_technical_trend(x) and x not in protected and x not in mind][:1]\n    normal = [x for x in items if x not in protected and not _is_mind_ideas_voices(x) and not _is_technical_trend(x)]',1)
          s=s.replace('bounded = eligible_protected[:max_posts] + normal[:normal_window] + mind','bounded = eligible_protected[:max_posts] + normal[:normal_window] + technical + mind',1)
          s=s.replace('normal_limit={normal_window} mind_limit={MAX_MIND_IDEAS_VOICES_PER_PERIOD}','normal_limit={normal_window} technical_limit=1 mind_limit={MAX_MIND_IDEAS_VOICES_PER_PERIOD}',1)
          s=s.replace('max_posts + int(policy.get("leader_protected_max", 2) or 2) + MAX_MIND_IDEAS_VOICES_PER_PERIOD)','max_posts + int(policy.get("leader_protected_max", 2) or 2) + MAX_MIND_IDEAS_VOICES_PER_PERIOD + 1)',2)
          p.write_text(s,encoding='utf-8')

          Path('tests/test_technical_trend_lane.py').write_text('''from src.technical_trend_lane import choose_technical_trend_candidate, is_technical_trend_candidate\n\ndef test_top_technical_candidate_only():\n    items=[{"title":"MCP protocol for AI agents","summary":"Model Context Protocol architecture and runtime","source_type":"technical","source_tier":1,"category":"ai","published":"2026-09-15 10:00"},{"title":"General AI news","summary":"A new model was released","source_type":"news","source_tier":1,"category":"ai"}]\n    selected=choose_technical_trend_candidate(items)\n    assert len(selected)==1\n    assert selected[0]["technical_trend_lane_selected"] is True\n\ndef test_arxiv_reddit_excluded():\n    assert not is_technical_trend_candidate({"title":"New transformer architecture","summary":"AI inference architecture benchmark","source":"arXiv","source_type":"research","source_tier":1,"category":"ai"})\n    assert not is_technical_trend_candidate({"title":"AI inference architecture discussion","summary":"runtime and protocol trend","source":"Reddit community","source_type":"technical","source_tier":1,"category":"ai"})\n''',encoding='utf-8')
          Path('tests/test_mind_interview_recall.py').write_text('''from src.protected_editorial_lane import SPECIAL_MAX_PER_PERIOD, is_mind_ideas_voices_candidate, mind_ideas_voices_score\n\ndef test_podcast_conversation_recall():\n    item={"title":"Podcast: a conversation about AI consciousness","summary":"A deep discussion with a researcher","content_type":"video","source_type":"podcast","source":"Specialist Podcast","source_tier":1,"category":"mind"}\n    before=mind_ideas_voices_score(item)\n    assert is_mind_ideas_voices_candidate(item)\n    assert mind_ideas_voices_score(item)==before\n\ndef test_mind_cap_unchanged():\n    assert SPECIAL_MAX_PER_PERIOD==2\n''',encoding='utf-8')

          p=Path('tests/test_mission_coverage_priority.py'); s=p.read_text(encoding='utf-8')
          if 'assert annotated["final_editorial_score"] == 55.15' in s:
              s=s.replace('assert annotated["final_editorial_score"] == 55.15','assert annotated["final_editorial_score"] == 55.0\n    assert annotated["mind_lane_selected"] is True',1); p.write_text(s,encoding='utf-8')
          PY

          python -m compileall -q production_entrypoint.py main.py src/protected_editorial_lane.py src/technical_trend_lane.py tests/test_technical_trend_lane.py tests/test_mind_interview_recall.py
          python -m pytest -q tests/test_technical_trend_lane.py tests/test_mind_interview_recall.py tests/test_mission_coverage_priority.py tests/test_protected_editorial_lane.py tests/test_production_acceptance_guard.py tests/test_production_acceptance_contract.py tests/test_unified_editorial_selection.py

      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add production_entrypoint.py main.py src/protected_editorial_lane.py tests/test_technical_trend_lane.py tests/test_mind_interview_recall.py tests/test_mission_coverage_priority.py
          git commit -m 'feat: refine editorial lanes and add technical trend'
          git push origin HEAD:main
