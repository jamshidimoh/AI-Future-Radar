name: Education Pilot Preview

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  preview:
    if: contains(github.event.head_commit.message, '[education-pilot-preview]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current ref
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Refresh free-model registry
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          KIRAAI_API_KEY: ${{ secrets.KIRAAI_API_KEY }}
          NARAROUTER_API_KEY: ${{ secrets.NARAROUTER_API_KEY }}
          FREE_LLM_ROUTER_API_KEY: ${{ secrets.FREE_LLM_ROUTER_API_KEY }}
        run: python -u scripts/refresh_free_model_registry.py --strict
      - name: Bridge free-router discovery
        env:
          FREE_LLM_ROUTER_API_KEY: ${{ secrets.FREE_LLM_ROUTER_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -u scripts/bridge_free_llm_router.py
      - name: Generate isolated previews for lessons 55–57
        env:
          PYTHONUNBUFFERED: 1
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          KIRAAI_API_KEY: ${{ secrets.KIRAAI_API_KEY }}
          FREE_LLM_ROUTER_API_KEY: ${{ secrets.FREE_LLM_ROUTER_API_KEY }}
          HF_TOKEN: ${{ secrets.HUGGINGFACE_API_KEY || secrets.HF_TOKEN }}
          HF_MODEL: ${{ vars.HF_MODEL }}
          HF_POLICY: free-first
          RADAR_LLM_MAX_TOKENS: 1100
        run: python -u scripts/education_pilot_preview.py
      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: education-pilot-preview-${{ github.run_number }}
          path: artifacts/education_pilot_preview/
          retention-days: 14
          if-no-files-found: error
