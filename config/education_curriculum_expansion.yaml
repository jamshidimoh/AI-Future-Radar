education_curriculum_expansion:
  enabled: true
  version: "2026.11"
  reviewed_at: "2026-11-03"
  policy:
    rule: "Frontier lessons distinguish established evidence, active research, and philosophical hypotheses. No speculative claim may be presented as settled science."
  modules:
    - {id: 13, title: "مرزهای دانش و فناوری‌های همگرا", first_lesson: 115, last_lesson: 130, objective: "تحلیل انتقادی AI در علم، زیست‌فناوری، رباتیک، کوانتوم، علوم اعصاب، آگاهی و آینده‌پژوهی."}
  lessons:
    - id: 115
      domain: "embodied AI"
      status: "established"
      prerequisites: [53]
      title: "Embodied Intelligence و Sensorimotor Learning"
      a: {term: "Embodied Intelligence", fa: "هوش تجسم‌یافته", seed: "هوشی که از تعامل ادراکی-حرکتی با محیط فیزیکی یا شبیه‌سازی‌شده شکل می‌گیرد."}
      b: {term: "Sensorimotor Learning", fa: "یادگیری حسی-حرکتی", seed: "یادگیری رابطه میان ادراک، حرکت و پیامد کنش از تجربه."}
      relation: "تعامل بدن‌مند بستر است؛ یادگیری حسی-حرکتی سازوکار کسب مهارت از چرخه ادراک و حرکت است."
      core_question: "Embodied Intelligence و Sensorimotor Learning چه نسبتی دارند و شواهد علمی چه چیزی را پشتیبانی می‌کنند؟"
      practice: "برای این دو مفهوم، یک ادعای قابل آزمون و یک محدودیت شواهد مشخص کن."
      sources:
        - {name: "Stanford AI Index 2026: Science", url: "https://hai.stanford.edu/ai-index/2026-ai-index-report"}
        - {name: "NSF: Understanding the Brain and Robotics", url: "https://www.nsf.gov/focus-areas/brain"}
    - id: 116
      domain: "Reinforcement learning"
      status: "established"
      prerequisites: [34, 56]
      title: "Reinforcement Learning from Verifiable Rewards (RLVR) و Outcome Supervision"
      a: {term: "Reinforcement Learning from Verifiable Rewards (RLVR)", fa: "یادگیری تقویتی با پاداش قابل راستی‌آزمایی", seed: "روشی که در آن پاداش از معیار یا نتیجه‌ای قابل بررسی مانند پاسخ درست، آزمون موفق یا اثبات معتبر استخراج می‌شود."}
      b: {term: "Outcome Supervision", fa: "نظارت بر نتیجه", seed: "آموزشی که کیفیت خروجی نهایی را هدف می‌گیرد، بدون الزام به ارزیابی همه مراحل استدلال."}
      relation: "RLVR نوعی سیگنال پاداش مبتنی بر راستی‌آزمایی است؛ outcome supervision می‌تواند روش‌های آموزشی متفاوتی را شامل شود."
      core_question: "Reinforcement Learning from Verifiable Rewards (RLVR) و Outcome Supervision چه نسبتی دارند و شواهد علمی چه چیزی را پشتیبانی می‌کنند؟"
      practice: "برای این دو مفهوم، یک ادعای قابل آزمون و یک محدودیت شواهد مشخص کن."
      sources:
        - {name: "University of Bologna Agentic AI Systems 2026", url: "https://www.unibo.it/en/study/course-units-transferable-skills-moocs/course-unit-catalogue/course-unit/2026/543049"}
        - {name: "Stanford AI Index 2026", url: "https://hai.stanford.edu/ai-index/2026-ai-index-report"}
    - id: 117
      domain: "Robotics and world models"
      status: "established"
      prerequisites: [30, 53]
      title: "Action-Conditioned World Model و Digital Twin"
      a: {term: "Action-Conditioned World Model", fa: "مدل جهان شرطی‌شده بر کنش", seed: "مدلی که وضعیت آینده محیط را با توجه به وضعیت فعلی و کنش انتخاب‌شده پیش‌بینی می‌کند."}
      b: {term: "Digital Twin", fa: "همزاد دیجیتال", seed: "بازنمایی دیجیتالی یک دارایی یا فرایند واقعی که می‌تواند با داده عملیاتی به‌روزرسانی شود."}
      relation: "مدل جهان بر پیش‌بینی پیامد کنش تمرکز دارد؛ digital twin بازنمایی دیجیتال یک نمونه یا فرایند واقعی را دنبال می‌کند."
      core_question: "Action-Conditioned World Model و Digital Twin چه نسبتی دارند و شواهد علمی چه چیزی را پشتیبانی می‌کنند؟"
      practice: "برای این دو مفهوم، یک ادعای قابل آزمون و یک محدودیت شواهد مشخص کن."
      sources:
        - {name: "Stanford AI Index 2026", url: "https://hai.stanford.edu/ai-index/2026-ai-index-report"}
        - {name: "UK AI for Science Strategy", url: "https://www.gov.uk/government/publications/ai-for-science-strategy/ai-for-science-strategy"}
    - id: 118
      domain: "Robotics and foundation models"
      status: "established"
      prerequisites: [40, 53]
      title: "Vision-Language-Action Model (VLA) و Diffusion Policy"
      a: {term: "Vision-Language-Action Model (VLA)", fa: "مدل بینایی-زبان-کنش", seed: "مدلی که ورودی دیداری و دستور زبانی را به نمایش یا دنباله کنش رباتیک نگاشت می‌کند."}
      b: {term: "Diffusion Policy", fa: "سیاست انتشار", seed: "سیاستی که دنباله کنش یا مسیر حرکتی را با فرایند تولیدی مبتنی بر diffusion می‌سازد."}
      relation: "VLA ورودی‌های دیداری و زبانی را به کنش مرتبط می‌کند؛ diffusion policy روش تولید توالی کنش است و می‌تواند در رباتیک به‌کار رود."
      core_question: "Vision-Language-Action Model (VLA) و Diffusion Policy چه نسبتی دارند و شواهد علمی چه چیزی را پشتیبانی می‌کنند؟"
      practice: "برای این دو مفهوم، یک ادعای قابل آزمون و یک محدودیت شواهد مشخص کن."
      sources:
        - {name: "University of Michigan Robotics: Robot Learning & Foundational Models", url: "https://www.robotics.umich.edu/research/focus-areas/robot-learning-foundational-models/"}
        - {name: "Stanford AI Index 2026", url: "https://hai.stanford.edu/ai-index/2026-ai-index-report"}
    - id: 119
      domain: "AI for science"
      status: "established"
      prerequisites: [49, 54]
      title: "Scientific Foundation Model و Scientific Simulator"
      a: {term: "Scientific Foundation Model", fa: "مدل پایه علمی", seed: "مدلی پیش‌آموزش‌یافته روی داده یا ساختارهای یک یا چند حوزه علمی برای انتقال به وظایف پژوهشی."}
      b: {term: "Scientific Simulator", fa: "شبیه‌ساز علمی", seed: "مدلی محاسباتی که رفتار یک سامانه طبیعی یا آزمایش را طبق قوانین یا تقریب‌های علمی شبیه‌سازی می‌کند."}
      relation: "مدل پایه علمی از داده علمی بازنمایی عمومی می‌آموزد؛ شبیه‌ساز علمی رفتار سیستم را تحت فرض‌های مدل محاسبه می‌کند."
      core_question: "Scientific Foundation Model و Scientific Simulator چه نسبتی دارند و شواهد علمی چه چیزی را پشتیبانی می‌کنند؟"
      practice: "برای این دو مفهوم، یک ادعای قابل آزمون و یک محدودیت شواهد مشخص کن."
      sources:
        - {name: "UK AI for Science Strategy", url: "https://www.gov.uk/government/publications/ai-for-science-strategy/ai-for-science-strategy"}
        - {name: "European AI in Science Strategy", url: "https://research-and-innovation.ec.europa.eu/strategy/strategy-research-and-innovation/our-digital-future/european-ai-science-strategy_en"}
    - id: 120
      domain: "Protein AI"
      status: "established"
      prerequisites: [49, 119]
      title: "Protein Structure Prediction و Protein Function Prediction"
      a: {term: "Protein Structure Prediction", fa: "پیش‌بینی ساختار پروتئین", seed: "برآورد ساختار سه‌بعدی پروتئین از توالی اسیدهای آمینه و شواهد مکمل."}
      b: {term: "Protein Function Prediction", fa: "پیش‌بینی عملکرد پروتئین", seed: "استنباط نقش زیستی یا فعالیت احتمالی پروتئین از توالی، ساختار، زمینه و داده‌های آزمایشگاهی."}
      relation: "ساختار فضایی یکی از عوامل عملکرد است اما پیش‌بینی ساختار به‌تنهایی عملکرد زیستی را اثبات نمی‌کند."
      core_question: "Protein Structure Prediction و Protein Function Prediction چه نسبتی دارند و شواهد علمی چه چیزی را پشتیبانی می‌کنند؟"
      practice: "برای این دو مفهوم، یک ادعای قابل آزمون و یک محدودیت شواهد مشخص کن."
      sources:
        - {name: "DFG: AI for Protein Function 2025", url: "https://www.dfg.de/de/aktuelles/neuigkeiten-themen/info-wissenschaft/2025/ifw-25-82"}
        - {name: "DeepMind AlphaFold", url: "https://deepmind.google/science/alphafold/"}
    - id: 121
      domain: "Genomics AI"
      status: "established"
      prerequisites: [49, 119]
      title: "Genomic Foundation Model و Regulatory Genomics"
      a: {term: "Genomic Foundation Model", fa: "مدل پایه ژنومی", seed: "مدلی آموزش‌دیده روی توالی‌های ژنومی برای یادگیری الگوهای توالی و انتقال به وظایف زیستی."}
      b: {term: "Regulatory Genomics", fa: "ژنومیک تنظیمی", seed: "مطالعه عناصر و سازوکارهایی که بر زمان، مکان و میزان بیان ژن اثر می‌گذارند."}
      relation: "مدل پایه ژنومی نمایش توالی را می‌آموزد؛ ژنومیک تنظیمی پرسش زیستی درباره کنترل بیان ژن را بررسی می‌کند."
      core_question: "Genomic Foundation Model و Regulatory Genomics چه نسبتی دارند و شواهد علمی چه چیزی را پشتیبانی می‌کنند؟"
      practice: "برای این دو مفهوم، یک ادعای قابل آزمون و یک محدودیت شواهد مشخص کن."
      sources:
        - {name: "Stanford AI Index 2026", url: "https://hai.stanford.edu/ai-index/2026-ai-index-report"}
        - {name: "DeepMind AlphaGenome", url: "https://deepmind.google/science/alphagenome/"}
    - id: 122
      domain: "AI for materials"
      status: "established"
      prerequisites: [119]
      title: "Materials Discovery و Molecular Dynamics"
      a: {term: "Materials Discovery", fa: "کشف مواد", seed: "شناسایی یا طراحی مواد با ویژگی‌های مطلوب با ترکیب داده، مدل‌سازی و آزمایش."}
      b: {term: "Molecular Dynamics", fa: "دینامیک مولکولی", seed: "شبیه‌سازی تحول زمانی اتم‌ها و مولکول‌ها بر پایه نیروها و قوانین حرکت."}
      relation: "AI می‌تواند فضای مواد را جست‌وجو کند؛ دینامیک مولکولی رفتار اتمی را تحت مدل فیزیکی شبیه‌سازی می‌کند."
      core_question: "Materials Discovery و Molecular Dynamics چه نسبتی دارند و شواهد علمی چه چیزی را پشتیبانی می‌کنند؟"
      practice: "برای این دو مفهوم، یک ادعای قابل آزمون و یک محدودیت شواهد مشخص کن."
      sources:
        - {name: "UK AI for Science Strategy", url: "https://www.gov.uk/government/publications/ai-for-science-strategy/ai-for-science-strategy"}
        - {name: "European AI in Science Strategy", url: "https://research-and-innovation.ec.europa.eu/strategy/strategy-research-and-innovation/our-digital-future/european-ai-science-strategy_en"}
    - id: 123
      domain: "Quantum AI"
      status: "established"
      prerequisites: [26, 27]
      title: "Quantum Machine Learning و Quantum-Inspired Machine Learning"
      a: {term: "Quantum Machine Learning", fa: "یادگیری ماشین کوانتومی", seed: "روش‌های پژوهشی برای ترکیب مدل‌های یادگیری با مدارها یا منابع محاسبات کوانتومی."}
      b: {term: "Quantum-Inspired Machine Learning", fa: "یادگیری ماشین الهام‌گرفته از کوانتوم", seed: "الگوریتم‌های کلاسیکی که از ایده‌ها یا ساختارهای ریاضی کوانتومی الهام می‌گیرند، بدون اجرای محاسبه کوانتومی."}
      relation: "QML به منابع کوانتومی نیاز دارد؛ quantum-inspired ممکن است کاملاً روی سخت‌افزار کلاسیک اجرا شود و ادعای برتری هر دو نیازمند baseline منصفانه است."
      core_question: "Quantum Machine Learning و Quantum-Inspired Machine Learning چه نسبتی دارند و شواهد علمی چه چیزی را پشتیبانی می‌کنند؟"
      practice: "برای این دو مفهوم، یک ادعای قابل آزمون و یک محدودیت شواهد مشخص کن."
      sources:
        - {name: "IBM Quantum Learning", url: "https://learning.quantum.ibm.com/"}
        - {name: "NIST Quantum Information Science", url: "https://www.nist.gov/quantum-information-science"}
    - id: 124
      domain: "Neurotechnology"
      status: "established"
      prerequisites: [50, 53]
      title: "Brain-Computer Interface و Closed-Loop Neural Decoding"
      a: {term: "Brain-Computer Interface", fa: "رابط مغز-رایانه", seed: "سامانه‌ای برای تبدیل سیگنال‌های عصبی به اطلاعات یا فرمان قابل استفاده در دستگاه بیرونی."}
      b: {term: "Closed-Loop Neural Decoding", fa: "رمزگشایی عصبی حلقه‌بسته", seed: "رمزگشایی سیگنال عصبی همراه با بازخورد و مداخله پیوسته که خروجی سامانه بر وضعیت بعدی اثر می‌گذارد."}
      relation: "BCI سامانه ارتباطی انتهابه‌انتهاست؛ closed-loop decoding چرخه رمزگشایی و بازخورد را مشخص می‌کند."
      core_question: "Brain-Computer Interface و Closed-Loop Neural Decoding چه نسبتی دارند و شواهد علمی چه چیزی را پشتیبانی می‌کنند؟"
      practice: "برای این دو مفهوم، یک ادعای قابل آزمون و یک محدودیت شواهد مشخص کن."
      sources:
        - {name: "NSF: Understanding the Brain", url: "https://www.nsf.gov/focus-areas/brain"}
        - {name: "NIH BRAIN Initiative", url: "https://www.nih.gov/brain"}
    - id: 125
      domain: "Cognitive science"
      status: "established"
      prerequisites: [5, 25]
      title: "Cognitive Architecture و Neural Network"
      a: {term: "Cognitive Architecture", fa: "معماری شناختی", seed: "مدلی نظری-محاسباتی از اجزای شناخت مانند حافظه، توجه، یادگیری و تصمیم‌گیری و تعامل آن‌ها."}
      b: {term: "Neural Network", fa: "شبکه عصبی", seed: "مدلی محاسباتی از واحدهای به‌هم‌پیوسته با پارامترهای قابل‌آموزش که الگوها را از داده می‌آموزد."}
      relation: "معماری شناختی معمولاً نظریه‌ای درباره سازمان کارکردهای ذهن است؛ شبکه عصبی خانواده‌ای از مدل‌های محاسباتی است و لزوماً نظریه کامل شناخت نیست."
      core_question: "Cognitive Architecture و Neural Network چه نسبتی دارند و شواهد علمی چه چیزی را پشتیبانی می‌کنند؟"
      practice: "برای این دو مفهوم، یک ادعای قابل آزمون و یک محدودیت شواهد مشخص کن."
      sources:
        - {name: "NSF: Understanding the Brain", url: "https://www.nsf.gov/focus-areas/brain"}
        - {name: "NIH BRAIN Initiative", url: "https://www.nih.gov/brain"}
    - id: 126
      domain: "Consciousness research"
      status: "established"
      prerequisites: [125]
      title: "Consciousness Theory و Functionalism"
      a: {term: "Consciousness Theory", fa: "نظریه آگاهی", seed: "چارچوبی نظری برای توضیح ویژگی‌ها و سازوکارهای تجربه آگاهانه که باید از ادعاهای تجربی و فلسفی تفکیک شود."}
      b: {term: "Functionalism", fa: "کارکردگرایی", seed: "دیدگاهی فلسفی که حالت‌های ذهنی را بر اساس نقش علّی و کارکردی آن‌ها در سامانه تعریف می‌کند."}
      relation: "نظریه‌های آگاهی درباره تبیین تجربه ذهنی‌اند؛ کارکردگرایی نظریه‌ای درباره ماهیت حالت‌های ذهنی است و به‌تنهایی آگاهی ماشین را اثبات نمی‌کند."
      core_question: "Consciousness Theory و Functionalism چه نسبتی دارند و شواهد علمی چه چیزی را پشتیبانی می‌کنند؟"
      practice: "برای این دو مفهوم، یک ادعای قابل آزمون و یک محدودیت شواهد مشخص کن."
      sources:
        - {name: "Oxford Academic: Overcoming Essentialism in Consciousness Theory (2026)", url: "https://www.frontiersin.org/journals/psychology/articles/10.3389/fpsyg.2026.1730965/full"}
        - {name: "Nature: Consciousness, Subjectivity and Functionalism (2026)", url: "https://www.nature.com/articles/s41386-026-02321-5"}
    - id: 127
      domain: "Metacognition in AI"
      status: "established"
      prerequisites: [62, 125]
      title: "Metacognition و Uncertainty Estimation"
      a: {term: "Metacognition", fa: "فراشناخت", seed: "پایش و ارزیابی فرایندهای شناختی خود، مانند دانستن، ندانستن یا راهبرد حل مسئله."}
      b: {term: "Uncertainty Estimation", fa: "برآورد عدم‌قطعیت", seed: "تخمین میزان ابهام یا ناآگاهی مدل درباره پیش‌بینی یا خروجی خود."}
      relation: "فراشناخت مفهوم شناختی گسترده‌تری است؛ برآورد عدم‌قطعیت یک قابلیت آماری یا محاسباتی است و معادل فراشناخت انسانی نیست."
      core_question: "Metacognition و Uncertainty Estimation چه نسبتی دارند و شواهد علمی چه چیزی را پشتیبانی می‌کنند؟"
      practice: "برای این دو مفهوم، یک ادعای قابل آزمون و یک محدودیت شواهد مشخص کن."
      sources:
        - {name: "Stanford AI Index 2026", url: "https://hai.stanford.edu/ai-index/2026-ai-index-report"}
        - {name: "NSF: Understanding the Brain", url: "https://www.nsf.gov/focus-areas/brain"}
    - id: 128
      domain: "AI alignment"
      status: "established"
      prerequisites: [23, 51, 90]
      title: "AI Alignment و Control Problem"
      a: {term: "AI Alignment", fa: "هم‌راستاسازی هوش مصنوعی", seed: "پژوهش و روش‌هایی برای سازگارکردن اهداف، رفتار و پیامدهای سامانه AI با ارزش‌ها و محدودیت‌های انسانی."}
      b: {term: "Control Problem", fa: "مسئله کنترل‌پذیری", seed: "مسئله حفظ توان هدایت، محدودسازی و توقف سامانه‌های قدرتمند در شرایطی که رفتارشان پیچیده یا خودمختار است."}
      relation: "alignment درباره سازگاری رفتار با اهداف و ارزش‌هاست؛ control problem بر امکان کنترل و مداخله مؤثر تمرکز دارد."
      core_question: "AI Alignment و Control Problem چه نسبتی دارند و شواهد علمی چه چیزی را پشتیبانی می‌کنند؟"
      practice: "برای این دو مفهوم، یک ادعای قابل آزمون و یک محدودیت شواهد مشخص کن."
      sources:
        - {name: "NIST AI Risk Management Framework", url: "https://www.nist.gov/itl/ai-risk-management-framework"}
        - {name: "University of Bologna Agentic AI Systems 2026", url: "https://www.unibo.it/en/study/course-units-transferable-skills-moocs/course-unit-catalogue/course-unit/2026/543049"}
    - id: 129
      domain: "General intelligence"
      status: "established"
