name: Finalize editorial lanes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: contains(github.event.head_commit.message, '[migrate-lanes]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def rep(path, old, new, count=1):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'anchor missing: {path}: {old[:100]!r}')
              p.write_text(s.replace(old, new, count), encoding='utf-8')

          # Keep the existing migration body exactly as committed; this workflow
          # change only makes its trigger robust after production-state commits.
          PY
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/z3_finalize_editorial_lanes.yml')
          s=p.read_text(encoding='utf-8')
          if "[migrate-lanes]" not in s:
              raise SystemExit('migration trigger marker missing')
          PY
      - name: No-op safety check
        run: echo "[Migration Trigger] armed"
