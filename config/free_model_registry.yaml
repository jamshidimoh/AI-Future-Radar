# AI Future Radar — dynamic free-model registry
# Eligibility is runtime-validated. Quality is the primary ordering signal;
# priority is only a tie-break. Provider/model availability may change daily.
registry:
  schema_version: 3
  policy_version: "2026-09-09"
  refresh_hours: 24
  stale_after_hours: 72
  max_runtime_candidates: 11
  require_free: true
  require_chat: true
  require_json_capability: true
  enable_dynamic_discovery_candidates: true
  quality_weights:
    base_quality: 0.80
    task_fit: 0.20
  providers:
    - family: openrouter
      credential_env: OPENROUTER_API_KEY
      pricing_mode: free-endpoint
      models:
        - priority: 1
          id: nvidia/nemotron-3-ultra-550b-a55b:free
          free: true
          chat_capable: true
          json_capable: true
          response_format: false
          base_quality: 98
          task_fit: 94
