name: Fix Mission Prepared Quality

on:
  push:
    paths:
      - .github/workflows/fix-mission-prepared-quality.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 20
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Apply mission accounting and NaraRouter integration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("main.py")
          text = path.read_text(encoding="utf-8")
          old = '''    prepared = sum(\n        1 for item in selected\n        if not item.get("_publication_blocked")\n        and mission_area(item) in mission_areas\n    )\n'''
          new = '''    prepared = 0\n    for item in selected:\n        if item.get("_publication_blocked") or mission_area(item) not in mission_areas:\n            continue\n        try:\n            score = float(item.get("final_editorial_score", item.get("editorial_score", 0)) or 0)\n        except (TypeError, ValueError):\n            score = 0.0\n        if score >= PROTECTED_SUMMARY_SCORE_FLOOR:\n            prepared += 1\n    print(\n        f"[Mission Coverage Recovery] prepared_publishable={prepared} "\n        f"score_floor={PROTECTED_SUMMARY_SCORE_FLOOR}",\n        flush=True,\n    )\n'''
          if old not in text:
              raise SystemExit("expected prepared block not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

          # The NaraRouter integration is staged in the repository by the prior commit.
          # This workflow only finalizes the mission-accounting fix and cleans itself up.
          test = Path("tests/test_mission_coverage_prepared_quality.py")
          test.write_text('''from main import _mission_coverage_recovery\n\n\ndef test_low_score_selected_mission_item_does_not_satisfy_target(monkeypatch):\n    monkeypatch.setenv("RADAR_SUMMARY_WORKERS", "1")\n    monkeypatch.setattr("main.filter_new_items", lambda items, _seen: list(items))\n    selected = [{\n        "title": "Weak mission item",\n        "mission_area": "future_governance",\n        "link": "https://example.invalid/weak",\n        "editorial_score": 49.58,\n    }]\n    replacement = {\n        "title": "Publishable future policy",\n        "mission_area": "future_governance",\n        "link": "https://example.invalid/replacement",\n        "editorial_score": 75,\n        "source": "Nature",\n    }]\n\n    def select_fn(items, **_kwargs):\n        return [items[0]]\n\n    def summarize_fn(item):\n        return {"summary": f"Valid summary for {item['title']}"}\n\n    recovered = _mission_coverage_recovery(\n        selected, [selected[0], replacement], select_fn, summarize_fn, 2, 2, {}, set()\n    )\n    assert len(recovered) == 1\n    assert recovered[0][0]["title"] == "Publishable future policy"\n''', encoding="utf-8")

          PY
          python -m compileall -q main.py src scripts
          python -m pytest -q tests/test_mission_coverage_recovery.py tests/test_mission_coverage_prepared_quality.py tests/test_free_model_registry.py
          python - <<'PY'
          from pathlib import Path
          p = Path(".github/workflows/fix-mission-prepared-quality.yml")
          p.unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py tests/test_mission_coverage_prepared_quality.py .github/workflows/fix-mission-prepared-quality.yml
          git commit -m "fix: finalize publishable mission accounting"
          git push origin HEAD:main
