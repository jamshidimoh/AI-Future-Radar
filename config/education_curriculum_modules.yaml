      b: {term: "Data Minimization", fa: "کمینه‌سازی داده", seed: "محدودکردن جمع‌آوری و نگهداری داده به مقدار لازم برای هدف مشخص."}
      relation: "مدل‌سازی تهدید مسیرهای خطر را شناسایی می‌کند؛ data minimization سطح مواجهه را کاهش می‌دهد."
      core_question: "Privacy Threat Modeling و Data Minimization چه تفاوتی دارند و در طراحی سامانه چه اثری دارند؟"
