# Mission-critical supplemental feeds.
# These feeds expand DISCOVERY only; downstream relevance, evidence, deduplication,
# editorial quality and publication gates remain authoritative.
# The goal is higher recall without turning the Radar into a generic AI-news firehose.
# arXiv is intentionally absent and remains globally excluded.
#
# Source roles:
# - primary/research: first-party or research-originated signals
# - specialist: expert editorial coverage
# - curated: high-signal editorial/technical discovery leads
# A discovery lead is not automatically a publication source: downstream ranking
# should prefer the primary source when one can be recovered.

