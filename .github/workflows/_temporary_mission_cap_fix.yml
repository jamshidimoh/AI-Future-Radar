name: Temporary Mission Cap Repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor == 'jamshidimoh' || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply targeted selector repair
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/unified_editorial_selection.py')
          s = p.read_text(encoding='utf-8')
          old = '''            pool = [x for x in ordered if area_predicate(x) and id(x) not in p.selected_ids and p.admissible(x, repeat_source=False, ignore_type_cap=True)]\n            if not pool:\n                break\n'''
          new = '''            pool = [x for x in ordered if area_predicate(x) and id(x) not in p.selected_ids and p.admissible(x, repeat_source=False)]\n            # The type ceiling is soft only when it would otherwise starve the target lane.\n            if not pool:\n                pool = [x for x in ordered if area_predicate(x) and id(x) not in p.selected_ids and p.admissible(x, repeat_source=False, ignore_type_cap=True)]\n            if not pool:\n                break\n'''
          if old not in s:
              raise SystemExit('target selector block not found')
          s = s.replace(old, new, 1)
          old2 = '''                and p.admissible(x, repeat_source=False, ignore_type_cap=True)\n                and (target_key != "mind_future_target" or mission_area(x) != "ai_core")\n'''
          new2 = '''                and p.admissible(x, repeat_source=False)\n                and (target_key != "mind_future_target" or mission_area(x) != "ai_core")\n'''
          if old2 not in s:
              raise SystemExit('baseline block not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/_temporary_mission_cap_fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/unified_editorial_selection.py .github/workflows/_temporary_mission_cap_fix.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: make mission type cap a true soft ceiling'
          git push origin HEAD:main
