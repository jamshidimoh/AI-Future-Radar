name: Clean Production Repair
on:
  push:
    branches: [production-repair-clean]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[clean-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply and validate repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('main.py')
          s = p.read_text(encoding='utf-8')
          anchor = 'def _direct_interview_signal(item): return has_interview_evidence(item)\n'
          fn = '''def _leader_source_authority(item):\n    """Normalize leader source authority so higher values always mean stronger provenance."""\n    try:\n        existing = item.get("leader_source_authority")\n    except AttributeError:\n        return 0\n    if existing is not None:\n        try:\n            return int(existing)\n        except (TypeError, ValueError):\n            pass\n    try:\n        tier = _source_tier(item)\n    except Exception:\n        tier = None\n    try:\n        tier = int(tier) if tier is not None else None\n    except (TypeError, ValueError):\n        tier = None\n    return max(0, 4 - tier) if tier is not None else 0\n'''
          if 'def _leader_source_authority(' not in s:
              if anchor not in s:
                  raise SystemExit('authority insertion anchor not found')
              s = s.replace(anchor, anchor + '\n' + fn, 1)
          p.write_text(s, encoding='utf-8')

          g = Path('src/fetch_google_news.py')
          s = g.read_text(encoding='utf-8')
          old = '''    workers = min(max_workers or _MAX_WORKERS, max(1, len(queries)))\n    if leader_query_mode and workers == 1 and len(queries) > 1:\n        workers = min(_MAX_WORKERS, len(queries)); print(f"[Leader Discovery Parallel] workers={workers}", flush=True)\n'''
          new = '''    workers = min(max_workers or _MAX_WORKERS, max(1, len(queries)))\n    if leader_query_mode and workers > 1:\n        print(f"[Leader Discovery Parallel] workers={workers}", flush=True)\n'''
          if old not in s:
              raise SystemExit('google news worker override not found')
          g.write_text(s.replace(old, new, 1), encoding='utf-8')

          Path('tests/test_leader_source_authority_contract.py').write_text('''from main import _leader_source_authority\n\ndef test_authority_maps_source_tier_to_higher_is_better():\n    assert _leader_source_authority({"source": "official", "source_tier": 1}) == 3\n    assert _leader_source_authority({"source": "Reuters", "source_tier": 2}) == 2\n    assert _leader_source_authority({"source": "other", "source_tier": 3}) == 1\n\ndef test_authority_uses_source_tier_correction():\n    assert _leader_source_authority({"source": "Google News (Bitcoin World)", "source_tier": 1}) == 1\n''', encoding='utf-8')

          # Remove rollback/temporary workflows that can overwrite production fixes.
          for name in [
              '.github/workflows/restore-known-good-main.yml',
              '.github/workflows/restore-and-finalize.yml',
              '.github/workflows/one-shot-production-repair.yml',
              '.github/workflows/production-repair-clean.yml',
              '.github/REPAIR_NOTE.md',
              '.github/KEEP',
              '.github/KEEP2',
              '.github/cleanup-now',
              '.github/DO_NOT_USE',
              '.github/repair-temp.yml',
              'NOOP.txt', 'tmp.txt', 'tempbranch', 'IGNORE.txt', 'x',
              'BRANCH_MARKER2.txt', 'BRANCH_MARKER.txt',
          ]:
              Path(name).unlink(missing_ok=True)
          PY
          python -m compileall -q main.py src tests
          python -m pytest -q tests/test_leader_source_authority_contract.py tests/test_period_ranked_pipeline.py tests/test_source_authority_production_regression.py
      - name: Full regression and commit
        shell: bash
        run: |
          python -m pytest -q
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: stabilize production leader authority and discovery [clean-repair]'
          git push origin HEAD:production-repair-clean
          
          git rm -f .github/workflows/production-repair-clean.yml || true
          git commit -m 'chore: remove clean repair workflow [skip ci]' || true
          git push origin HEAD:production-repair-clean || true
