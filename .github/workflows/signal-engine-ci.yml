name: Signal Engine CI

on:
  push:
    branches:
      - feat/signal-engine
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-signal-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q main.py src tests
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate signal engine
        run: python -c "from src.signal_engine import enrich_with_signal; x=enrich_with_signal({'title':'New AI architecture benchmark','summary':'Novel experimental results and future implications','content_type':'research','source_tier':1}); assert 0 <= x['signal_score'] <= 100; print('SIGNAL_ENGINE_OK', x['signal_score'])"
