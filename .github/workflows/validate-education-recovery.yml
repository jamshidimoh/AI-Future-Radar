name: Validate Education Recovery

on:
  push:
    branches:
      - ci/validate-education-recovery-20260907

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q scripts src *.py
      - name: Education recovery regression
        run: python -m pytest -q tests/test_education_recovery_fallback.py
      - name: Production regression subset
        run: python -m pytest -q tests/test_production_acceptance_guard.py tests/test_production_acceptance_contract.py tests/test_telegram_format.py tests/test_production_router_policy.py
