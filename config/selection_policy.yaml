selection:
  max_posts: 3
  candidate_window: 6
  max_items_per_source: 2
  max_items_per_content_type: 2
  story_similarity_threshold: 0.45
  diversity_mode: adaptive
  diversity_weight: 8.0
  similarity_penalty: 12.0
  preferred_max_same_source: 1
  distinct_sources_first: true
  replacement_buffer: 3

editorial:
  leader_priority_weight: 2
  leader_protected_max: 2
  technical_depth_penalty: 3
  community_penalty: 30
  rotation_days: 7
  mission_aware: true
  strict_relevance: true

# Unified production selection contract:
# - max_posts=3 is the normal publication capacity; candidate_window=6 is the
#   pre-QA candidate pool used for replacement-aware publication.
# - max_items_per_source=2 is the adaptive ceiling and hard ceiling. One item
#   per source is preferred first; a second item is allowed only during adaptive
#   backfill when capacity remains.
# - Within a run, distinct sources are preferred first; source repetition is
#   allowed only during adaptive backfill when capacity remains.
# - Historical source usage is a bounded preference signal, never a hard exclusion.
# - ai_core_target_min/max and mind_future_target are explicit mission
#   coverage opportunities. They do not bypass relevance, authority, dedup,
#   editorial quality, or publication gates.
# - When an eligible mind/cognition or future/governance candidate exists,
#   mind_future_target=1 preserves one normal slot for that mission family.
# - Information gain is a bounded soft reranker: the next candidate is evaluated
#   against already selected topics. Similar stories receive diminishing-return
#   penalties; distinct high-quality stories receive a modest novelty bonus.
# - Information gain never bypasses relevance, authority, source, content-type,
#   community, interview, or publication-quality gates.
# - Community/aggregator sources are not eligible for the normal portfolio.
# - Candidate_window exists to support replacement after summary, editorial, or
#   downstream publication rejection without relaxing publication quality gates.
# - replacement_buffer=3 keeps three additional normal candidates available
#   beyond the publication capacity of 3 so semantic/publication rejection can
#   be absorbed without lowering the score floor.
# - strict_relevance=true enables hard mission-relevance filtering in the
#   production orchestration path.
# - 2026-09-12: production routing hardening and fallback reserve tuning.
