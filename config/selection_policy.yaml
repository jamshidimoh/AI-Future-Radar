selection:
  max_posts: 4
  candidate_window: 6
  max_items_per_source: 2
  max_items_per_content_type: 2
  story_similarity_threshold: 0.45
  diversity_mode: adaptive
  preferred_max_same_source: 1
  replacement_buffer: 2

editorial:
  leader_priority_weight: 2
  leader_protected_max: 2
  technical_depth_penalty: 3
  community_penalty: 30
  rotation_days: 7

# Unified production selection contract:
# - max_posts is the normal publication capacity; candidate_window is the
#   pre-QA candidate pool used for replacement-aware publication.
# - max_items_per_source is a hard ceiling. preferred_max_same_source is the
#   target for the first selection pass.
# - Within a run, distinct sources are preferred first; source repetition is
#   allowed only during adaptive backfill when capacity remains.
# - Historical source usage is a preference signal, never a hard exclusion.
# - Mission targets are applied before score-only filling: convergence,
#   mind/cognition, future/governance, and research evidence get explicit
#   coverage opportunities when eligible candidates exist.
# - Community/aggregator sources are not eligible for the normal portfolio.
# - Candidate_window exists to support replacement after a summary/editorial
#   quality rejection without relaxing publication quality gates.
