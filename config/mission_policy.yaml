# AI Future Radar — mission-driven editorial portfolio
# The channel is a radar, not a generic AI news feed.
# Every run should maximize: frontier relevance + evidence + strategic importance + diversity.
# Editorial balance is adaptive: publish all distinct, high-quality signals that qualify, subject to an operational ceiling.
# AI product launches and consequential leader statements compete on evidence, impact, freshness and portfolio diversity.
# Cross-cutting runtime invariants are declared in config/production_contract.yaml.

mission:
  max_posts: 8
  operational_publication_capacity: 8
  min_unique_sources: 3
  max_same_source: 1
  max_same_mission_area: 8
  min_authoritative_items: 2
  stale_hours: 72
  ai_core_target_min: 1
  ai_core_target_max: 8
  convergence_target: 1
  mind_cognition_target: 1
  mind_future_target: 1
  future_governance_target: 0
  deep_ideas_target: 0
  research_target: 0
  interview_target_max: 2
  community_max: 0

areas:
  ai_core:
    label: "هوش مصنوعی و مرزهای توانمندی"
    keywords: ["artificial intelligence", "llm", "foundation model", "reasoning", "agent", "agentic", "multimodal", "generative ai", "ai safety", "agi", "model", "machine learning"]
  convergence:
    label: "همگرایی AI و فناوری‌های نوظهور"
    keywords: ["quantum", "quantum computing", "robotics", "humanoid", "brain-computer", "bci", "neurotechnology", "biotech", "synthetic biology", "genomics", "crispr", "protein folding", "advanced materials", "semiconductor", "clean energy", "fusion energy", "space technology", "deep tech", "embodied ai", "neuromorphic"]
  mind_cognition:
    label: "ذهن، شناخت و آگاهی"
    keywords:
      # Core mind, consciousness and cognitive-science coverage.
      - "consciousness"
      - "machine consciousness"
      - "ai consciousness"
      - "artificial consciousness"
      - "sentience"
      - "qualia"
      - "self-awareness"
      - "awareness"
      - "cognitive science"
      - "cognition"
      - "cognitive"
      - "mind"
      - "brain"
      - "neuroscience"
      - "computational neuroscience"
      - "predictive processing"
      - "active inference"
      - "global workspace"
      - "integrated information"
      - "philosophy of mind"
      - "philosophy of consciousness"
      - "philosophy of science"
      - "philosophy of technology"
      - "philosophy of ai"
      - "epistemology of ai"
      - "technology and consciousness"
      - "machine awareness"
      - "science and technology studies"
      # Philosophy of mind: include core conceptual debates, not just generic
      # mentions of mind and consciousness.
      - "hard problem of consciousness"
      - "mind-body problem"
      - "mind body problem"
      - "functionalism"
      - "computationalism"
      - "embodied cognition"
      - "extended mind"
      - "global neuronal workspace"
      - "global workspace theory"
      - "integrated information theory"
      - "mental causation"
      - "free will"
      - "intentionality"
      # Philosophy of science: prioritize epistemology and scientific method
      # where the article makes a substantive AI connection.
      - "epistemology of science"
      - "epistemic agency"
      - "scientific realism"
      - "philosophy of scientific explanation"
      - "philosophy of scientific discovery"
      - "philosophy of scientific method"
      - "falsifiability"
      # Persian topic variants used by Persian-language sources and summaries.
      - "مسئله دشوار آگاهی"
      - "مسئله ذهن و بدن"
      - "کارکردگرایی"
      - "محاسبات‌گرایی"
      - "شناخت بدن‌مند"
      - "ذهن گسترش‌یافته"
      - "فضای کار جهانی"
      - "نظریه فضای کار جهانی"
      - "نظریه اطلاعات یکپارچه"
      - "علیت ذهنی"
      - "اراده آزاد"
      - "قصدیت"
      - "معرفت‌شناسی علم"
      - "عاملیت معرفتی"
      - "واقع‌گرایی علمی"
      - "فلسفه تبیین علمی"
      - "فلسفه کشف علمی"
      - "فلسفه روش علمی"
      - "ابطال‌پذیری"
  future_governance:
    label: "آینده‌پژوهی، جامعه و حکمرانی فناوری"
    keywords: ["future of ai", "foresight", "governance", "policy", "jobs", "economy", "geopolitics", "existential risk", "alignment", "regulation", "future of work", "society"]

frontier_signals: ["breakthrough", "new capability", "state of the art", "frontier", "first", "new model", "new architecture", "autonomous", "scaling", "reasoning", "agentic", "world model", "scientific discovery", "clinical", "deployment", "commercialized"]
trend_signals: ["roadmap", "benchmark", "adoption", "infrastructure", "investment", "standard", "platform", "ecosystem", "policy", "regulation", "research direction", "trend"]
low_signal_terms: ["top 10", "best tools", "prompt collection", "weekly roundup", "productivity tips", "how to use chatgpt", "10 tools", "20 tools", "finance stories", "stories of the week", "market recap", "gender gap", "construction industry", "top tools", "cheat sheet", "productivity hacks", "prompt guide"]

source_tiers:
  1: ["MIT CSAIL", "Stanford HAI", "BAIR", "Google DeepMind", "OpenAI", "Anthropic", "MIT News", "Nature", "Quanta Magazine", "CMU", "Carnegie Mellon", "NIST", "IEEE", "Microsoft Research", "Apple Machine Learning Research", "Engineering at Meta", "NVIDIA Developer Blog", "AWS Machine Learning Blog"]
  2: ["MIT Technology Review", "IEEE Spectrum", "Ars Technica", "Reuters", "Wired", "Scientific American", "New Scientist", "Interconnects AI"]
  3: ["Reddit", "community", "aggregator"]

protected_sources:
  - name: "MIT CSAIL - Building 32"
    match: ["MIT CSAIL", "Building 32", "cap.csail.mit.edu"]
    max_per_run: 1
    selection_mode: "priority"
    duplicate_key: "source"

# Cross-run rotation cap, enforced by src/unified_editorial_selection.py
# (load_editorial_contract + _Portfolio.admissible) via
# period_ranked_pipeline.py's _window_counts. window_runs is approximated as
# window_runs * max_posts most-recently-published, non-education items. This
# is a hard cap with a last-resort bypass so a starved candidate pool never
# blocks publication outright (see the ignore_window_cap fallbacks in
# unified_editorial_selection.py).
rotation:
  window_runs: 6
  max_same_area_in_window: 12
  max_same_source_in_window: 4
