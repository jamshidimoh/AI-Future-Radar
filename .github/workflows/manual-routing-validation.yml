name: Manual Routing Validation
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: ai-future-radar-routing-validation
  cancel-in-progress: false
jobs:
  validate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Apply final routing hardening
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root = Path('.')
          
          # Routing-specific Ruff fix.
          p = root / 'src' / 'llm_router_light.py'
          s = p.read_text(encoding='utf-8')
          old = 'except concurrent.futures.TimeoutError as exc:\n            last_error = TimeoutError(f"{name}: provider timeout")'
          new = 'except concurrent.futures.TimeoutError:\n            last_error = TimeoutError(f"{name}: provider timeout")'
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          
          # Preserve protected leader candidates in the summary budget.
          p = root / 'main.py'
          s = p.read_text(encoding='utf-8')
          old = '        if item.get("protected_slot"):\n            try: score = float(item.get("final_editorial_score", item.get("editorial_score", 0)) or 0)'
          new = '        if item.get("protected_slot") or item.get("protected_content"):\n            try: score = float(item.get("final_editorial_score", item.get("editorial_score", 0)) or 0)'
          if old not in s:
              raise SystemExit('protected summary block not found')
          s = s.replace(old, new, 1)
          
          # Bounded lazy replacement after downstream publication rejection.
          pattern = re.compile(
              r'    print\("\[7/7\] Telegram publication"\); sent = 0\n'
              r'    for item in selected:.*?'
              r'    save_seen\(seen_hashes, seen_signatures, source_history\); print\(f"Posts sent: \{sent\}/\{len\(selected\)\}"\)', re.S)
          replacement = '''    print("[7/7] Telegram publication"); sent = 0
    initial_selected_count = len(selected)
    publication_attempted = set()
    lazy_replacements = 0
    contract = load_editorial_contract()
    replacement_limit = max(0, int(contract.get("replacement_buffer", 0) or 0))
    next_candidate_index = 0

    def _publication_identity(item):
        return str(item.get("canonical_url") or item.get("link") or item.get("url") or item.get("title") or id(item))

    publication_attempted.update(_publication_identity(item) for item in selected)

    def _prepare_lazy_replacement():
        nonlocal lazy_replacements, next_candidate_index
        if lazy_replacements >= replacement_limit:
            return None
        while next_candidate_index < len(editorial_pool):
            candidate = editorial_pool[next_candidate_index]
            next_candidate_index += 1
            identity = _publication_identity(candidate)
            if identity in publication_attempted:
                continue
            candidate_score = float(candidate.get("final_editorial_score", candidate.get("editorial_score", 0)) or 0)
            is_protected = bool(candidate.get("protected_content"))
            if is_protected:
                if candidate_score < PROTECTED_SUMMARY_SCORE_FLOOR:
                    continue
            else:
                normal_rank = candidate.get("normal_period_rank")
                try:
                    normal_rank = int(normal_rank)
                except (TypeError, ValueError):
                    continue
                if normal_rank > int(contract.get("candidate_window", RANK_WINDOW)):
                    continue
                if candidate_score < NORMAL_SCORE_FLOOR:
                    continue
            candidate = dict(candidate)
            summary = summarize_fn(candidate)
            if not summary:
                candidate["_publication_blocked"] = True
                print(f"[Publication Lazy Refill] summary blocked; skipping candidate: {str(candidate.get('title',''))[:120]}", flush=True)
                continue
            candidate.update(summary)
            candidate["final_editorial_score"] = float(candidate.get("final_editorial_score", candidate.get("editorial_score", 0)) or 0)
            candidate["source_image"] = resolve_image_fn(candidate)
            publication_attempted.add(identity)
            lazy_replacements += 1
            print(f"[Publication Lazy Refill] prepared replacement={lazy_replacements}/{replacement_limit} normal_rank={candidate.get('normal_period_rank')} score={candidate.get('final_editorial_score')} title={str(candidate.get('title',''))[:120]}", flush=True)
            return candidate
        return None

    for item in selected:
        if item.get("_publication_blocked"):
            continue
        try:
            source_name = str(item.get("source") or item.get("source_name") or "منبع"); link = str(item.get("link") or item.get("url") or ""); post = format_fn(item, source_name, link, is_video=str(item.get("source_type") or "").lower() in {"youtube", "video"}, published=item.get("published", ""), content_type=item.get("content_type", "news"), source_tier=item.get("source_tier", 3), source_type=item.get("source_type", "news"), leader=item.get("leader") or item.get("watch_person") or "")
            if not _publication_text_within_limit(post):
                replacement = _prepare_lazy_replacement()
                if replacement is not None:
                    selected.append(replacement)
                continue
            result = deliver_fn(post, image_url=str(item.get("source_image") or ""), source_link=link)
            if hasattr(result, "status"):
                status = getattr(result, "status"); status_value = getattr(status, "value", str(status))
                if status_value == "delivered":
                    sent += 1; persist_fn(item, seen_hashes, seen_signatures, source_history); continue
                if status_value in {"policy_blocked", "rejected", "duplicate"}:
                    print(f"[Publication Contract] candidate rejected reason={getattr(result, 'reason', '')}; continuing to next ranked candidate", flush=True)
                    replacement = _prepare_lazy_replacement()
                    if replacement is not None:
                        selected.append(replacement)
                    continue
                raise RuntimeError(f"Telegram transport failure: {getattr(result, 'reason', 'unknown')}")
            if not result:
                raise RuntimeError("Telegram delivery returned false")
            sent += 1; persist_fn(item, seen_hashes, seen_signatures, source_history)
        except Exception as exc:
            print(f"[ERROR] Telegram send failed for {item.get('title','')[:100]}: {exc}", flush=True)
    print(f"[Publication Lazy Refill] initial={initial_selected_count} lazy_replacements={lazy_replacements} final_attempt_queue={len(selected)}", flush=True)
    save_seen(seen_hashes, seen_signatures, source_history); print(f"Posts sent: {sent}/{len(selected)}")'''
          m = pattern.search(s)
          if not m:
              raise SystemExit('publication loop pattern not found')
          s = s[:m.start()] + replacement + s[m.end():]
          p.write_text(s, encoding='utf-8')
          
          # Scope the blocking Ruff gate to the actual routing surface.
          p = root / '.github' / 'workflows' / 'test-quality.yml'
          s = p.read_text(encoding='utf-8')
          old = '      - name: Ruff changed-surface gate\n        run: python -m ruff check --select F src/llm_router_light.py tests/test_hf_light_router.py'
          new = '      - name: Ruff changed-surface gate\n        run: python -m ruff check --select F src/llm_router_light.py src/free_model_registry.py src/production_router_policy.py tests/test_llm_health_persistence.py tests/test_nara_router_integration.py'
          if old not in s:
              raise SystemExit('Ruff changed-surface gate not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          print('FINAL_ROUTING_HARDENING_APPLIED')
          PY
          python -m compileall -q main.py src scripts tests
          python -m pip install -q --disable-pip-version-check 'ruff>=0.12,<0.13'
          python -m ruff check --select F src/llm_router_light.py src/free_model_registry.py src/production_router_policy.py tests/test_llm_health_persistence.py tests/test_nara_router_integration.py
      - name: Commit hardening and remove temporary workflows
        shell: bash
        run: |
          rm -f .github/workflows/apply-routing-hardening.yml .github/workflows/manual-routing-validation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.py src/llm_router_light.py .github/workflows/test-quality.yml .github/workflows/apply-routing-hardening.yml .github/workflows/manual-routing-validation.yml
          git commit -m 'fix: finalize routing failover and publication refill' || true
          git push origin HEAD:main
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile and full routing tests
        run: |
          python -m compileall -q scripts src *.py
          python -m pytest -q tests/test_production_router_policy.py tests/test_free_model_registry.py tests/test_litellm_registry_integration.py tests/test_llm_router_resilience.py tests/test_llm_health_persistence.py tests/test_nara_router_integration.py
      - name: Refresh free-model registry
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          KIRAAI_API_KEY: ${{ secrets.KIRAAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FREE_LLM_ROUTER_API_KEY: ${{ secrets.FREE_LLM_ROUTER_API_KEY }}
        run: python -u scripts/refresh_free_model_registry.py --strict
      - name: Bridge FLR and inspect runtime chain
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FREE_LLM_ROUTER_API_KEY: ${{ secrets.FREE_LLM_ROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          KIRAAI_API_KEY: ${{ secrets.KIRAAI_API_KEY }}
          NARAROUTER_API_KEY: ${{ secrets.NARAROUTER_API_KEY }}
        run: |
          python -u scripts/bridge_free_llm_router.py
          PYTHONPATH=src python - <<'PY'
          from free_model_registry import build_litellm_model_list
          rows = build_litellm_model_list()
          print('[Routing Validation] ' + ', '.join(f"{r['model_info']['provider_family']}:{r['model_info']['id']}" for r in rows[:30]))
          assert not any(r['model_info']['id'] == 'openrouter:openrouter/free' for r in rows)
          if __import__('os').environ.get('NARAROUTER_API_KEY'):
              assert any(r['model_info']['provider_family'] == 'nararouter' for r in rows)
          PY
      - name: Nara live smoke test
        env:
          NARAROUTER_API_KEY: ${{ secrets.NARAROUTER_API_KEY }}
        run: |
          python - <<'PY'
          import os, requests
          key = os.environ.get('NARAROUTER_API_KEY', '').strip()
          if not key:
              print('[Nara Smoke] skipped: secret not configured')
              raise SystemExit(0)
          r = requests.post('https://router.bynara.id/v1/chat/completions', headers={'Authorization': f'Bearer {key}', 'Content-Type': 'application/json'}, json={'model':'auto/bynara','messages':[{'role':'user','content':'Reply only with OK'}],'max_tokens':8,'temperature':0}, timeout=15)
          print(f'[Nara Smoke] status={r.status_code}')
          if r.ok:
              data = r.json(); text = (((data.get('choices') or [{}])[0].get('message') or {}).get('content') or '').strip(); print(f'[Nara Smoke] success text={text[:32]}')
          elif r.status_code in {401,402,403,404,429,503}:
              print(f'[Nara Smoke] expected provider-state response: {r.status_code}')
          else:
              r.raise_for_status()
          PY
      - name: Telegram preflight
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: "-1004482051328"
        run: python -u scripts/telegram_preflight.py
      - name: End-to-end production run
        env:
          PYTHONUNBUFFERED: "1"
          RADAR_PRODUCTION_MODE: "1"
          RADAR_WATCHDOG_MINUTES: "22"
          RADAR_SUMMARY_WORKERS: "1"
          AI_RADAR_EDITORIAL_REVIEW: "0"
          RADAR_ENABLE_GEMINI_FALLBACK: "0"
          RADAR_ENABLE_HF_FALLBACK: "1"
          RADAR_LLM_MAX_TOKENS: "700"
          RADAR_ROUTER_BUDGET_SECONDS: "24"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: "-1004482051328"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          KIRAAI_API_KEY: ${{ secrets.KIRAAI_API_KEY }}
          FREE_LLM_ROUTER_API_KEY: ${{ secrets.FREE_LLM_ROUTER_API_KEY }}
          NARAROUTER_API_KEY: ${{ secrets.NARAROUTER_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_MODEL: ${{ vars.HF_MODEL }}
          HF_POLICY: free-first
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: timeout 24m bash -o pipefail -c 'python -u scripts/production_with_ranking_audit.py 2>&1 | tee run.log'
      - name: Production acceptance
        run: python -u scripts/production_acceptance_guard.py run.log
      - name: Persist health evidence
        run: python -u scripts/update_llm_health_state.py run.log
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: routing-validation-${{ github.run_number }}
          path: |
            run.log
            artifacts/ranking_audit/
            artifacts/free_model_registry.runtime.yaml
          retention-days: 7
