name: Restore Signal Ranking Helper
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[signal-helper-restored]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Restore helper and test
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('main.py')
          s = p.read_text(encoding='utf-8')
          anchor = '''    return max(0, 4 - tier) if tier is not None else 0\n\ndef _leader_activity_signal(item):\n'''
          helper = '''    return max(0, 4 - tier) if tier is not None else 0\n\ndef _apply_signal_ranking(items):\n    """Apply the historical intermediate signal uplift used before story gating."""\n    for item in items:\n        try:\n            base = float(item.get("editorial_score_pre_signal", item.get("editorial_score", 0)) or 0.0)\n        except (TypeError, ValueError):\n            base = 0.0\n        try:\n            signal = float(item.get("signal_score", 0) or 0.0)\n        except (TypeError, ValueError):\n            signal = 0.0\n        item["editorial_score_pre_signal"] = round(base, 2)\n        item["editorial_score"] = round(base + 0.30 * signal, 2)\n    return items\n\ndef _leader_activity_signal(item):\n'''
          if 'def _apply_signal_ranking(' not in s:
              if anchor not in s:
                  raise SystemExit('signal helper anchor not found')
              s = s.replace(anchor, helper, 1)
          p.write_text(s, encoding='utf-8')
          PY
          python -m compileall -q scripts src *.py
          python -m pytest -q tests/test_editorial_quality_policy.py tests/test_production_acceptance_contract.py tests/test_p2_story_gate_contract.py tests/test_p1_story_gate_sensitivity_grid.py tests/test_canonical_ranking.py tests/test_source_authority_production_regression.py tests/test_period_ranked_pipeline.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.py
          git commit -m 'fix: restore signal ranking helper [signal-helper-restored]'
          git push origin HEAD:main
          git rm -f .github/workflows/repair-signal-helper.yml
          git commit -m 'chore: remove signal helper repair workflow [skip ci]'
          git push origin HEAD:main
