[project]
name = "ai-future-radar"
version = "1.0.1"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 160
extend-exclude = [".venv", "digital_transformation_booklet"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "E701", "E702", "E731", "B905", "UP017"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"tools/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
explicit_package_bases = true
files = ["src", "main.py", "production_entrypoint.py", "production_resilient_runner.py", "period_ranked_pipeline.py"]

[[tool.mypy.overrides]]
module = "production_entrypoint"
# production_entrypoint deliberately monkeypatches the legacy `main` module at
# runtime. The dynamic attributes are validated by import/production tests; the
# static checker cannot see those runtime assignments.
disable_error_code = ["attr-defined"]
