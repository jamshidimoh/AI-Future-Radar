name: Repair Protected Key
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[protected-key-repaired]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply exact protected ordering
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('main.py')
          s=p.read_text(encoding='utf-8')
          start=s.index('def _split_protected(items, max_protected):')
          end=s.index('\ndef _publication_summary_budget', start)
          new='''def _split_protected(items, max_protected):\n    protected_candidates = [x for x in items if x.get("protected_content")]\n    protected = sorted(\n        protected_candidates,\n        key=lambda x: (\n            int(x.get("leader_priority", 0) or 0),\n            int(_leader_source_authority(x)),\n            str(x.get("published") or ""),\n        ),\n        reverse=True,\n    )[:max_protected]\n    protected_ids = {id(x) for x in protected}\n    regular = [x for x in items if id(x) not in protected_ids]\n    return protected, regular\n'''
          p.write_text(s[:start]+new+s[end:],encoding='utf-8')
          PY
          python -m compileall -q main.py src tests
          python -m pytest -q tests/test_source_authority_production_regression.py tests/test_leader_source_authority_contract.py tests/test_period_ranked_pipeline.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.py
          git commit -m 'fix: correct protected source authority ordering [protected-key-repaired]'
          git push origin HEAD:main
          git rm -f .github/workflows/repair-protected-key.yml
          git commit -m 'chore: remove temporary protected key repair [skip ci]'
          git push origin HEAD:main
