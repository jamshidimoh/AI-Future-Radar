name: Fix Mission Prepared Quality

on:
  push:
    paths:
      - .github/workflows/fix-mission-prepared-quality.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 20
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Apply mission accounting and NaraRouter integration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          # 1) Mission prepared accounting: only publishable-score items satisfy the target.
          path = Path("main.py")
          text = path.read_text(encoding="utf-8")
          old = '''    prepared = sum(\n        1 for item in selected\n        if not item.get("_publication_blocked")\n        and mission_area(item) in mission_areas\n    )\n'''
          new = '''    prepared = 0\n    for item in selected:\n        if item.get("_publication_blocked") or mission_area(item) not in mission_areas:\n            continue\n        try:\n            score = float(item.get("final_editorial_score", item.get("editorial_score", 0)) or 0)\n        except (TypeError, ValueError):\n            score = 0.0\n        if score >= PROTECTED_SUMMARY_SCORE_FLOOR:\n            prepared += 1\n    print(\n        f"[Mission Coverage Recovery] prepared_publishable={prepared} "\n        f"score_floor={PROTECTED_SUMMARY_SCORE_FLOOR}",\n        flush=True,\n    )\n'''
          if old in text:
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")

          # 2) NaraRouter support in the evidence-backed registry/adapter.
          path = Path("src/free_model_registry.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              'env_name = {"openrouter": "OPENROUTER_API_KEY", "kiraai": "KIRAAI_API_KEY", "groq": "GROQ_API_KEY", "gemini": "GEMINI_API_KEY"}.get(family)',
              'env_name = {"openrouter": "OPENROUTER_API_KEY", "kiraai": "KIRAAI_API_KEY", "groq": "GROQ_API_KEY", "gemini": "GEMINI_API_KEY", "nararouter": "NARAROUTER_API_KEY"}.get(family)'
          )
          text = text.replace(
              '    if family == "gemini":\n        return f"gemini/{model_id}"\n    raise ValueError',
              '    if family == "gemini":\n        return f"gemini/{model_id}"\n    if family == "nararouter":\n        return f"openai/{model_id}"\n    raise ValueError'
          )
          insert_after = '''def _kiraai_call(router, system_prompt, user_content, model):\n'''
          # Add a NaraRouter adapter immediately before the KiraAI adapter.
          nara_fn = '''def _nararouter_call(router, system_prompt, user_content, model):\n    key = os.getenv("NARAROUTER_API_KEY")\n    if not key:\n        return None\n    payload = {"model": model, "messages": [{"role": "system", "content": system_prompt}, {"role": "user", "content": user_content}], "max_tokens": 850, "temperature": 0.15}\n    if model_capability(model).get("response_format"):\n        payload["response_format"] = {"type": "json_object"}\n    response = requests.post("https://router.bynara.id/v1/chat/completions", headers={"Authorization": f"Bearer {key}", "Content-Type": "application/json"}, json=payload, timeout=10)\n    if response.status_code in (401, 402, 403, 404, 429):\n        raise router.QuotaExceeded(f"NaraRouter {model}: HTTP {response.status_code} {response.text[:500]}")\n    response.raise_for_status()\n    choices = response.json().get("choices") or []\n    if not choices:\n        raise ValueError("NaraRouter response has no choices")\n    message = choices[0].get("message") or {}\n    content = message.get("content") if isinstance(message, dict) else None\n    if content is None:\n        raise ValueError("NaraRouter response content not found")\n    return content\n\n\n'''
          if 'def _nararouter_call(' not in text:
              text = text.replace(insert_after, nara_fn + insert_after, 1)
          text = text.replace(
              '        if entry.get("family") == "kiraai":\n            params["api_base"] = "https://kiraai.vn/api/v1"',
              '        if entry.get("family") == "kiraai":\n            params["api_base"] = "https://kiraai.vn/api/v1"\n        elif entry.get("family") == "nararouter":\n            params["api_base"] = "https://router.bynara.id/v1"'
          )
          text = text.replace(
              '        elif family == "kiraai":\n            fn = lambda sp, uc, m=model_id: _kiraai_call(router, sp, uc, m)\n        else:',
              '        elif family == "kiraai":\n            fn = lambda sp, uc, m=model_id: _kiraai_call(router, sp, uc, m)\n        elif family == "nararouter":\n            fn = lambda sp, uc, m=model_id: _nararouter_call(router, sp, uc, m)\n        else:'
          )
          text = text.replace(
              'display_family = {"openrouter": "OpenRouter", "kiraai": "KiraAI", "groq": "Groq"}.get(family, family.title())',
              'display_family = {"openrouter": "OpenRouter", "kiraai": "KiraAI", "nararouter": "NaraRouter", "groq": "Groq"}.get(family, family.title())'
          )
          path.write_text(text, encoding="utf-8")

          # 3) Live validation for NaraRouter public /v1/models.
          path = Path("scripts/refresh_free_model_registry.py")
          text = path.read_text(encoding="utf-8")
          marker = '''def _gemini_models(token: str | None) -> tuple[bool, dict[str, dict], str]:\n'''
          nara_fn = '''def _nararouter_models(token: str | None) -> tuple[bool, dict[str, dict], str]:\n    if not token:\n        return False, {}, "missing credential"\n    status, payload = _get_json("https://router.bynara.id/v1/models", token=token)\n    if status in (401, 403):\n        return False, {}, f"authentication failed HTTP {status}"\n    if status >= 400:\n        return False, {}, f"model catalog failed HTTP {status}"\n    rows = payload.get("data") or []\n    return True, {str(row.get("id")): row for row in rows if isinstance(row, dict) and row.get("id")}, "catalog ok"\n\n\n'''
          if 'def _nararouter_models(' not in text:
              text = text.replace(marker, nara_fn + marker, 1)
          text = text.replace(
              '    token_gemini = os.getenv("GEMINI_API_KEY")\n',
              '    token_gemini = os.getenv("GEMINI_API_KEY")\n    token_nara = os.getenv("NARAROUTER_API_KEY")\n'
          )
          text = text.replace(
              '    gemini_ok, gemini_models, gemini_reason = _gemini_models(token_gemini)\n',
              '    gemini_ok, gemini_models, gemini_reason = _gemini_models(token_gemini)\n    nara_ok, nara_models, nara_reason = _nararouter_models(token_nara)\n'
          )
          text = text.replace(
              '        elif family == "gemini":\n            provider["credential_valid"] = gemini_ok\n            provider["validation"] = gemini_reason\n            catalog = gemini_models\n',
              '        elif family == "gemini":\n            provider["credential_valid"] = gemini_ok\n            provider["validation"] = gemini_reason\n            catalog = gemini_models\n        elif family == "nararouter":\n            provider["credential_valid"] = nara_ok\n            provider["validation"] = nara_reason\n            catalog = nara_models\n'
          )
          needle = '''            elif family == "gemini":\n                if not live or not provider["credential_valid"]:\n'''
          replacement = '''            elif family == "nararouter":\n                if not live or not provider["credential_valid"]:\n                    model["enabled"] = False\n                    model["runtime_reason"] = "provider_unavailable"\n                else:\n                    model["free"] = bool(model.get("free") is True)\n                    model["context_length"] = int(live.get("context_length") or 0)\n                    model["response_format"] = _supports_response_format(live) or bool(model.get("response_format"))\n                    if not model["free"]:\n                        model["enabled"] = False\n                        model["runtime_reason"] = "not_free"\n            elif family == "gemini":\n                if not live or not provider["credential_valid"]:\n'''
          if needle not in text:
              raise SystemExit("expected gemini provider branch not found")
          text = text.replace(needle, replacement, 1)
          path.write_text(text, encoding="utf-8")

          # 4) Canonical registry: NaraRouter Free-plan models only.
          path = Path("config/free_model_registry.yaml")
          text = path.read_text(encoding="utf-8")
          provider = '''  - family: nararouter\n    credential_env: NARAROUTER_API_KEY\n    pricing_mode: free-plan\n    dynamic_catalog: true\n    catalog_endpoint: https://router.bynara.id/v1/models\n    models:\n    - priority: 1\n      id: agnes-2.5-flash\n      free: true\n      chat_capable: true\n      json_capable: true\n      response_format: true\n      base_quality: 91\n      task_fit: 96\n      quality_evidence: provider_official\n    - priority: 2\n      id: ling-3.0-flash-fin-free\n      free: true\n      chat_capable: true\n      json_capable: true\n      response_format: true\n      base_quality: 88\n      task_fit: 94\n      quality_evidence: provider_official\n    - priority: 3\n      id: nemotron-3.5-lightning-free\n      free: true\n      chat_capable: true\n      json_capable: true\n      response_format: true\n      base_quality: 87\n      task_fit: 93\n      quality_evidence: provider_official\n    - priority: 4\n      id: stepfun-3.7-flash\n      free: true\n      chat_capable: true\n      json_capable: true\n      response_format: true\n      base_quality: 86\n      task_fit: 92\n      quality_evidence: provider_official\n    - priority: 5\n      id: laguna-s-2.1\n      free: true\n      chat_capable: true\n      json_capable: true\n      response_format: true\n      base_quality: 82\n      task_fit: 89\n      quality_evidence: provider_official\n'''
          anchor = '  - family: gemini\n'
          if '  - family: nararouter\n' not in text:
              if anchor not in text:
                  raise SystemExit("gemini provider anchor not found")
              text = text.replace(anchor, provider + anchor, 1)
          path.write_text(text, encoding="utf-8")

          # 5) Production workflow: expose the GitHub secret to both registry refresh and runtime.
          path = Path(".github/workflows/run.yml")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              '          KIRAAI_API_KEY: ${{ secrets.KIRAAI_API_KEY }}\n          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}',
              '          KIRAAI_API_KEY: ${{ secrets.KIRAAI_API_KEY }}\n          NARAROUTER_API_KEY: ${{ secrets.NaraRouter_API_Key }}\n          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}'
          )
          text = text.replace(
              '          KIRAAI_API_KEY: ${{ secrets.KIRAAI_API_KEY }}\n          HF_TOKEN:',
              '          KIRAAI_API_KEY: ${{ secrets.KIRAAI_API_KEY }}\n          NARAROUTER_API_KEY: ${{ secrets.NaraRouter_API_Key }}\n          HF_TOKEN:'
          )
          text = text.replace(
              '          KIRAAI_API_KEY: ${{ secrets.KIRAAI_API_KEY }}\n          FORCE_EDUCATION_PUBLICATION:',
              '          KIRAAI_API_KEY: ${{ secrets.KIRAAI_API_KEY }}\n          NARAROUTER_API_KEY: ${{ secrets.NaraRouter_API_Key }}\n          FORCE_EDUCATION_PUBLICATION:'
          )
          path.write_text(text, encoding="utf-8")

          # 6) Regression tests for Nara lane and mission prepared accounting.
          path = Path("tests/test_free_model_registry.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              '    monkeypatch.delenv("KIRAAI_API_KEY", raising=False)\n',
              '    monkeypatch.delenv("KIRAAI_API_KEY", raising=False)\n    monkeypatch.delenv("NARAROUTER_API_KEY", raising=False)\n'
          )
          marker = '''def test_kiraai_free_quota_lane_is_included_when_credentialed(monkeypatch):\n'''
          test = '''def test_nararouter_free_lane_is_included_when_credentialed(monkeypatch):\n    _reset(monkeypatch)\n    monkeypatch.setenv("NARAROUTER_API_KEY", "test-nara")\n    names = [name for name, _ in registry.build_production_chain(router)]\n    assert any(name.startswith("NaraRouter:") for name in names)\n    assert "NaraRouter:agnes-2.5-flash" in names\n\n\ndef test_nararouter_adapter_is_openai_compatible(monkeypatch):\n    _reset(monkeypatch)\n    monkeypatch.setenv("NARAROUTER_API_KEY", "test-nara")\n    seen = {}\n\n    class Response:\n        status_code = 200\n        text = ""\n        def json(self):\n            return {"choices": [{"message": {"content": '{"ok":true}'}}]}\n        def raise_for_status(self):\n            return None\n\n    def post(url, **kwargs):\n        seen["url"] = url\n        seen["json"] = kwargs["json"]\n        return Response()\n\n    monkeypatch.setattr(registry.requests, "post", post)\n    fn = dict(registry.build_production_chain(router))["NaraRouter:agnes-2.5-flash"]\n    assert fn("system", "user") == '{"ok":true}'\n    assert seen["url"] == "https://router.bynara.id/v1/chat/completions"\n    assert seen["json"]["model"] == "agnes-2.5-flash"\n\n\n'''
          if 'def test_nararouter_free_lane_is_included_when_credentialed' not in text:
              text = text.replace(marker, test + marker, 1)
          path.write_text(text, encoding="utf-8")

          test = Path("tests/test_mission_coverage_prepared_quality.py")
          test.write_text('''from main import _mission_coverage_recovery\n\n\ndef test_low_score_selected_mission_item_does_not_satisfy_target(monkeypatch):\n    monkeypatch.setenv("RADAR_SUMMARY_WORKERS", "1")\n    monkeypatch.setattr("main.filter_new_items", lambda items, _seen: list(items))\n    selected = [{\n        "title": "Weak mission item",\n        "mission_area": "future_governance",\n        "link": "https://example.invalid/weak",\n        "editorial_score": 49.58,\n    }]\n    replacement = {\n        "title": "Publishable future policy",\n        "mission_area": "future_governance",\n        "link": "https://example.invalid/replacement",\n        "editorial_score": 75,\n        "source": "Nature",\n    }\n\n    def select_fn(items, **_kwargs):\n        return [items[0]]\n\n    def summarize_fn(item):\n        return {"summary": f"Valid summary for {item['title']}"}\n\n    recovered = _mission_coverage_recovery(\n        selected,\n        [selected[0], replacement],\n        select_fn,\n        summarize_fn,\n        2,\n        2,\n        {},\n        set(),\n    )\n\n    assert len(recovered) == 1\n    assert recovered[0][0]["title"] == "Publishable future policy"\n    assert recovered[0][0]["_mission_recovery"] is True\n''', encoding="utf-8")
          PY

          python -m compileall -q scripts src *.py
          python -m pytest -q tests/test_free_model_registry.py tests/test_mission_coverage_recovery.py tests/test_mission_coverage_prepared_quality.py

          # Remove this one-shot workflow after successful verification.
          rm -f .github/workflows/fix-mission-prepared-quality.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py src/free_model_registry.py scripts/refresh_free_model_registry.py config/free_model_registry.yaml .github/workflows/run.yml tests/test_free_model_registry.py tests/test_mission_coverage_prepared_quality.py .github/workflows/fix-mission-prepared-quality.yml
          git commit -m "fix: require publishable mission target and add NaraRouter free lane"
          git push origin HEAD:main
