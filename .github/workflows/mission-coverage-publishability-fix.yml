name: One-time Mission Publishability Fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mission-coverage-publishability-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Patch mission recovery to require publishable candidates
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("main.py")
          text = path.read_text(encoding="utf-8")
          old = '''    pool = []\n    for item in editorial_pool:\n        if item.get("protected_content") or mission_area(item) not in mission_areas:\n            continue\n        identity = str(item.get("canonical_url") or item.get("link") or item.get("url") or item.get("title") or id(item))\n        if identity in used or not filter_new_items([item], seen_hashes):\n            continue\n        pool.append(item)\n\n    retries = max(1, int(contract.get("replacement_buffer", 1) or 1))\n'''
          new = '''    pool = []\n    for item in editorial_pool:\n        if item.get("protected_content") or mission_area(item) not in mission_areas:\n            continue\n        identity = str(item.get("canonical_url") or item.get("link") or item.get("url") or item.get("title") or id(item))\n        if identity in used or not filter_new_items([item], seen_hashes):\n            continue\n        pool.append(item)\n\n    # Recovery must select a candidate that can actually pass the same normal\n    # publication score floor. A summary success alone is not publication success.\n    publishable_pool = []\n    for item in pool:\n        try:\n            score = float(item.get("final_editorial_score", item.get("editorial_score", 0)) or 0)\n        except (TypeError, ValueError):\n            score = 0.0\n        if score >= PROTECTED_SUMMARY_SCORE_FLOOR:\n            publishable_pool.append(item)\n    print(\n        f"[Mission Coverage Recovery] mission_candidates={len(pool)} "\n        f"publishable_candidates={len(publishable_pool)} "\n        f"score_floor={PROTECTED_SUMMARY_SCORE_FLOOR}",\n        flush=True,\n    )\n    pool = publishable_pool\n\n    retries = max(1, int(contract.get("replacement_buffer", 1) or 1))\n'''
          if old not in text:
              raise SystemExit("mission recovery patch anchor not found")
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
          python -m compileall -q main.py
          python -m pytest -q tests/test_production_acceptance_guard.py tests/test_production_acceptance_contract.py
      - name: Commit patch and remove one-time workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/mission-coverage-publishability-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py .github/workflows/mission-coverage-publishability-fix.yml
          git commit -m "fix: require publishable mission recovery candidates"
          git pull --rebase origin main
          git push origin HEAD:main
