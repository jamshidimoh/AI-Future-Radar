name: Repair Protected Source Ordering
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[protected-sort-repaired]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Patch protected ordering and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('main.py')
          s = p.read_text(encoding='utf-8')
          old = '    protected = sorted([x for x in items if x.get("protected_content")], key=lambda x: (int(x.get("leader_priority", 0) or 0), -int(x.get("source_tier", 99) or 99), str(x.get("published") or "")), reverse=True)[:max_protected]\n'
          new = '''    protected_candidates = [x for x in items if x.get("protected_content")]\n    protected_candidates = sorted(protected_candidates, key=lambda x: str(x.get("published") or ""), reverse=True)\n    protected_candidates = sorted(protected_candidates, key=lambda x: int(_source_tier(x) if _source_tier(x) is not None else 99))\n    protected = sorted(protected_candidates, key=lambda x: int(x.get("leader_priority", 0) or 0), reverse=True)[:max_protected]\n'''
          if old not in s:
              raise SystemExit('expected protected sort expression not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          python -m compileall -q main.py src tests
          python -m unittest discover -s tests -p 'test_*.py' -v
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.py
          git commit -m 'fix: correct protected source tier ordering [protected-sort-repaired]'
          git push origin HEAD:main
          git rm -f .github/workflows/repair-protected-sort.yml
          git commit -m 'chore: remove protected sort repair workflow [skip ci]'
          git push origin HEAD:main
