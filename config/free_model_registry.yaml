          free: true
          chat_capable: true
          json_capable: true
          response_format: true
          base_quality: 97
          task_fit: 94
        - priority: 5
          id: openai/gpt-oss-120b:free
          free: true
          chat_capable: true
          json_capable: true
          response_format: true
          base_quality: 94
          task_fit: 97
        - priority: 6
          id: google/gemma-4-31b-it:free
          free: true
          chat_capable: true
          json_capable: true
          response_format: true
          base_quality: 91
          task_fit: 98
        - priority: 7
          id: qwen/qwen3-next-80b-a3b-instruct:free
          free: true
          chat_capable: true
          json_capable: true
          response_format: true
          base_quality: 92
          task_fit: 97
        - priority: 8
          id: google/gemma-4-26b-a4b-it:free
          free: true
          chat_capable: true
          json_capable: true
          response_format: true
          base_quality: 88
          task_fit: 95
        - priority: 9
          id: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free
          free: true
          chat_capable: true
          json_capable: true
          response_format: false
          base_quality: 82
          task_fit: 90
        - priority: 11
          id: openai/gpt-oss-20b:free
          free: true
          chat_capable: true
          json_capable: true
          response_format: true
          base_quality: 84
          task_fit: 91
