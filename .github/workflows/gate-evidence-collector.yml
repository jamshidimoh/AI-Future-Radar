name: Gate Evidence Collector

on:
  workflow_run:
    workflows: ["Autonomous Evolution Controller"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: gate-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.head_branch == 'evolution/trend-intelligence-council'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: evolution/trend-intelligence-council
          fetch-depth: 1

      - name: Collect immutable run evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != "workflow_run" ]]; then
            echo "Manual dispatch does not represent a completed controller run; no evidence appended."
            exit 0
          fi
          test -n "$RUN_ID"
          test -n "$RUN_SHA"
          status="FAIL"
          acceptance="FAIL"
          if [[ "$RUN_CONCLUSION" == "success" ]]; then
            status="PASS"
            acceptance="PASS"
          fi
          mkdir -p evolution
          printf '{"schema_version":1,"gate":"G5","commit_sha":"%s","workflow_run_id":"%s","test_result":"%s","acceptance_result":"%s","timestamp_utc":"%s","notes":"Autonomous Evolution Controller completed with conclusion=%s"}\n' "$RUN_SHA" "$RUN_ID" "$status" "$acceptance" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$RUN_CONCLUSION" >> evolution/gate_evidence.jsonl
          if [[ "$RUN_CONCLUSION" == "success" ]]; then
            python - <<'PY'
            from pathlib import Path
            p = Path('evolution/state.yaml')
            text = p.read_text(encoding='utf-8')
            text = text.replace('status: VALIDATION_PENDING', 'status: PASS')
            text = text.replace('last_verified_commit: null', 'last_verified_commit: "' + __import__('os').environ['RUN_SHA'] + '"')
            p.write_text(text, encoding='utf-8')
            PY
          else
            python - <<'PY'
            from pathlib import Path
            p = Path('evolution/state.yaml')
            text = p.read_text(encoding='utf-8')
            text = text.replace('status: VALIDATION_PENDING', 'status: BLOCKED')
            p.write_text(text, encoding='utf-8')
            PY
          fi

      - name: Commit evidence and state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evolution/gate_evidence.jsonl evolution/state.yaml
          if git diff --cached --quiet; then
            echo "No evidence changes."
            exit 0
          fi
          git commit -m "ci(governance): record gate evidence"
          git push origin evolution/trend-intelligence-council
