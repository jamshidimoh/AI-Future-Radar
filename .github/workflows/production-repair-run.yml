name: Isolated Production Repair
on:
  push:
    branches: [production-repair-final]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[isolated-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply targeted repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          main = Path('main.py')
          s = main.read_text(encoding='utf-8')
          anchor = 'def _direct_interview_signal(item): return has_interview_evidence(item)\n'
          if 'def _leader_source_authority(' not in s:
              fn = '''def _leader_source_authority(item):\n    """Return normalized source authority for leader ranking (higher is better)."""\n    try:\n        existing = item.get("leader_source_authority")\n    except AttributeError:\n        return 0\n    if existing is not None:\n        try:\n            return int(existing)\n        except (TypeError, ValueError):\n            pass\n    try:\n        tier = _source_tier(item)\n    except Exception:\n        tier = None\n    try:\n        tier = int(tier) if tier is not None else None\n    except (TypeError, ValueError):\n        tier = None\n    return max(0, 4 - tier) if tier is not None else 0\n'''
              if anchor not in s:
                  raise SystemExit('main authority anchor missing')
              s = s.replace(anchor, anchor + '\n' + fn, 1)
          main.write_text(s, encoding='utf-8')

          g = Path('src/fetch_google_news.py')
          s = g.read_text(encoding='utf-8')
          old = '''    workers = min(max_workers or _MAX_WORKERS, max(1, len(queries)))\n    if leader_query_mode and workers == 1 and len(queries) > 1:\n        workers = min(_MAX_WORKERS, len(queries)); print(f"[Leader Discovery Parallel] workers={workers}", flush=True)\n'''
          new = '''    workers = min(max_workers or _MAX_WORKERS, max(1, len(queries)))\n    if leader_query_mode and workers > 1:\n        print(f"[Leader Discovery Parallel] workers={workers}", flush=True)\n'''
          if old not in s:
              raise SystemExit('google-news worker override block missing')
          g.write_text(s.replace(old, new, 1), encoding='utf-8')

          test = Path('tests/test_leader_source_authority_contract.py')
          test.write_text('''from main import _leader_source_authority\n\ndef test_leader_source_authority_mapping():\n    assert _leader_source_authority({"source": "official", "source_tier": 1}) == 3\n    assert _leader_source_authority({"source": "Reuters", "source_tier": 2}) == 2\n    assert _leader_source_authority({"source": "other", "source_tier": 3}) == 1\n\ndef test_leader_source_authority_corrects_low_authority_metadata():\n    assert _leader_source_authority({"source": "Google News (Bitcoin World)", "source_tier": 1}) == 1\n''', encoding='utf-8')
          
          # Remove automatic restore/one-shot mechanisms from the final branch.
          for p in [
              '.github/workflows/restore-known-good-main.yml',
              '.github/workflows/restore-and-finalize.yml',
              '.github/workflows/one-shot-production-repair.yml',
          ]:
              Path(p).unlink(missing_ok=True)
          PY
          python -m compileall -q main.py src tests
          python -m pytest -q tests/test_leader_source_authority_contract.py tests/test_period_ranked_pipeline.py tests/test_source_authority_production_regression.py
      - name: Commit stable repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.py src/fetch_google_news.py tests/test_leader_source_authority_contract.py .github/workflows
          git commit -m 'fix: stabilize leader authority and bound google discovery concurrency [isolated-repair]'
          git push origin HEAD:production-repair-final
          
          git rm -f .github/workflows/production-repair-run.yml
          git commit -m 'chore: remove isolated repair workflow [skip ci]'
          git push origin HEAD:production-repair-final
