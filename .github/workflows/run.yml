name: Run AI Future Radar Bot

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_education:
        description: "Run a controlled end-to-end Education publication validation"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "47 1 * * *"
    - cron: "17 7,10,14,17,19 * * *"

permissions:
  contents: write

concurrency:
  group: ai-future-radar-production
  cancel-in-progress: false

jobs:
  run-bot:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - name: Checkout current ref
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run production regression checks
        run: |
          python -m compileall -q scripts src *.py
          python -m pytest -q tests/test_editorial_quality_policy.py tests/test_education_recovery_fallback.py tests/test_production_acceptance_guard.py tests/test_production_acceptance_contract.py tests/test_telegram_format.py tests/test_production_router_policy.py tests/test_critical_ai_incident_priority.py

      - name: Emit fail-closed closure evidence
        run: |
          python -m pytest -q tests/test_production_acceptance_guard.py -k "all_selected_candidates_rejected_downstream_is_fail_closed_pass or zero_publication_without_rejection_evidence_is_failure"
          echo "[Fail-Closed Acceptance Evidence] PASS"

      - name: Telegram production preflight
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: "-1004482051328"
        run: python -u scripts/telegram_preflight.py

      - name: Run bot with ranking audit
        env:
          PYTHONUNBUFFERED: "1"
          RADAR_WATCHDOG_MINUTES: "22"
          AI_RADAR_EDITORIAL_REVIEW: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: "-1004482051328"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_MODEL: ${{ vars.HF_MODEL }}
          HF_POLICY: free-first
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: timeout 24m bash -o pipefail -c 'python -u scripts/production_with_ranking_audit.py 2>&1 | tee run.log'

      - name: Recover required Education publication
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: "-1004482051328"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_MODEL: ${{ vars.HF_MODEL }}
          HF_POLICY: free-first
          FORCE_EDUCATION_PUBLICATION: ${{ github.event_name == 'workflow_dispatch' && inputs.force_education || false }}
        run: python -u scripts/education_recovery.py

      - name: Enforce runtime production acceptance
        run: python -u scripts/production_acceptance_guard.py run.log

      - name: Persist production state
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          state_files=(data/seen.json data/telegram_feedback.json data/education_state.json data/publication_state.json)
          git add "${state_files[@]}"
          if git diff --cached --quiet; then
            echo "No production state changes to commit."
            exit 0
          fi
          git commit -m "chore: persist production state [skip ci]"

          for attempt in 1 2 3; do
            git fetch origin "${{ github.ref_name }}" --depth=20
            if git rebase "origin/${{ github.ref_name }}"; then
              if git push origin "HEAD:${{ github.ref_name }}"; then
                echo "Production state persisted on attempt ${attempt}."
                exit 0
              fi
            else
              echo "State rebase attempt ${attempt} hit generated-state conflicts; merging JSON state instead of discarding remote history."
              python - <<'PY'
              import json
              import subprocess
              from pathlib import Path

              files = [
                  Path("data/seen.json"),
                  Path("data/telegram_feedback.json"),
                  Path("data/education_state.json"),
                  Path("data/publication_state.json"),
              ]

              def read_stage(stage, path):
                  try:
                      raw = subprocess.check_output(["git", "show", f":{stage}:{path.as_posix()}"], text=True)
                      return json.loads(raw)
                  except Exception:
                      return None

              def merge(a, b):
                  if isinstance(a, dict) and isinstance(b, dict):
                      out = dict(a)
                      for key, value in b.items():
                          out[key] = merge(out[key], value) if key in out else value
                      return out
                  if isinstance(a, list) and isinstance(b, list):
                      out = list(a)
                      seen = {json.dumps(x, ensure_ascii=False, sort_keys=True) for x in out}
                      for value in b:
                          marker = json.dumps(value, ensure_ascii=False, sort_keys=True)
                          if marker not in seen:
                              out.append(value)
                              seen.add(marker)
                      return out
                  return a if a is not None else b

              for path in files:
                  ours = read_stage(2, path)
                  theirs = read_stage(3, path)
                  if ours is None or theirs is None:
                      continue
                  merged = merge(ours, theirs)
                  path.write_text(json.dumps(merged, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
              PY
              git add "${state_files[@]}"
              GIT_EDITOR=true git rebase --continue
              if git push origin "HEAD:${{ github.ref_name }}"; then
                echo "Production state persisted after lossless JSON merge on attempt ${attempt}."
                exit 0
              fi
            fi
            git rebase --abort || true
            echo "State push attempt ${attempt} lost a race with the production branch; retrying."
            sleep $((attempt * 2))
          done
          echo "Unable to persist production state after 3 attempts."
          exit 1

      - name: Upload production diagnostics and ranking audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-future-radar-${{ github.event_name }}-${{ github.run_number }}
          path: |
            run.log
            artifacts/ranking_audit/
          if-no-files-found: warn
          retention-days: 14
