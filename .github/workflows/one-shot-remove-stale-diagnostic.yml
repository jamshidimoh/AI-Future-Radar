name: One-shot stale diagnostic repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.event.head_commit.message != 'fix: remove stale leader diagnostic [skip ci]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove stale diagnostic call
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('main.py')
          text = p.read_text(encoding='utf-8')
          old = 'print(f"After link dedup: {len(new_items)}"); _leader_protection_diagnostic(verified_leader_interviews, new_items)'
          new = 'print(f"After link dedup: {len(new_items)}")'
          if old not in text:
              raise SystemExit('expected stale diagnostic call not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.py
          git commit -m 'fix: remove stale leader diagnostic [skip ci]'
          git push origin HEAD:main
