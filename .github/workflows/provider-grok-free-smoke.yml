name: Provider Local Ollama Free Smoke Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-ollama-free-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Install Ollama and model
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen3:1.7b
      - name: Smoke test local Ollama free fallback
        run: |
          python - <<'PY'
          import json
          import requests

          url = "http://127.0.0.1:11434/api/chat"
          payload = {
              "model": "qwen3:1.7b",
              "messages": [
                  {
                      "role": "system",
                      "content": 'Return exactly one JSON object with the key "ok" set to true.',
                  },
                  {"role": "user", "content": "Provider smoke test."},
              ],
              "stream": False,
              "think": False,
              "format": "json",
          }
          headers = {
              "Content-Type": "application/json",
                  "Referer": "https://github.com/jamshidimoh/AI-Future-Radar",
              "X-Title": "AI Future Radar",
          }
          response = requests.post(url, headers=headers, json=payload, timeout=20)
          print("HTTP_STATUS", response.status_code)
          response.raise_for_status()
          body = response.json()
          content = body["message"]["content"]
          parsed = json.loads(content)
          assert parsed.get("ok") is True, parsed
          print("LOCAL_OLLAMA_FREE_SMOKE_PASS", json.dumps(parsed, ensure_ascii=False))
          PY
