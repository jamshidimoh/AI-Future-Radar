name: Temporary Runtime Repair

on:
  push:
    branches: [main]
    paths:
      - "README.md"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply and validate runtime contract repair
        run: |
          python scripts/repair_runtime_contracts.py
          python -m pytest -q \
            tests/test_canonical_ranking.py::test_protected_leader_capacity_demotes_overflow_candidates \
            tests/test_mission_coverage_recovery.py \
            tests/test_production_ranking_audit_hook.py::test_parallel_summary_preserves_input_order_and_runs_concurrently \
            tests/test_protected_leader_bypass.py \
            tests/test_selection_refill_after_late_dedup.py \
            tests/test_protected_leader_semantic_dedup.py

      - name: Persist runtime fixes and remove temporary repair hooks
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/repair_runtime_contracts.py .github/workflows/repair-runtime.yml
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/run.yml')
          s = p.read_text(encoding='utf-8')
          start = '      # BEGIN ONE_TIME_CONTRACT_REPAIR\n'
          end = '      # END ONE_TIME_CONTRACT_REPAIR\n'
          if start in s and end in s:
              a = s.index(start)
              b = s.index(end, a) + len(end)
              s = s[:a] + s[b:]
              p.write_text(s, encoding='utf-8')
          q = Path('.github/workflows/test-quality.yml')
          s = q.read_text(encoding='utf-8')
          start = '      - name: Repair runtime contracts before validation\n'
          end = '      - name: Remove one-time repair hooks and persist the real fixes\n'
          if start in s and end in s:
              a = s.index(start)
              b = s.index(end, a)
              s = s[:a] + s[b:]
              s = s.replace('permissions:\n  contents: write', 'permissions:\n  contents: read', 1)
              q.write_text(s, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py src/story_identity.py .github/workflows/run.yml .github/workflows/test-quality.yml scripts/repair_runtime_contracts.py .github/workflows/repair-runtime.yml
          git commit -m "fix: restore generic runtime contracts [skip ci]"
          git push origin HEAD:main
