# AI Future Radar — production contract
# Cross-cutting invariants. Mission taxonomy remains in mission_policy.yaml;
# executable selection mechanics remain in selection_policy.yaml and are
# validated here so the three layers cannot drift silently.

contract:
  version: 4
  mission_policy: config/mission_policy.yaml
  selection_policy: config/selection_policy.yaml
  architecture_document: ARCHITECTURE.md
  final_acceptance_document: docs/PRODUCTION_FINAL_ACCEPTANCE.md

protected:
  people:
    source: config/leader_watchlist.yaml
    distinct_per_run: true
    max_slots: 1
    interviews_and_activity_use_distinct_reasons: true
  sources:
    - name: "MIT CSAIL - Building 32"
      match: ["MIT CSAIL", "Building 32", "cap.csail.mit.edu"]
      max_per_run: 1
      selection_mode: "priority"
      duplicate_key: "source"

mission:
  supported_areas: [ai_core, convergence, mind_cognition, future_governance]
  min_unique_sources: 3
  preferred_max_same_source_per_run: 1
  hard_max_same_source_per_run: 2
  max_same_mission_area_per_run: 4
  min_authoritative_items: 2
  community_max: 0
  ai_core_target: [1, 2]
  convergence_target: 1
  mind_cognition_target: 1
  mind_future_target: 1
  research_target: 0
  interview_target_max: 2

selection:
  max_posts: 8
  candidate_window: 12
  replacement_buffer: 4
  normal_relative_score_gap: 15.0
  publication_mode: adaptive_quality_threshold
  diversity_mode: unified_final_portfolio
  distinct_sources_first: true
  special_lanes_are_candidate_roles: true
  protected_leader_consumes_final_slot: true
  historical_source_usage_is_hard_exclusion: false
  editorial_balance:
    ai_core_target_min: 1
    ai_core_target_max: 2
    max_genetics_per_run: 1
    genetics_diversity_penalty: 15
    max_health_medical_per_run: 1
    health_medical_diversity_penalty: 12
    prefer_verified_ai_leader_voice: true
    secondary_area_priority: [mind_cognition, future_governance, convergence]
    technical_depth_penalty: 10

quality:
  language_gate: src/editorial_quality_policy.py
  title_persian_ratio_min: 0.25
  body_persian_ratio_min: 0.60
  generic_why_blocked: true
  source_evidence_required: true
  adaptive_normal_score_policy: true
  mind_ideas_voices_score_floor: 50.0
  final_news_capacity: 8
  publication_mode: adaptive_quality_threshold
  fixed_three_item_quota: false

source_boundary:
  excluded_domains: [arxiv.org, export.arxiv.org]
  exclusion_stage: [discovery, ingestion]

runtime_rules:
  regular_items_use_ai_relevance_gate: true
  llm_failure_is_fail_closed: true
  publication_requires_valid_payload: true
  confirmed_delivery_required_before_state_advance: true
  replacement_after_quality_failure: true
  replacement_after_downstream_publication_rejection: true
