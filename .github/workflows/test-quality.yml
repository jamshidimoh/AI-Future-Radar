name: Test Radar Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q main.py src tests
      - name: Validate production imports
        run: python -c "import main, period_ranked_pipeline, production_entrypoint, production_resilient_runner; from src.trend_registry import TrendRegistry; print('PRODUCTION_IMPORTS_OK', TrendRegistry.__name__)"
      - name: Validate configuration
        run: python -c "import yaml; s=yaml.safe_load(open('config/selection_policy.yaml',encoding='utf-8')); l=yaml.safe_load(open('config/leader_watchlist.yaml',encoding='utf-8')); t=yaml.safe_load(open('config/trend_intelligence.yaml',encoding='utf-8')); assert s['selection']['max_posts'] == 3; assert s['selection']['candidate_window'] == 6; assert s['selection']['candidate_window'] > s['selection']['max_posts']; assert s['selection']['max_items_per_source'] >= 1; assert s['selection']['diversity_mode'] == 'adaptive'; assert s['selection']['preferred_max_same_source'] == 1; assert s['editorial']['leader_protected_max'] == 2; assert s['editorial']['technical_depth_penalty'] >= 1; assert t['publication_decoupled'] is True; assert 'consciousness_cognition' in t['domains']; assert 'philosophy_of_science' in t['domains']; assert 'futures_foresight' in t['domains']; names=sum([g['names'] for g in l['people'].values()],[]); assert 'Sam Altman' in names and 'Yuval Noah Harari' in names and 'Anil Seth' in names; print('CONFIG_OK', len(names))"
      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check 'ruff>=0.12,<0.13'
      - name: Ruff repository audit (non-blocking)
        continue-on-error: true
        run: python -m ruff check --select F main.py src tests
      - name: Ruff changed-surface gate
        run: python -m ruff check --select F src/llm_router_light.py tests/test_hf_light_router.py
      - name: Run full quality contract suite
        run: python -m pytest -q
      - name: CI execution marker
        run: echo "TREND_INTELLIGENCE_REGISTRY_CONTRACT_V1"
