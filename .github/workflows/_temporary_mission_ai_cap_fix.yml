name: Temporary Mission AI Cap Repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor == 'jamshidimoh' || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply targeted selector repair
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/unified_editorial_selection.py')
          s = p.read_text(encoding='utf-8')
          old = '''        candidates = [x for x in ordered if mission_area(x) == "ai_core" and id(x) not in p.selected_ids and p.admissible(x, repeat_source=False, ignore_type_cap=True)]\n        candidate = max(candidates, key=lambda x: (candidate_score(x), _safe_float(x, "evidence_strength")), default=None)\n'''
          new = '''        candidates = [x for x in ordered if mission_area(x) == "ai_core" and id(x) not in p.selected_ids and p.admissible(x, repeat_source=False)]\n        # The type ceiling is soft only when it would otherwise starve the AI lane.\n        if not candidates:\n            candidates = [x for x in ordered if mission_area(x) == "ai_core" and id(x) not in p.selected_ids and p.admissible(x, repeat_source=False, ignore_type_cap=True)]\n        candidate = max(candidates, key=lambda x: (candidate_score(x), _safe_float(x, "evidence_strength")), default=None)\n'''
          if old not in s:
              raise SystemExit('AI mission target block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/_temporary_mission_ai_cap_fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/unified_editorial_selection.py .github/workflows/_temporary_mission_ai_cap_fix.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: apply soft type cap fallback to ai mission target'
          git push origin HEAD:main
