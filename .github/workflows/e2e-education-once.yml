name: E2E Education Once

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ai-future-radar-e2e-once
  cancel-in-progress: false

jobs:
  e2e:
    if: contains(github.event.head_commit.message, '[e2e-education]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current ref
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Refresh and validate free-model registry
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          KIRAAI_API_KEY: ${{ secrets.KIRAAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NARAROUTER_API_KEY: ${{ secrets.NARAROUTER_API_KEY }}
          FREE_LLM_ROUTER_API_KEY: ${{ secrets.FREE_LLM_ROUTER_API_KEY }}
        run: python -u scripts/refresh_free_model_registry.py --strict

      - name: Bridge Free LLM Router discovery into runtime registry
        env:
          FREE_LLM_ROUTER_API_KEY: ${{ secrets.FREE_LLM_ROUTER_API_KEY }}
        run: python -u scripts/bridge_free_llm_router.py

      - name: Telegram production preflight
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
        run: python -u scripts/telegram_preflight.py

      - name: Run production bot
        env:
          PYTHONUNBUFFERED: 1
          RADAR_PRODUCTION_MODE: 1
          RADAR_WATCHDOG_MINUTES: 22
          RADAR_SUMMARY_WORKERS: 1
          AI_RADAR_EDITORIAL_REVIEW: 0
          RADAR_ENABLE_GEMINI_FALLBACK: 0
          RADAR_ENABLE_HF_FALLBACK: 1
          RADAR_LLM_MAX_TOKENS: 1100
          RADAR_ROUTER_BUDGET_SECONDS: 24
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          KIRAAI_API_KEY: ${{ secrets.KIRAAI_API_KEY }}
          FREE_LLM_ROUTER_API_KEY: ${{ secrets.FREE_LLM_ROUTER_API_KEY }}
          NARAROUTER_API_KEY: ${{ secrets.NARAROUTER_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_MODEL: ${{ vars.HF_MODEL }}
          HF_POLICY: free-first
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: timeout 24m bash -o pipefail -c 'python -u scripts/production_with_ranking_audit.py 2>&1 | tee run.log'

      - name: Recover required Education publication
        if: always()
        env:
          PYTHONUNBUFFERED: 1
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          KIRAAI_API_KEY: ${{ secrets.KIRAAI_API_KEY }}
          FREE_LLM_ROUTER_API_KEY: ${{ secrets.FREE_LLM_ROUTER_API_KEY }}
          NARAROUTER_API_KEY: ${{ secrets.NARAROUTER_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_MODEL: ${{ vars.HF_MODEL }}
          HF_POLICY: free-first
          FORCE_EDUCATION_PUBLICATION: false
        run: |
          if [ -f run.log ]; then
            python -u scripts/education_recovery.py
          else
            echo "[Education Recovery] skipped: runtime log unavailable"
          fi

      - name: Enforce runtime production acceptance
        if: always()
        run: |
          if [ -f run.log ]; then
            python -u scripts/production_acceptance_guard.py run.log
          else
            echo "[Production Acceptance] BLOCKED: runtime log unavailable"
            exit 1
          fi

      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-future-radar-e2e-education-${{ github.run_number }}
          path: |
            run.log
            artifacts/ranking_audit/
            artifacts/free_model_registry.runtime.yaml
          retention-days: 7
          if-no-files-found: warn
