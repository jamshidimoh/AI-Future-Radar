name: G8 Controlled Integration Validation

on:
  push:
    branches:
      - evolution/technology-intelligence-g8
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g8-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run full regression suite
        run: python -m pytest -q

      - name: Run G8 focused contract
        run: python -m pytest -q tests/test_controlled_intelligence_bridge_v1.py

      - name: Validate frozen production acceptance
        run: python -m pytest -q tests/test_final_production_acceptance.py tests/test_production_acceptance_contract.py

      - name: Validate G8 rollout safety configuration
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          data = yaml.safe_load(Path("config/controlled_intelligence_bridge.yaml").read_text(encoding="utf-8"))
          cfg = data["controlled_intelligence_bridge"]
          assert cfg["version"] == 1
          assert cfg["mode"] == "shadow"
          assert cfg["apply"] is False
          assert cfg["rollback_enabled"] is True
          assert cfg["publication_side_effect"] is False
          assert cfg["require_shadow_pass"] is True
          assert cfg["require_explicit_controlled_mode"] is True
          print("G8 rollout safety contract: PASS")
          PY
