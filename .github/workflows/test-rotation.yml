name: Test Story Rotation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    if: ${{ !contains(github.event.head_commit.message, '[protected-order-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Repair protected source ordering and validate
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('main.py')
          s=p.read_text(encoding='utf-8')
          old='''def _split_protected(items, max_protected):
    protected_candidates = [x for x in items if x.get("protected_content")]
    protected_candidates = sorted(protected_candidates, key=lambda x: str(x.get("published") or ""), reverse=True)
    protected_candidates = sorted(protected_candidates, key=lambda x: int(_source_tier(x) if _source_tier(x) is not None else 99))
    protected = sorted(protected_candidates, key=lambda x: int(x.get("leader_priority", 0) or 0), reverse=True)[:max_protected]
    protected_ids = {id(x) for x in protected}
    regular = [x for x in items if id(x) not in protected_ids]
    return protected, regular
'''
          new='''def _split_protected(items, max_protected):
    protected_candidates = [x for x in items if x.get("protected_content")]
    protected = sorted(
        protected_candidates,
        key=lambda x: (
            int(x.get("leader_priority", 0) or 0),
            int(_leader_source_authority(x)),
            str(x.get("published") or ""),
        ),
        reverse=True,
    )[:max_protected]
    protected_ids = {id(x) for x in protected}
    regular = [x for x in items if id(x) not in protected_ids]
    return protected, regular
'''
          if old not in s: raise SystemExit('protected block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          python -m compileall -q main.py src tests
          python -m pytest -q tests/test_source_authority_production_regression.py tests/test_leader_source_authority_contract.py tests/test_period_ranked_pipeline.py
      - name: Commit repaired code and restore workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py
          git commit -m "fix: correct protected source ordering [protected-order-fixed]"
          git push origin HEAD:main
          cat > .github/workflows/test-rotation.yml <<'EOF'
          name: Test Story Rotation
          on:
            push:
              branches:
                - main
            pull_request:
              branches:
                - main
          permissions:
            contents: read
          jobs:
            test:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v6
                - uses: actions/setup-python@v6
                  with:
                    python-version: "3.11"
                - name: Install dependencies
                  run: python -m pip install -r requirements.txt
                - name: Compile Python modules
                  run: python -m compileall -q main.py src
                - name: Run Python unit tests
                  run: python -m unittest discover -s tests -p 'test_*.py' -v
                - name: Test story clustering and source rotation
                  run: |
                    python - <<'PY'
                    import sys
                    sys.path.insert(0, "src")
                    from semantic_dedup import deduplicate_semantically
                    from editorial import enrich_items, select_editorial
                    items = [
                        {"title": "OpenAI launches new reasoning model", "summary": "AI reasoning model", "category": "ai", "source": "Source A", "content_type": "official", "source_tier": 1, "official": True, "published": ""},
                        {"title": "OpenAI unveils its new reasoning model", "summary": "same AI model story", "category": "ai", "source": "Source B", "content_type": "news", "source_tier": 2, "official": False, "published": ""},
                        {"title": "Stanford releases new AI agent benchmark", "summary": "agent benchmark", "category": "ai", "source": "Source C", "content_type": "research", "source_tier": 1, "official": True, "published": ""},
                    ]
                    for item in items: item["_ai_link"] = True
                    enriched = enrich_items(items,{"Sam Altman":10},source_history=[{"ts":0,"source":"Source A"}],policy={"rotation_days":7,"technical_depth_penalty":3})
                    enriched.sort(key=lambda x:x["editorial_score"],reverse=True)
                    kept = deduplicate_semantically(enriched,[],threshold=0.45)
                    selected = select_editorial(kept,max_posts=3,max_per_source=2,max_per_type=2)
                    assert len(selected)==2, selected
                    assert {x["source"] for x in selected}=={"Source A","Source C"}, selected
                    print("STORY_ROTATION_OK")
                    PY
          EOF
          git add .github/workflows/test-rotation.yml
          git commit -m "chore: restore test rotation workflow [skip ci]"
          git push origin HEAD:main
