name: Evolution Gate State Machine

on:
  push:
    branches: ["evolution/trend-intelligence-council"]
    paths:
      - "evolution/gate_evidence.jsonl"
      - "evolution/state.yaml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: evolution-gate-state
  cancel-in-progress: false

jobs:
  advance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: evolution/trend-intelligence-council
          fetch-depth: 1

      - name: Evaluate latest immutable G5 evidence
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/state.env
          import json
          import subprocess
          from pathlib import Path

          state = {}
          for line in Path('evolution/state.yaml').read_text(encoding='utf-8').splitlines():
              if ': ' in line and not line.startswith(' '):
                  k, v = line.split(': ', 1)
                  state[k] = v.strip().strip('"')
          gate = state.get('current_gate')
          if gate != 'G5':
              print(f'GATE={gate}')
              print('SHOULD_ADVANCE=false')
              raise SystemExit(0)

          records = []
          for raw in Path('evolution/gate_evidence.jsonl').read_text(encoding='utf-8').splitlines():
              if not raw.strip() or '"note"' in raw:
                  continue
              records.append(json.loads(raw))
          if not records:
              raise SystemExit('No immutable evidence records; fail closed.')
          evidence = records[-1]
          required = {'schema_version','gate','commit_sha','workflow_run_id','test_result','acceptance_result','timestamp_utc','notes'}
          missing = required - evidence.keys()
          if missing:
              raise SystemExit(f'Missing evidence fields: {sorted(missing)}')
          if evidence['gate'] != gate or evidence['test_result'] != 'PASS' or evidence['acceptance_result'] != 'PASS':
              raise SystemExit('Latest G5 evidence is not PASS; fail closed.')

          run_id = str(evidence['workflow_run_id'])
          raw = subprocess.check_output(['gh','api',f'repos/{__import__("os").environ["GITHUB_REPOSITORY"]}/actions/runs/{run_id}'], text=True)
          run = json.loads(raw)
          if run.get('name') != 'Autonomous Evolution Controller':
              raise SystemExit('Evidence run is not the Autonomous Evolution Controller; fail closed.')
          if run.get('conclusion') != 'success':
              raise SystemExit('Evidence controller run is not successful; fail closed.')
          if run.get('head_sha') != evidence['commit_sha']:
              raise SystemExit('Evidence commit_sha does not match controller head_sha; fail closed.')

          print(f'GATE={gate}')
          print(f'EVIDENCE_SHA={evidence["commit_sha"]}')
          print(f'EVIDENCE_RUN={run_id}')
          print('SHOULD_ADVANCE=true')
          PY
          cat /tmp/state.env >> "$GITHUB_OUTPUT"

      - name: Advance validated gate
        if: steps.state.outputs.SHOULD_ADVANCE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('evolution/state.yaml')
          text = p.read_text(encoding='utf-8')
          gate = '${{ steps.state.outputs.GATE }}'
          evidence_sha = '${{ steps.state.outputs.EVIDENCE_SHA }}'
          transitions = {'G5': 'G6', 'G6': 'G7', 'G7': 'G8', 'G8': 'G9'}
          if gate not in transitions:
              raise SystemExit(f'No automatic transition defined for {gate}; fail closed.')
          new_gate = transitions[gate]
          following = transitions.get(new_gate)
          text = text.replace(f'current_gate: {gate}', f'current_gate: {new_gate}')
          text = re.sub(r'^next_gate: .*$', f'next_gate: {following if following else "null"}', text, flags=re.M)
          text = re.sub(r'^status: .*$', 'status: VALIDATED', text, flags=re.M)
          text = re.sub(r'^last_verified_commit: .*$', f'last_verified_commit: {evidence_sha}', text, flags=re.M)
          p.write_text(text, encoding='utf-8')
          print(f'Advanced {gate} -> {new_gate}; next={following}')
          PY

      - name: Commit state transition
        if: steps.state.outputs.SHOULD_ADVANCE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evolution/state.yaml
          git diff --cached --quiet && exit 0
          git commit -m "ci(evolution): advance validated gate"
          git push origin evolution/trend-intelligence-council
