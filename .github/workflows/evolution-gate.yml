name: Evolution Gate State Machine

on:
  workflow_run:
    workflows: ["Gate Evidence Collector"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: evolution-gate-state
  cancel-in-progress: false

jobs:
  advance:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: evolution/trend-intelligence-council
          fetch-depth: 1

      - name: Evaluate gate state and current evidence
        id: state
        shell: bash
        env:
          COLLECTOR_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/state.env
          import json
          import os
          from pathlib import Path
          state = {}
          for line in Path('evolution/state.yaml').read_text(encoding='utf-8').splitlines():
              if ': ' in line and not line.startswith(' '):
                  k, v = line.split(': ', 1)
                  state[k] = v
          gate = state.get('current_gate')
          collector_run = int(os.environ.get('COLLECTOR_RUN_ID', '0'))
          found = None
          if collector_run:
              for raw in Path('evolution/gate_evidence.jsonl').read_text(encoding='utf-8').splitlines():
                  if not raw.strip() or '"note"' in raw:
                      continue
                  r = json.loads(raw)
                  if (r.get('gate') == gate and r.get('collector_run_id') == collector_run
                      and r.get('test_result') == 'PASS' and r.get('acceptance_result') == 'PASS'):
                      found = r
          if not found:
              raise SystemExit(f'No PASS evidence bound to collector run {collector_run} for {gate}; fail closed.')
          print(f"GATE={gate}")
          print(f"EVIDENCE_SHA={found['commit_sha']}")
          print(f"EVIDENCE_RUN={found['workflow_run_id']}")
          PY
          cat /tmp/state.env
          cat /tmp/state.env >> "$GITHUB_OUTPUT"

      - name: Advance validated gate
        if: github.event_name == 'workflow_run'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('evolution/state.yaml')
          text = p.read_text(encoding='utf-8')
          transitions = {'G3': 'G4', 'G4': 'G5', 'G5': 'G6', 'G6': 'G7', 'G7': 'G8', 'G8': 'G9'}
          gate = '${{ steps.state.outputs.GATE }}'
          evidence_sha = '${{ steps.state.outputs.EVIDENCE_SHA }}'
          if gate not in transitions:
              raise SystemExit(f'No automatic transition defined for {gate}; fail closed.')
          new_gate = transitions[gate]
          text = text.replace(f'current_gate: {gate}', f'current_gate: {new_gate}')
          text = text.replace(f'next_gate: {new_gate}', 'next_gate: null')
          text = re.sub(r'^last_verified_commit: .*$', f'last_verified_commit: {evidence_sha}', text, flags=re.M)
          p.write_text(text, encoding='utf-8')
          print(f'Advanced {gate} -> {new_gate}')
          PY

      - name: Commit state transition
        if: github.event_name == 'workflow_run'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evolution/state.yaml
          git commit -m "ci(evolution): advance validated gate"
          git push origin evolution/trend-intelligence-council
