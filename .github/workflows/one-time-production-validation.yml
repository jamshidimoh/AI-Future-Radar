name: One-Time Production Validation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-production-validation.yml"

permissions:
  contents: write

concurrency:
  group: ai-future-radar-one-time-validation
  cancel-in-progress: false

jobs:
  validate-production:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run production regression checks
        run: |
          python -m compileall -q scripts src *.py
          python -m pytest -q tests/test_production_acceptance_guard.py tests/test_production_acceptance_contract.py

      - name: Telegram production preflight
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: "-1004482051328"
        run: python -u scripts/telegram_preflight.py

      - name: Run bot with ranking audit
        env:
          PYTHONUNBUFFERED: "1"
          RADAR_WATCHDOG_MINUTES: "22"
          AI_RADAR_EDITORIAL_REVIEW: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: "-1004482051328"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_MODEL: ${{ vars.HF_MODEL }}
          HF_POLICY: free-first
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: timeout 24m bash -o pipefail -c 'python -u scripts/production_with_ranking_audit.py 2>&1 | tee run.log'

      - name: Enforce runtime production acceptance
        run: python -u scripts/production_acceptance_guard.py run.log

      - name: Persist production state
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen.json data/telegram_feedback.json data/education_state.json data/publication_state.json
          if git diff --cached --quiet; then
            echo "No production state changes to commit."
            exit 0
          fi
          git commit -m "chore: persist one-time validation state [skip ci]"
          git fetch origin main --depth=20
          git rebase origin/main
          git push origin HEAD:main

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-future-radar-one-time-validation-${{ github.run_number }}
          path: |
            run.log
            artifacts/ranking_audit/
          if-no-files-found: warn
          retention-days: 7

      - name: Remove one-time validation workflow
        if: always()
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-time-production-validation.yml
          git add .github/workflows/one-time-production-validation.yml
          if git diff --cached --quiet; then
            echo "Temporary workflow already removed."
            exit 0
          fi
          git commit -m "chore: remove one-time production validation workflow [skip ci]"
          git fetch origin main --depth=20
          git rebase origin/main
          git push origin HEAD:main
