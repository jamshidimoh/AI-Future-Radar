name: Run AI Future Radar Bot

on:
  # Tehran publication windows: 05:17, 10:47, 13:47, 17:47, 20:47, 22:47 (UTC+3:30). GitHub Actions cron is UTC. Production validation trigger preserved; mission/Dedup contract synchronized.
  schedule:
    - cron: "47 1 * * *"
    - cron: "17 7,10,14,17,19 * * *"
  workflow_dispatch:
  push:
    paths:
      - "main.py"
      - "production_entrypoint.py"
      - "period_ranked_pipeline.py"
      - "src/**"
      - "scripts/**"
      - "config/**"
      - ".github/workflows/**"
      - "requirements.txt"

permissions:
  contents: write

concurrency:
  group: ai-future-radar-production
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - name: Checkout current ref
        uses: actions/checkout@v6

      # BEGIN ONE_TIME_CONTRACT_REPAIR
      - name: One-time runtime contract repair
        shell: python
        run: |
          from pathlib import Path
          p = Path("main.py")
          s = p.read_text(encoding="utf-8")
          replacements = [
            ('def _is_protected_leader_interview(item):\n    return bool(item.get("is_leader_watch") and _has_explicit_interview_evidence(item))', 'def _is_protected_leader_interview(item):\n    return bool((item.get("is_leader_watch") or item.get("leader_watch_protected")) and _has_explicit_interview_evidence(item))'),
            ('def _is_protected_leader_activity(item):\n    return bool(item.get("is_leader_watch") and _leader_activity_signal(item))', 'def _is_protected_leader_activity(item):\n    return bool((item.get("is_leader_watch") or item.get("leader_watch_protected")) and _leader_activity_signal(item))'),
            ('def _split_protected(items, max_protected):', 'def _split_protected(items, max_protected=2):'),
            ('        if existing:\n            if existing in names:\n                watch_candidates += 1; item["leader_priority"] = priorities.get(existing, int(item.get("leader_priority", 0) or 0))\n            continue', '        if existing:\n            if existing in names:\n                watch_candidates += 1; item["leader_priority"] = priorities.get(existing, int(item.get("leader_priority", 0) or 0))\n                if has_interview_evidence(item): item["_named_leader_interview"] = True\n            continue'),
            ('        if matched_name:\n            item["leader"] = matched_name; item["watch_person"] = matched_name; item["is_leader"] = True; item["is_leader_watch"] = True; item["leader_priority"] = priorities.get(matched_name, 0); matched += 1', '        if matched_name:\n            item["leader"] = matched_name; item["watch_person"] = matched_name; item["is_leader"] = True; item["is_leader_watch"] = True; item["leader_priority"] = priorities.get(matched_name, 0); matched += 1\n            if has_interview_evidence(item): item["_named_leader_interview"] = True'),
            ('def _summarize_selected(items, summarize_fn):\n    return [summarize_fn(item) for item in items]', 'def _summarize_selected(items, summarize_fn):\n    workers = max(1, int(os.getenv("RADAR_SUMMARY_WORKERS", "1") or 1))\n    if workers == 1 or len(items) <= 1:\n        return [summarize_fn(item) for item in items]\n    with ThreadPoolExecutor(max_workers=min(workers, len(items))) as executor:\n        futures = [executor.submit(summarize_fn, item) for item in items]\n        return [future.result() for future in futures]'),
            ('def _refill_after_late_dedup(selected, editorial_pool, select_editorial_fn, max_posts, max_per_source, max_per_type, policy, seen_hashes, runtime_selection_cap):\n    target = min(runtime_selection_cap, max_posts + int(policy.get("leader_protected_max", 2) or 2))\n    if len(selected) >= target: return selected\n    existing = {str(x.get("canonical_url") or x.get("link") or x.get("url") or x.get("title") or id(x)) for x in selected}\n    pool = [x for x in editorial_pool if str(x.get("canonical_url") or x.get("link") or x.get("url") or x.get("title") or id(x)) not in existing]', 'def _refill_after_late_dedup(selected, editorial_pool, select_editorial_fn, max_posts, max_per_source, max_per_type, policy, seen_hashes, runtime_selection_cap=None, *, cap=None):\n    if runtime_selection_cap is None:\n        runtime_selection_cap = cap if cap is not None else max_posts + int(policy.get("leader_protected_max", 2) or 2)\n    target = min(runtime_selection_cap, max_posts + int(policy.get("leader_protected_max", 2) or 2))\n    selected = filter_new_items(selected, seen_hashes)\n    existing = {str(x.get("canonical_url") or x.get("link") or x.get("url") or x.get("title") or id(x)) for x in selected}\n    pool = [x for x in editorial_pool if not x.get("protected_content") and not x.get("protected_slot") and str(x.get("canonical_url") or x.get("link") or x.get("url") or x.get("title") or id(x)) not in existing]\n    pool = filter_new_items(pool, seen_hashes)'),
            ('def _mission_coverage_recovery(selected, editorial_pool, select_editorial_fn, summarize_fn, max_per_source, max_per_type, policy, seen_hashes):\n    target = 1 if any(str(x.get("category") or "") in {"mind", "future", "mind_cognition", "future_governance"} for x in editorial_pool) else 0', 'def _mission_coverage_recovery(selected, editorial_pool, select_editorial_fn, summarize_fn, max_per_source, max_per_type, policy, seen_hashes):\n    mission_areas = {"mind", "future", "mind_cognition", "future_governance"}\n    def _area(item): return str(item.get("mission_area") or item.get("category") or "").strip().casefold()\n    target = 1 if any(_area(x) in mission_areas for x in editorial_pool) else 0'),
            ('    prepared = sum(1 for x in selected if str(x.get("category") or "") in {"mind", "future", "mind_cognition", "future_governance"} and float(x.get("final_editorial_score", x.get("editorial_score", 0)) or 0) >= NORMAL_SCORE_FLOOR and not x.get("_publication_blocked"))', '    prepared = sum(1 for x in selected if _area(x) in mission_areas and float(x.get("final_editorial_score", x.get("editorial_score", 0)) or 0) >= NORMAL_SCORE_FLOOR and not x.get("_publication_blocked"))'),
            ('str(candidate.get("category") or "")', '_area(candidate)'),
          ]
          changed = 0
          for old, new in replacements:
              if old in s:
                  s = s.replace(old, new, 1)
                  changed += 1
          if changed != len(replacements):
              raise SystemExit(f"CONTRACT_REPAIR_INCOMPLETE changed={changed}/{len(replacements)}")
          p.write_text(s, encoding="utf-8")
          compile(s, str(p), "exec")
          print("CONTRACT_REPAIR_APPLIED")

      - name: Remove one-time contract repair after validation
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          python -m pytest -q tests/test_canonical_ranking.py::test_protected_leader_capacity_demotes_overflow_candidates tests/test_mission_coverage_recovery.py tests/test_production_ranking_audit_hook.py::test_parallel_summary_preserves_input_order_and_runs_concurrently tests/test_protected_leader_bypass.py tests/test_selection_refill_after_late_dedup.py tests/test_workflow_persistence_contract.py
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/run.yml')
          s = p.read_text(encoding='utf-8')
          start_marker = '      # BEGIN_ONE_TIME_REPAIR\n'
          end_marker = '      # END_ONE_TIME_REPAIR\n'
          legacy_start = '      # BEGIN ONE_TIME_CONTRACT_REPAIR\n'
          legacy_end = '      # END ONE_TIME_CONTRACT_REPAIR\n'
          if legacy_start not in s or legacy_end not in s:
              raise SystemExit('ONE_TIME_REPAIR_MARKERS_MISSING')
          block_start = s.index(legacy_start)
          block_end = s.index(legacy_end, block_start) + len(legacy_end)
          s = s[:block_start] + s[block_end:]
          p.write_text(s, encoding='utf-8')
          print('ONE_TIME_REPAIR_REMOVED')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py .github/workflows/run.yml
          git commit -m "fix: restore generic runtime contract invariants"
          git push origin HEAD:main
      # END ONE_TIME_CONTRACT_REPAIR

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run production regression checks
        run: |
          python -m compileall -q scripts src *.py
          python -m pytest -q tests/test_editorial_quality_policy.py tests/test_education_recovery_fallback.py tests/test_production_acceptance_guard.py tests/test_production_acceptance_contract.py tests/test_telegram_format.py tests/test_production_router_policy.py tests/test_free_model_registry.py tests/test_free_model_intelligence.py tests/test_free_model_evidence.py tests/test_litellm_registry_integration.py tests/test_critical_ai_incident_priority.py tests/test_event_identity_regression.py tests/test_llm_router_resilience.py tests/test_llm_health_persistence.py tests/test_production_contract.py tests/test_publication_summary_budget.py tests/test_replacement_buffer_contract.py tests/test_schedule_contract.py tests/test_unified_editorial_selection.py tests/test_semantic_story_regression.py tests/test_protected_leader_semantic_dedup.py tests/test_strategic_analytical_lane.py

      - name: Emit fail-closed closure evidence
        run: |
          python -m pytest -q tests/test_production_acceptance_guard.py -k "all_selected_candidates_rejected_downstream_is_fail_closed_pass or zero_publication_without_rejection_evidence_is_failure"
          echo "[Fail-Closed Acceptance Evidence] PASS"

      - name: Emit single-message publication evidence
        run: |
          python -m pytest -q tests/test_telegram_single_delivery.py tests/test_telegram_single_delivery_adapter.py tests/test_telegram_format.py
          echo "[Image Delivery Contract Evidence] PASS"

      - name: Refresh and validate free-model registry
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          KIRAAI_API_KEY: ${{ secrets.KIRAAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FREE_LLM_ROUTER_API_KEY: ${{ secrets.FREE_LLM_ROUTER_API_KEY }}
          NARAROUTER_API_KEY: ${{ secrets.NARAROUTER_API_KEY }}
        run: python -u scripts/refresh_free_model_registry.py --strict

      - name: Bridge Free LLM Router discovery into runtime registry
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FREE_LLM_ROUTER_API_KEY: ${{ secrets.FREE_LLM_ROUTER_API_KEY }}
        run: python -u scripts/bridge_free_llm_router.py

      - name: Nara live smoke test
        env:
          NARAROUTER_API_KEY: ${{ secrets.NARAROUTER_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import requests
          key = os.getenv("NARAROUTER_API_KEY", "").strip()
          if not key:
              print("[Nara Smoke] skipped: secret not configured")
              raise SystemExit(0)
          r = requests.post("https://router.bynara.id/v1/chat/completions", headers={"Authorization": f"Bearer {key}", "Content-Type": "application/json"}, json={"model":"auto/bynara","messages":[{"role":"user","content":"Reply only with OK"}],"max_tokens":8,"temperature":0}, timeout=15)
          print(f"[Nara Smoke] status={r.status_code}")
          if r.ok:
              data = r.json()
              text = (((data.get("choices") or [{}])[0].get("message") or {}).get("content") or "").strip()
              print(f"[Nara Smoke] success text={text[:32]}")
          elif r.status_code in {401,402,403,404,429,503}:
              print(f"[Nara Smoke] provider-state response: {r.status_code}")
          else:
              r.raise_for_status()
          PY

      - name: Telegram production preflight
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
        run: python -u scripts/telegram_preflight.py

      - name: Run bot with ranking audit
        env:
          PYTHONUNBUFFERED: 1
          RADAR_PRODUCTION_MODE: 1
          RADAR_WATCHDOG_MINUTES: 22
          RADAR_SUMMARY_WORKERS: 1
          AI_RADAR_EDITORIAL_REVIEW: 0
          RADAR_ENABLE_GEMINI_FALLBACK: 0
          RADAR_ENABLE_HF_FALLBACK: 1
          RADAR_LLM_MAX_TOKENS: 1100
          RADAR_ROUTER_BUDGET_SECONDS: 24
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          KIRAAI_API_KEY: ${{ secrets.KIRAAI_API_KEY }}
          FREE_LLM_ROUTER_API_KEY: ${{ secrets.FREE_LLM_ROUTER_API_KEY }}
          NARAROUTER_API_KEY: ${{ secrets.NARAROUTER_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_MODEL: ${{ vars.HF_MODEL }}
          HF_POLICY: free-first
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: timeout 24m bash -o pipefail -c 'python -u scripts/production_with_ranking_audit.py 2>&1 | tee run.log'

      - name: Recover required Education publication
        env:
          PYTHONUNBUFFERED: 1
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          KIRAAI_API_KEY: ${{ secrets.KIRAAI_API_KEY }}
          FREE_LLM_ROUTER_API_KEY: ${{ secrets.FREE_LLM_ROUTER_API_KEY }}
          NARAROUTER_API_KEY: ${{ secrets.NARAROUTER_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_MODEL: ${{ vars.HF_MODEL }}
          HF_POLICY: free-first
          FORCE_EDUCATION_PUBLICATION: false
        run: python -u scripts/education_recovery.py

      - name: Enforce runtime production acceptance
        run: python -u scripts/production_acceptance_guard.py run.log

      - name: Update persistent LLM health from runtime evidence
        run: python -u scripts/update_llm_health_state.py run.log

      - name: Persist production state
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          STATE_DIR="$(mktemp -d)"
          STATE_FILES="data/seen.json data/telegram_feedback.json data/education_state.json data/publication_state.json data/llm_health.json"
          for f in $STATE_FILES; do
            mkdir -p "$STATE_DIR/$(dirname "$f")"
            cp "$f" "$STATE_DIR/$f"
          done
          for attempt in 1 2 3; do
            git fetch origin main --depth=50
            git reset --hard origin/main
            for f in $STATE_FILES; do
              cp "$STATE_DIR/$f" "$f"
            done
            git add data/seen.json data/telegram_feedback.json data/education_state.json data/publication_state.json data/llm_health.json
            if git diff --cached --quiet; then
              echo "No production state changes to commit."
              exit 0
            fi
            git commit -m "chore: persist production state [skip ci]"
            if git push origin HEAD:main; then
              echo "Production state persisted on attempt ${attempt} without rebasing production code."
              exit 0
            fi
            git reset --hard origin/main
            sleep $((attempt * 2))
          done
          echo "Unable to persist production state after 3 attempts."
          exit 1

      - name: Upload production diagnostics and ranking audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-future-radar-push-${{ github.run_number }}
          path: |
            run.log
            artifacts/ranking_audit/
            artifacts/free_model_registry.runtime.yaml
          retention-days: 14
          if-no-files-found: warn
