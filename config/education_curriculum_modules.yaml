    - id: 100
      domain: "AI Engineering"
      prerequisites: [47, 73]
      title: "Model Registry و Artifact Lineage"
      status: "established"
      a: {term: "Model Registry", fa: "مخزن ثبت مدل", seed: "سامانه‌ای برای نسخه‌بندی و ثبت فراداده مدل‌ها، نسخه‌ها، معیارها و وضعیت استقرار."}
      b: {term: "Artifact Lineage", fa: "تبار مصنوعات", seed: "ردیابی ارتباط میان داده، کد، پیکربندی، مدل و خروجی‌های تولیدشده در چرخه توسعه."}
      relation: "registry مدل‌ها را مدیریت می‌کند؛ artifact lineage منشأ و وابستگی همه مصنوعات را قابل ردیابی می‌سازد."
      core_question: "Model Registry و Artifact Lineage چه تفاوتی دارند و در طراحی سامانه چه اثری دارند؟"
      practice: "برای انتشار یک مدل، lineage لازم از داده تا artifact نهایی را فهرست کن."
