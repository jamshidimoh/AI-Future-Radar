name: One-time Telegram payload repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Patch source and test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/send_telegram.py')
          s = p.read_text(encoding='utf-8')
          pat = re.compile(r'^def _chatgpt_link\(title, link\):\n.*?^def _gregorian_date', re.M | re.S)
          repl = '''def _chatgpt_link(title, link):
              prompt = f"تحلیل آموزشی فارسی: مفاهیم پایه، موضوع اصلی، اهمیت، پیامدها و مسیر آینده. عنوان: {str(title or '').strip()} منبع: {str(link or '').strip()}"
              return "https://chatgpt.com/?q=" + quote(prompt, safe="")


def _gregorian_date'''
          s, n = pat.subn(repl, s, count=1)
          assert n == 1, 'chatgpt function not found'
          p.write_text(s, encoding='utf-8')

          t = Path('tests/test_telegram_format.py')
          ts = t.read_text(encoding='utf-8')
          if 'test_chatgpt_link_is_bounded_and_payload_fits_telegram' not in ts:
              ts += '''\n\ndef test_chatgpt_link_is_bounded_and_payload_fits_telegram():
              from src.send_telegram import _chatgpt_link, format_post, TELEGRAM_TEXT_LIMIT
              title = "معرفی یک مدل Multimodal جدید برای هوش مصنوعی"
              link = "https://example.com/source"
              assert len(_chatgpt_link(title, link)) < 1200
              payload = format_post({"title": title, "summary": "خلاصه آزمون. " * 20, "why_it_matters": "اهمیت آزمون. " * 10, "_provider": "Groq:test"}, "Example Source", link, published="2026-09-05")
              assert payload and len(payload) <= TELEGRAM_TEXT_LIMIT
'''
              t.write_text(ts, encoding='utf-8')
          PY
          python -m compileall -q scripts src *.py
          python -m pytest -q tests/test_telegram_format.py tests/test_production_acceptance_guard.py tests/test_production_acceptance_contract.py tests/test_production_router_policy.py
      - name: Commit repair and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/_one_time_payload_fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/send_telegram.py tests/test_telegram_format.py .github/workflows/_one_time_payload_fix.yml
          git commit -m "fix: repair telegram payload contract [skip ci]"
          git push origin HEAD:main
