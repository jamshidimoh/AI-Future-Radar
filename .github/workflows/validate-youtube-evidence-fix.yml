name: Validate YouTube evidence fix

on:
  push:
    branches: [fix/youtube-evidence-recall]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q main.py src tests
      - name: Target tests
        run: python -m pytest -q tests/test_youtube_evidence.py tests/test_editorial_domains.py tests/test_canonical_ranking.py tests/test_canonical_ranking_contract.py
      - name: Full quality suite
        run: python -m pytest -q
      - name: Remove temporary validation workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-youtube-evidence-fix.yml
          git commit -m "chore: remove temporary evidence validation [skip ci]"
          git push origin HEAD:fix/youtube-evidence-recall
