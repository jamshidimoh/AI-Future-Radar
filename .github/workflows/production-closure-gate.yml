name: Production Closure Gate

on:
  workflow_run:
    workflows: ["Run AI Future Radar Bot"]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  closure-evidence:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled' || github.event.workflow_run.conclusion == 'timed_out' }}
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate production evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TRIGGER_CONCLUSION: ${{ github.event.workflow_run.conclusion || 'unknown' }}
          TRIGGER_RUN_NUMBER: ${{ github.event.workflow_run.run_number || 'unknown' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request

          repo = os.environ["REPO"]
          token = os.environ["GH_TOKEN"]
          trigger_conclusion = os.environ.get("TRIGGER_CONCLUSION", "unknown")
          trigger_run_number = os.environ.get("TRIGGER_RUN_NUMBER", "unknown")
          base = f"https://api.github.com/repos/{repo}"
          headers = {"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"}

          def get_json(path):
              req = urllib.request.Request(base + path, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(NoRedirect)

          def get_text(path):
              req = urllib.request.Request(base + path, headers=headers)
              try:
                  with opener.open(req, timeout=30) as response:
                      return response.read().decode("utf-8", errors="replace")
              except urllib.error.HTTPError as exc:
                  if exc.code not in (301, 302, 303, 307, 308):
                      raise
                  location = exc.headers.get("Location")
                  if not location:
                      raise RuntimeError("GitHub log redirect did not include a Location header") from exc
                  with urllib.request.urlopen(urllib.request.Request(location), timeout=30) as response:
                      return response.read().decode("utf-8", errors="replace")

          def has(text, pattern):
              return re.search(pattern, text, re.I | re.M) is not None

          def code_fingerprint(sha):
              commit = get_json(f"/commits/{sha}")
              tree_sha = ((commit.get("commit") or {}).get("tree") or {}).get("sha")
              if not tree_sha:
                  raise RuntimeError(f"missing tree sha for {sha}")
              tree = get_json(f"/git/trees/{tree_sha}?recursive=1")
              rows = []
              for row in tree.get("tree", []):
                  path = str(row.get("path") or "")
                  blob_sha = str(row.get("sha") or "")
                  # Persistent runtime state, the free-model registry, and CI workflow
                  # definitions are not the Production application baseline. Workflow-only
                  # changes (for example execution timeout/concurrency settings) must not
                  # invalidate otherwise identical application-code evidence.
                  dynamic_runtime_paths = {"config/free_model_registry.yaml"}
                  is_ci_workflow = path.startswith(".github/workflows/")
                  if (
                      not path
                      or path.startswith("data/")
                      or path in dynamic_runtime_paths
                      or is_ci_workflow
                      or row.get("type") != "blob"
                  ):
                      continue
                  rows.append((path, blob_sha))
              payload = "\n".join(f"{path}\0{blob}" for path, blob in sorted(rows))
              return hashlib.sha256(payload.encode("utf-8")).hexdigest()

          def tier0_quality_floor_clean(text):
              """Validate each published Tier-0 score against the floor emitted by runtime.
              
              Runtime evidence uses quality_floor=55.0 on the TIER0 publication
              line, not tier0_quality_floor=.... Never substitute an unrelated
              conservative default when the runtime already emitted its contract.
              """
              published = re.findall(
                  r"\[Publication Policy\]\s+PUBLISH TIER0\b.*?score=([-+]?\d+(?:\.\d+)?).*?quality_floor=([-+]?\d+(?:\.\d+)?)",
                  text,
                  re.I,
              )
              if not published:
                  return True
              return all(float(score) >= float(floor) for score, floor in published)

          def publish_evidence(text):
              # Education delivery is a real Telegram publication too.
              published = has(text, r"\[Telegram Published\]") or has(
                  text, r"\[Education Published\].*telegram_delivery=successful"
              )
              contract_lines = re.findall(r"\[Production Contract\][^\n]*", text)
              contract_line = contract_lines[-1] if contract_lines else ""
              lane_counts = [
                  int(value)
                  for value in re.findall(
                      r"\b(?:normal_news|mind_ideas_voices|people|technical_trend|voices_perspectives|strategic_analytical|tier0_news)=(\d+)",
                      contract_line,
                  )
              ]
              zero_publish = bool(lane_counts) and all(value == 0 for value in lane_counts) and has(
                  text, r"Posts sent:\s*0/\s*\d+"
              )
              no_selected_candidates = (
                  has(text, r"\[Publication Summary Budget\].*\boutput=0\b")
                  or has(text, r"\[Production Selection\].*\btotal=0\b")
                  or has(text, r"\[Selection Timing\].*\bcandidates=0\b")
              )
              acceptance = has(text, r"\[Production Acceptance\] PASS:")
              if published:
                  return True
              # Zero-delivery is valid only when the final selection was explicitly
              # empty. Explicit rejection accounting must not mask selected>0 / sent=0.
              return zero_publish and no_selected_candidates and acceptance

          print(f"TRIGGER: Run #{trigger_run_number} conclusion={trigger_conclusion}")
          if trigger_conclusion != "success":
              print(
                  "CLOSURE: BLOCKED — current production run did not complete successfully; "
                  "historical successes cannot override the current runtime failure."
              )
              print("CLOSURE: ACCEPTANCE IN PROGRESS")
              sys.exit(1)
          # Inspect the newest actual runtime attempts in descending creation order.
          # A failed/cancelled attempt must stay in the window; filtering failures
          # out and then taking three older successes would falsely certify closure.
          runs_data = get_json("/actions/workflows/run.yml/runs?branch=main&per_page=100")
          runs = [r for r in runs_data.get("workflow_runs", []) if r.get("name") == "Run AI Future Radar Bot"]
          runtime_attempts = []
          excluded = []
          for run in runs:
              # State-persistence pushes intentionally skip run-bot and are not
              # production executions. Scheduled/dispatch runs at the same SHA
              # remain eligible and must not be filtered by commit message alone.
              commit_message = str((run.get("head_commit") or {}).get("message") or "")
              if run.get("event") == "push" and commit_message.startswith("chore: persist production state [skip ci]"):
                  excluded.append((run.get("run_number"), run.get("conclusion"), "state_persistence_only"))
                  continue
              jobs = get_json(f"/actions/runs/{run['id']}/jobs?per_page=50").get("jobs", [])
              bots = [j for j in jobs if j.get("name") == "run-bot"]
              if not bots:
                  excluded.append((run.get("run_number"), run.get("conclusion"), "run-bot_missing"))
                  continue
              bot = bots[0]
              steps = {s.get("name"): s.get("conclusion") for s in bot.get("steps", [])}
              runtime_conclusion = steps.get("Run bot with ranking audit")
              if runtime_conclusion not in {"success", "failure", "cancelled", "timed_out"}:
                  excluded.append((run.get("run_number"), bot.get("conclusion"), "runtime_not_reached"))
                  continue
              acceptance_conclusion = steps.get("Enforce runtime production acceptance")
              runtime_ok = (
                  run.get("conclusion") == "success"
                  and bot.get("conclusion") == "success"
                  and runtime_conclusion == "success"
                  and acceptance_conclusion == "success"
              )
              attempt = dict(run)
              attempt["_runtime_ok"] = runtime_ok
              attempt["_runtime_conclusion"] = runtime_conclusion
              attempt["_bot_conclusion"] = bot.get("conclusion")
              attempt["_acceptance_conclusion"] = acceptance_conclusion
              runtime_attempts.append(attempt)
              if len(runtime_attempts) == 3:
                  break

          if len(runtime_attempts) < 3:
              print(f"CLOSURE: BLOCKED — only {len(runtime_attempts)} consecutive runtime attempts found; 3 required.")
              print("Excluded runs:", excluded[:100])
              sys.exit(1)

          window = runtime_attempts[:3]
          failed_runtime_attempts = [
              (r.get("run_number"), r.get("_runtime_conclusion"), r.get("_bot_conclusion"), r.get("_acceptance_conclusion"))
              for r in window if not r.get("_runtime_ok")
          ]
          if failed_runtime_attempts:
              print("CLOSURE: BLOCKED — latest three consecutive production runtime attempts include failures.")
              print("Failed attempts (run, runtime, job, acceptance):", failed_runtime_attempts)
              sys.exit(1)
          fingerprints = {run["run_number"]: code_fingerprint(run["head_sha"]) for run in window}
          distinct_fingerprints = sorted(set(fingerprints.values()))
          print("Closure window:", [(r.get("run_number"), r.get("id"), r.get("head_sha", "")[:8]) for r in window])
          print("Code fingerprints:", fingerprints)
          if len(distinct_fingerprints) != 1:
              print("CLOSURE: BLOCKED — closure window is not code-pinned; production code changed within the 3-run evidence window")
              sys.exit(1)

          logs, log_errors = {}, {}
          for run in window:
              jobs = get_json(f"/actions/runs/{run['id']}/jobs?per_page=50").get("jobs", [])
              bots = [j for j in jobs if j.get("name") == "run-bot"]
              if not bots:
                  log_errors[run["run_number"]] = "run-bot job not found"
                  continue
              try:
                  logs[run["run_number"]] = get_text(f"/actions/jobs/{bots[0]['id']}/logs")
              except Exception as exc:
                  log_errors[run["run_number"]] = f"{type(exc).__name__}: {exc}"
          if log_errors or len(logs) != 3:
              print("CLOSURE: BLOCKED — production evidence logs are incomplete; cannot certify closure")
              print("Log errors:", log_errors)
              sys.exit(1)

          def all_runs(pattern):
              return all(has(logs[r["run_number"]], pattern) for r in window)

          per_run_publish = {r["run_number"]: publish_evidence(logs[r["run_number"]]) for r in window}
          publish_contract = all(per_run_publish.values())
          duplicate_free = all(
              has(logs[r["run_number"]], r"\[Story Identity\] history_duplicates=0")
              and not has(logs[r["run_number"]], r"(?:\[Telegram Published\].*duplicate|\[Publication Ledger\].*duplicate publication|\[Publication Contract\].*duplicate publication)")
              for r in window
          )

          runtime_single_message = all_runs(r"\[Telegram Delivery\] full_text=\d+ photo=disabled single_message=true")
          regression_single_message = all_runs(r"\[Image Delivery Contract Evidence\] PASS")
          try:
              source_payload = get_json("/contents/src/telegram_single_delivery.py?ref=main")
              source_text = base64.b64decode(source_payload.get("content", "")).decode("utf-8", errors="replace")
          except Exception as exc:
              source_text = ""
              print(f"STATIC_CONTRACT read_error={type(exc).__name__}: {exc}")
          static_single_message = "exactly one canonical full-text message" in source_text and "photo=disabled single_message=true" in source_text and "return _send_text_only(text, source_link=source_link)" in source_text
          image_contract = runtime_single_message or regression_single_message or static_single_message

          def ranking_evidence(text):
              explicit = has(text, r"\[Normal Ranking Window\].*candidate_window=\d+")
              window_matches = re.findall(r"\[Selection Contract\]\s+runtime_candidate_window=(\d+)", text, re.I)
              rank_matches = [int(x) for x in re.findall(r"normal_rank=(\d+)", text, re.I)]
              if explicit:
                  return True
              if not window_matches or not rank_matches:
                  return False
              window_size = int(window_matches[-1])
              return max(rank_matches) <= window_size

          ranking_contract = all(
              ranking_evidence(logs[r["run_number"]])
              or (publish_evidence(logs[r["run_number"]]) and has(logs[r["run_number"]], r"Posts sent: 0/"))
              for r in window
          )
          qa_replacement = all_runs(r"\[QA Replacement Evidence\] PASS")
          leader_watch = all_runs(r"\[Protected Leader Eligibility\] candidates=\d+") and all_runs(r"\[Protected Leader Watch\] selected=\d+ max=\d+")
          provider_isolated = all_runs(r"\[Provider Failure Isolation Evidence\] PASS")
          state_persisted = all_runs(r"Production state persisted")
          try:
              source_payload = get_json("/contents/src/unified_editorial_selection.py?ref=main")
              unified_source_text = base64.b64decode(source_payload.get("content", "")).decode("utf-8", errors="replace")
          except Exception as exc:
              unified_source_text = ""
              print(f"MISSION_STATIC read_error={type(exc).__name__}: {exc}")
          mission_static = bool(
              re.search(r"select_regular_portfolio\(.*?mission_aware=True", unified_source_text, re.I | re.S)
              or re.search(r"mission_aware\s*=\s*True", unified_source_text, re.I)
          )

          def mission_evidence(text):
              runtime_marker = has(text, r"mission_aware=true")
              unified_marker = has(text, r"\[Unified Portfolio Selection\]")
              guard_marker = has(text, r"\[Selection Guard\]\s+unified=true")
              recovery_marker = has(text, r"\[Mission Coverage Recovery\]")
              return runtime_marker or (mission_static and unified_marker and guard_marker and recovery_marker)

          mission_portfolio = all(
              mission_evidence(logs[r["run_number"]])
              or (publish_evidence(logs[r["run_number"]]) and has(logs[r["run_number"]], r"Posts sent: 0/"))
              for r in window
          ) and not any(has(logs[r["run_number"]], r"generic low[- ]signal") for r in window)
          tier0_quality_floor = all(tier0_quality_floor_clean(logs[r["run_number"]]) for r in window)

          education_published = any(has(logs[r["run_number"]], r"\[Education Published\].*telegram_delivery=successful") for r in window)
          education_recovery_confirmed = any(has(logs[r["run_number"]], r"\[Education Recovery\] CONFIRMED") for r in window)
          education_not_due_all = all_runs(r"\[Education Recovery\].*due=false")
          education_contract_not_due = all_runs(r"\[Production Contract\].*education=not_due")
          education_evidence = ((education_published and education_recovery_confirmed) or education_not_due_all or education_contract_not_due)

          evidence = {
              "01_three_successful_runs": len(window) == 3,
              "02_code_pinned": len(distinct_fingerprints) == 1,
              "03_publish_and_fail_closed_per_run": publish_contract,
              "04_no_duplicate_publication": duplicate_free,
              "05_image_preserves_full_text": image_contract,
              "06_rank_within_window_no_bypass": ranking_contract,
              "07_replacement_after_qa": qa_replacement,
              "08_leader_watch_eligible": leader_watch,
              "09_provider_failure_isolated": provider_isolated,
              "10_state_after_confirmed_delivery": state_persisted,
              "11_mission_portfolio_not_generic": mission_portfolio,
              "12_tier0_quality_floor": tier0_quality_floor,
              "13_education_cadence_contract": education_evidence,
          }
          for key, value in evidence.items():
              print(f"EVIDENCE {key}={'PASS' if value else 'BLOCKED'}")
          print(f"PUBLISH_PER_RUN: {per_run_publish}")
          print(f"PROVIDER_EVIDENCE deterministic_regression={provider_isolated}")
          print(f"EDUCATION_EVIDENCE published={education_published} recovery={education_recovery_confirmed} not_due_all={education_not_due_all} contract_not_due={education_contract_not_due}")
          blocked = [key for key, value in evidence.items() if not value]
          if blocked:
              print("CLOSURE: BLOCKED — unresolved evidence:", ", ".join(blocked))
              print("CLOSURE: ACCEPTANCE IN PROGRESS")
              sys.exit(1)
          print("CLOSURE: CLOSED — deterministic, code-pinned production evidence checks passed.")
          PY