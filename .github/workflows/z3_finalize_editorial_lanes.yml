name: Finalize editorial lanes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message == 'fix: trigger editorial lanes migration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def rep(path, old, new, count=1):
              p = Path(path); s = p.read_text(encoding='utf-8')
              if old not in s: raise SystemExit(f'anchor missing: {path}: {old[:100]!r}')
              p.write_text(s.replace(old, new, count), encoding='utf-8')

          rep('production_entrypoint.py','from src.protected_editorial_lane import SPECIAL_MAX_PER_PERIOD, choose_additive_candidates\n','from src.protected_editorial_lane import SPECIAL_MAX_PER_PERIOD, choose_additive_candidates\nfrom src.technical_trend_lane import choose_technical_trend_candidate\n')
          rep('production_entrypoint.py','MAX_MIND_IDEAS_VOICES_PER_PERIOD = SPECIAL_MAX_PER_PERIOD\n','MAX_MIND_IDEAS_VOICES_PER_PERIOD = SPECIAL_MAX_PER_PERIOD\nMAX_TECHNICAL_TREND_PER_PERIOD = 1\nNORMAL_RELATIVE_SCORE_GAP = 8.0\n')
          rep('production_entrypoint.py','def _item_final_score(item: dict) -> float:\n    if _is_mind_ideas_voices(item):\n','def _is_technical_trend(item: dict) -> bool:\n    return bool(item.get("technical_trend_lane_selected") or item.get("editorial_lane") == "technical_trend")\n\n\ndef _item_final_score(item: dict) -> float:\n    if _is_technical_trend(item):\n        return float(item.get("technical_trend_score", 0.0) or 0.0)\n    if _is_mind_ideas_voices(item):\n')
          rep('production_entrypoint.py','def _bound_runtime_candidates(candidates, max_posts: int, policy: dict):\n    candidates = list(candidates or [])\n    mind = [item for item in candidates if _is_mind_ideas_voices(item)][:MAX_MIND_IDEAS_VOICES_PER_PERIOD]\n    non_mind = [item for item in candidates if not _is_mind_ideas_voices(item)]\n','def _competitive_normal_candidates(candidates):\n    candidates=list(candidates or [])\n    regular=[x for x in candidates if not _is_mind_ideas_voices(x) and not _is_technical_trend(x) and not x.get("_rank_is_tier0")]\n    protected=[x for x in candidates if x.get("_rank_is_tier0")]\n    if not regular: return candidates\n    scores=[float(x.get("final_editorial_score", x.get("editorial_score", 0)) or 0.0) for x in regular]\n    best=max(scores); cutoff=max(float(NORMAL_SCORE_FLOOR), best-NORMAL_RELATIVE_SCORE_GAP)\n    kept=[x for x in regular if float(x.get("final_editorial_score", x.get("editorial_score", 0)) or 0.0) >= cutoff]\n    print(f"[Normal Competitive Gate] candidates={len(regular)} best={best:.2f} cutoff={cutoff:.2f} gap={NORMAL_RELATIVE_SCORE_GAP:.1f} kept={len(kept)} dropped={len(regular)-len(kept)}", flush=True)\n    return protected+kept\n\n\ndef _bound_runtime_candidates(candidates, max_posts: int, policy: dict):\n    candidates=list(candidates or [])\n    mind=[x for x in candidates if _is_mind_ideas_voices(x)][:MAX_MIND_IDEAS_VOICES_PER_PERIOD]\n    technical=[x for x in candidates if _is_technical_trend(x)][:MAX_TECHNICAL_TREND_PER_PERIOD]\n    non_mind=[x for x in candidates if not _is_mind_ideas_voices(x) and not _is_technical_trend(x)]\n')
          rep('production_entrypoint.py','    for item in protected + normals + mind:\n','    for item in protected + normals + technical + mind:\n')
          rep('production_entrypoint.py','[Selection Budget Guard] normal={len(normals)} protected={len(protected)} mind_ideas_voices={len(mind)} output={len(bounded)}','[Selection Budget Guard] normal={len(normals)} protected={len(protected)} technical_trend={len(technical)} mind_ideas_voices={len(mind)} output={len(bounded)}')
          old='''        normal_candidates = unique_candidates(original_select(items, max(candidate_window, min(len(items), max_posts)), max_per_source, max_per_type, policy))
        normal_ids = {id(item) for item in normal_candidates}
        mind_candidates = choose_additive_candidates(items, existing_ids=normal_ids, max_items=MAX_MIND_IDEAS_VOICES_PER_PERIOD)
        for item in mind_candidates:
            print(f"[Mind/Ideas/Voices Selection] rank={item.get('mind_period_rank')} score={item.get('mind_editorial_score')} normal_score={item.get('editorial_score', 0)} normal_rank=None title={str(item.get('title', ''))[:120]}", flush=True)
        candidates = unique_candidates(normal_candidates + mind_candidates)
        print(f"[Dual Lane Selection] normal={len(normal_candidates)} mind_ideas_voices={len(mind_candidates)} mind_cap={MAX_MIND_IDEAS_VOICES_PER_PERIOD} mind_score_floor=not_applied", flush=True)
'''
          new='''        normal_candidates = _competitive_normal_candidates(unique_candidates(original_select(items, max(candidate_window, min(len(items), max_posts)), max_per_source, max_per_type, policy)))
        normal_ids = {id(item) for item in normal_candidates}
        mind_candidates = choose_additive_candidates(items, existing_ids=normal_ids, max_items=MAX_MIND_IDEAS_VOICES_PER_PERIOD)
        mind_ids = {id(item) for item in mind_candidates}
        for item in mind_candidates:
            print(f"[Mind/Ideas/Voices Selection] rank={item.get('mind_period_rank')} score={item.get('mind_editorial_score')} normal_score={item.get('editorial_score', 0)} normal_rank=None title={str(item.get('title', ''))[:120]}", flush=True)
        technical_candidates = choose_technical_trend_candidate(items, existing_ids=normal_ids | mind_ids, max_items=MAX_TECHNICAL_TREND_PER_PERIOD)
        for item in technical_candidates:
            print(f"[Technical Trend Selection] rank={item.get('technical_trend_period_rank')} score={item.get('technical_trend_score')} source={item.get('source')} title={str(item.get('title', ''))[:120]}", flush=True)
        candidates = unique_candidates(normal_candidates + technical_candidates + mind_candidates)
        print(f"[Triple Lane Selection] normal={len(normal_candidates)} technical_trend={len(technical_candidates)} mind_ideas_voices={len(mind_candidates)} technical_cap={MAX_TECHNICAL_TREND_PER_PERIOD} mind_cap={MAX_MIND_IDEAS_VOICES_PER_PERIOD} mind_score_floor=not_applied", flush=True)
'''
          rep('production_entrypoint.py',old,new)
          rep('production_entrypoint.py','"mind_ideas_voices_delivered_count": 0, "tier0_news_delivered_count": 0','"mind_ideas_voices_delivered_count": 0, "technical_trend_delivered_count": 0, "tier0_news_delivered_count": 0')
          rep('production_entrypoint.py','            if _is_mind_ideas_voices(item):\n                item["final_editorial_score"] = float(item.get("mind_editorial_score", 0) or 0)\n                lane = "mind_ideas_voices"\n            else:\n','            if _is_mind_ideas_voices(item):\n                item["final_editorial_score"] = float(item.get("mind_editorial_score", 0) or 0)\n                lane = "mind_ideas_voices"\n            elif _is_technical_trend(item):\n                item["final_editorial_score"] = float(item.get("technical_trend_score", 0) or 0)\n                lane = "technical_trend"\n            else:\n')
          rep('production_entrypoint.py','                is_mind = _is_mind_ideas_voices(item)\n                is_tier0 = _is_tier0_publication_candidate(item)','                is_mind = _is_mind_ideas_voices(item)\n                is_technical = _is_technical_trend(item)\n                is_tier0 = _is_tier0_publication_candidate(item)')
          rep('production_entrypoint.py','                if not is_mind and not is_tier0:\n','                if not is_mind and not is_technical and not is_tier0:\n')
          rep('production_entrypoint.py','                if is_mind:\n                    render_state["mind_ideas_voices_delivered_count"] += 1\n                elif is_tier0:\n','                if is_mind:\n                    render_state["mind_ideas_voices_delivered_count"] += 1\n                elif is_technical:\n                    render_state["technical_trend_delivered_count"] += 1\n                elif is_tier0:\n')
          rep('production_entrypoint.py','                lane = "mind_ideas_voices" if is_mind else ("tier0" if is_tier0 else "normal")\n','                lane = "mind_ideas_voices" if is_mind else ("technical_trend" if is_technical else ("tier0" if is_tier0 else "normal"))\n')
          rep('production_entrypoint.py','        is_mind = _is_mind_ideas_voices(story)\n        priority_person = _is_tier0_publication_candidate(story)','        is_mind = _is_mind_ideas_voices(story)\n        is_technical = _is_technical_trend(story)\n        priority_person = _is_tier0_publication_candidate(story)')
          rep('production_entrypoint.py','            return delivered({"message_id": None})\n        if strategic_analytical','            return delivered({"message_id": None})\n        if is_technical:\n            if render_state["technical_trend_delivered_count"] >= MAX_TECHNICAL_TREND_PER_PERIOD:\n                return policy_blocked("technical_trend_quota_exhausted")\n            if not _news_language_ok(story):\n                return policy_blocked("news_language_gate")\n            score = _item_final_score(story)\n            print(f"[Publication Policy] PUBLISH technical_trend rank={story.get(\'technical_trend_period_rank\')} score={score} normal_floor=not_applied normal_rank=None independent_lane=true cap={MAX_TECHNICAL_TREND_PER_PERIOD}", flush=True)\n            return delivered({"message_id": None})\n        if strategic_analytical',1)
          rep('production_entrypoint.py','normal_max={MAX_NORMAL_NEWS_PER_PERIOD} mind_ideas_voices={render_state[\'mind_ideas_voices_delivered_count\']}','normal_max={MAX_NORMAL_NEWS_PER_PERIOD} technical_trend={render_state[\'technical_trend_delivered_count\']} technical_max={MAX_TECHNICAL_TREND_PER_PERIOD} mind_ideas_voices={render_state[\'mind_ideas_voices_delivered_count\']}')

          # Mind interview/podcast recall only. Scoring and cap are untouched.
          rep('src/protected_editorial_lane.py','INTERVIEW_TYPES = {\n    "interview", "podcast", "talk", "lecture", "fireside", "conversation", "discussion", "q&a",\n}\n','INTERVIEW_TYPES = {\n    "interview", "podcast", "talk", "lecture", "fireside", "conversation", "discussion", "q&a",\n}\nINTERVIEW_SIGNAL_TERMS = (r"\\binterview\\b", r"\\bpodcast\\b", r"\\bconversation\\b", r"\\bfireside\\b", r"\\bq&a\\b", r"\\bdiscussion\\b", r"\\bguest\\b", r"\\bepisode\\b")\n')
          rep('src/protected_editorial_lane.py','def _thematic_signal(item: dict[str, Any]) -> bool:\n    return any(re.search(pattern, _text(item)) for pattern in SPECIAL_SIGNAL_PATTERNS)\n\n\ndef is_mind_ideas_voices_candidate','def _thematic_signal(item: dict[str, Any]) -> bool:\n    return any(re.search(pattern, _text(item)) for pattern in SPECIAL_SIGNAL_PATTERNS)\n\n\ndef _interview_signal(item: dict[str, Any]) -> bool:\n    content_type=str(item.get("content_type") or "").strip().casefold()\n    source_type=str(item.get("source_type") or item.get("type") or item.get("format") or "").strip().casefold()\n    text=_text(item)\n    return content_type in INTERVIEW_TYPES or source_type in INTERVIEW_TYPES or any(re.search(pattern,text) for pattern in INTERVIEW_SIGNAL_TERMS)\n\n\ndef is_mind_ideas_voices_candidate')
          rep('src/protected_editorial_lane.py','    content_type = str(item.get("content_type") or "").strip().casefold()\n    if mission == "mind_cognition" or thematic:\n        return True\n    if content_type in INTERVIEW_TYPES and (registry_person or explicit_person or mission in MISSION_AREAS):\n','    content_type = str(item.get("content_type") or "").strip().casefold()\n    interview = _interview_signal(item)\n    if mission == "mind_cognition" or thematic:\n        return True\n    if interview and (registry_person or explicit_person or mission in MISSION_AREAS or thematic):\n')

          # Legacy tests: align with final independent Mind semantics where required.
          p=Path('tests/test_mission_coverage_priority.py'); s=p.read_text(encoding='utf-8')
          if 'assert annotated["final_editorial_score"] == 55.15' in s:
              s=s.replace('assert annotated["final_editorial_score"] == 55.15','assert annotated["final_editorial_score"] == 55.0\n    assert annotated["mind_lane_selected"] is True',1)
              p.write_text(s,encoding='utf-8')

          # Main publication budget and refill: preserve one independent technical item.
          p=Path('main.py'); s=p.read_text(encoding='utf-8')
          if 'def _is_technical_trend(item):' not in s:
              marker='def _publication_summary_budget(items, max_posts, policy):\n'
              helper='def _is_technical_trend(item):\n    return bool(item.get("technical_trend_lane_selected") or item.get("editorial_lane") == "technical_trend")\n\n\n'
              if marker not in s: raise SystemExit('main.py budget anchor missing')
              s=s.replace(marker,helper+marker,1)
          s=s.replace('max_posts + int(policy.get("leader_protected_max", 2) or 2) + MAX_MIND_IDEAS_VOICES_PER_PERIOD)', 'max_posts + int(policy.get("leader_protected_max", 2) or 2) + MAX_MIND_IDEAS_VOICES_PER_PERIOD + 1)', 2)
          old='''    normal = [x for x in items if x not in protected and not _is_mind_ideas_voices(x)]\n    eligible_protected = [x for x in protected if float(x.get("final_editorial_score", x.get("editorial_score", 0)) or 0) >= PROTECTED_SUMMARY_SCORE_FLOOR]\n    normal_window = max_posts + buffer\n    bounded = eligible_protected[:max_posts] + normal[:normal_window] + mind\n'''
          new='''    technical = [x for x in items if _is_technical_trend(x) and x not in protected and x not in mind][:1]\n    normal = [x for x in items if x not in protected and not _is_mind_ideas_voices(x) and not _is_technical_trend(x)]\n    eligible_protected = [x for x in protected if float(x.get("final_editorial_score", x.get("editorial_score", 0)) or 0) >= PROTECTED_SUMMARY_SCORE_FLOOR]\n    normal_window = max_posts + buffer\n    bounded = eligible_protected[:max_posts] + normal[:normal_window] + technical + mind\n'''
          if old not in s: raise SystemExit('main.py budget block anchor missing')
          s=s.replace(old,new,1)
          s=s.replace('mind_limit={MAX_MIND_IDEAS_VOICES_PER_PERIOD} replacement_buffer={buffer}','technical_limit=1 mind_limit={MAX_MIND_IDEAS_VOICES_PER_PERIOD} replacement_buffer={buffer}',1)
          p.write_text(s,encoding='utf-8')

          Path('tests/test_technical_trend_lane.py').write_text('''from src.technical_trend_lane import choose_technical_trend_candidate\n\n\ndef test_technical_lane_selects_one_top_item():\n    top={"title":"MCP runtime protocol and agent harness architecture","summary":"Model Context Protocol runtime, tool calling and inference infrastructure","source_type":"technical","source_tier":1,"category":"ai_core"}\n    low={"title":"General AI news","summary":"AI update","source_type":"news","source_tier":2,"category":"ai"}\n    out=choose_technical_trend_candidate([low,top],max_items=1)\n    assert out==[top]\n    assert top["editorial_lane"]=="technical_trend"\n\n\ndef test_technical_lane_excludes_arxiv_reddit():\n    a={"title":"MCP agent harness protocol infrastructure","summary":"technical architecture","source":"arXiv","source_type":"research","category":"ai_core"}\n    r={"title":"MCP agent harness protocol infrastructure","summary":"technical architecture","source":"Reddit","source_type":"community","category":"ai_core"}\n    assert choose_technical_trend_candidate([a,r],max_items=1)==[]\n''',encoding='utf-8')
          Path('tests/test_mind_interview_recall.py').write_text('''import src.protected_editorial_lane as lane\nfrom src.protected_editorial_lane import is_mind_ideas_voices_candidate, mind_ideas_voices_score\n\n\ndef test_interview_signal_recall_does_not_change_score():\n    item={"title":"Deep podcast conversation on consciousness and AI","summary":"Long-form interview with a researcher about cognition, consciousness and AI","mission_area":"mind_cognition","content_type":"article","source_tier":1}\n    before=mind_ideas_voices_score(item)\n    assert is_mind_ideas_voices_candidate(item) is True\n    assert mind_ideas_voices_score(item)==before\n\n\ndef test_mind_cap_is_unchanged():\n    assert lane.SPECIAL_MAX_PER_PERIOD==2\n''',encoding='utf-8')
          PY
      - name: Validate
        run: |
          python -m compileall -q production_entrypoint.py main.py src/technical_trend_lane.py src/protected_editorial_lane.py
          pytest -q tests/test_technical_trend_lane.py tests/test_mind_interview_recall.py tests/test_mind_cognition_target_contract.py tests/test_mission_coverage_priority.py tests/test_selection_refill_after_late_dedup.py tests/test_publication_summary_budget.py
      - name: Commit and cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/z_editorial_lanes_migration.yml .github/workflows/z2_editorial_lanes_apply.yml .github/workflows/z3_finalize_editorial_lanes.yml
          git add production_entrypoint.py main.py src/protected_editorial_lane.py src/technical_trend_lane.py tests/test_technical_trend_lane.py tests/test_mind_interview_recall.py tests/test_mission_coverage_priority.py
          git commit -m "feat: refine editorial lanes and add technical trend stream"
          git push
