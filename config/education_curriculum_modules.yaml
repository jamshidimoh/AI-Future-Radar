      title: "Data Exfiltration و Tool Abuse"
      status: "established"
      a: {term: "Data Exfiltration", fa: "استخراج غیرمجاز داده", seed: "انتقال یا افشای داده حساس از سامانه به مقصد یا فرد غیرمجاز."}
      b: {term: "Tool Abuse", fa: "سوءاستفاده از ابزار", seed: "به‌کارگیری ابزار مجاز در زمینه یا هدفی خارج از سیاست و اختیار مورد انتظار."}
      relation: "استخراج داده پیامد یا هدف حمله است؛ سوءاستفاده از ابزار یکی از مسیرهای ممکن برای تحقق آن است."
      core_question: "Data Exfiltration و Tool Abuse چه تفاوتی دارند و در طراحی سامانه چه اثری دارند؟"
      practice: "برای عامل دارای دسترسی ایمیل، مسیرهای exfiltration را مدل کن."
      sources:
