name: Event Identity Regression
on:
  push:
    branches: [fix/event-identity-real]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_event_identity_regression.py
