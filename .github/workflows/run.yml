name: Run AI Future Radar Bot

on:
  schedule:
    - cron: '17 4 * * *'
    - cron: '47 7 * * *'
    - cron: '47 10 * * *'
    - cron: '47 14 * * *'
    - cron: '47 17 * * *'
    - cron: '47 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-future-radar-production
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - name: Checkout current ref
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run production regression checks
        run: |
          python -m compileall -q scripts src *.py
          python -m pytest -q tests/test_editorial_quality_policy.py tests/test_education_recovery_fallback.py tests/test_production_acceptance_guard.py tests/test_production_acceptance_contract.py tests/test_telegram_format.py tests/test_production_router_policy.py tests/test_free_model_registry.py tests/test_free_model_intelligence.py tests/test_free_model_evidence.py tests/test_litellm_registry_integration.py tests/test_critical_ai_incident_priority.py tests/test_event_identity_regression.py tests/test_llm_router_resilience.py tests/test_llm_health_persistence.py

      - name: Emit fail-closed closure evidence
        run: |
          python -m pytest -q tests/test_production_acceptance_guard.py -k "all_selected_candidates_rejected_downstream_is_fail_closed_pass or zero_publication_without_rejection_evidence_is_failure"
          echo "[Fail-Closed Acceptance Evidence] PASS"

      - name: Refresh and validate free-model registry
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          KIRAAI_API_KEY: ${{ secrets.KIRAAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FREE_LLM_ROUTER_API_KEY: ${{ secrets.FREE_LLM_ROUTER_API_KEY }}
          NARAROUTER_API_KEY: ${{ secrets.NARAROUTER_API_KEY }}
        run: python -u scripts/refresh_free_model_registry.py --strict

      - name: Bridge Free LLM Router discovery into runtime registry
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FREE_LLM_ROUTER_API_KEY: ${{ secrets.FREE_LLM_ROUTER_API_KEY }}
        run: python -u scripts/bridge_free_llm_router.py

      - name: Telegram production preflight
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: "-1004482051328"
        run: python -u scripts/telegram_preflight.py

      - name: Run bot with ranking audit
        env:
          PYTHONUNBUFFERED: "1"
          RADAR_PRODUCTION_MODE: "1"
          RADAR_WATCHDOG_MINUTES: "22"
          RADAR_SUMMARY_WORKERS: "1"
          AI_RADAR_EDITORIAL_REVIEW: "0"
          RADAR_ENABLE_GEMINI_FALLBACK: "0"
          RADAR_ENABLE_HF_FALLBACK: "1"
          RADAR_LLM_MAX_TOKENS: "700"
          RADAR_ROUTER_BUDGET_SECONDS: "24"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: "-1004482051328"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          KIRAAI_API_KEY: ${{ secrets.KIRAAI_API_KEY }}
          FREE_LLM_ROUTER_API_KEY: ${{ secrets.FREE_LLM_ROUTER_API_KEY }}
          NARAROUTER_API_KEY: ${{ secrets.NARAROUTER_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_MODEL: ${{ vars.HF_MODEL }}
          HF_POLICY: free-first
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: timeout 24m bash -o pipefail -c 'python -u scripts/production_with_ranking_audit.py 2>&1 | tee run.log'

      - name: Recover required Education publication
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: "-1004482051328"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          KIRAAI_API_KEY: ${{ secrets.KIRAAI_API_KEY }}
          FREE_LLM_ROUTER_API_KEY: ${{ secrets.FREE_LLM_ROUTER_API_KEY }}
          NARAROUTER_API_KEY: ${{ secrets.NARAROUTER_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_MODEL: ${{ vars.HF_MODEL }}
          HF_POLICY: free-first
          FORCE_EDUCATION_PUBLICATION: "false"
        run: python -u scripts/education_recovery.py

      - name: Enforce runtime production acceptance
        run: python -u scripts/production_acceptance_guard.py run.log

      - name: Update persistent LLM health from runtime evidence
        run: python -u scripts/update_llm_health_state.py run.log

      - name: Persist production state
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen.json data/telegram_feedback.json data/education_state.json data/publication_state.json data/llm_health.json
          if git diff --cached --quiet; then
            echo "No production state changes to commit."
            exit 0
          fi
          git commit -m "chore: persist production state [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin "main" --depth=20
            if git rebase "origin/main"; then
              if git push origin "HEAD:main"; then
                echo "Production state persisted on attempt ${attempt}."
                exit 0
              fi
            else
              echo "State rebase attempt ${attempt} hit generated-state conflicts; merging JSON state instead of discarding remote history."
              python scripts/merge_production_state.py
              git add data/seen.json data/telegram_feedback.json data/education_state.json data/publication_state.json data/llm_health.json
              GIT_EDITOR=true git rebase --continue
              if git push origin "HEAD:main"; then
                echo "Production state persisted after lossless JSON merge on attempt ${attempt}."
                exit 0
              fi
            fi
            git rebase --abort || true
            echo "State push attempt ${attempt} lost a race with the production branch; retrying."
            sleep $((attempt * 2))
          done
          echo "Unable to persist production state after 3 attempts."
          exit 1

      - name: Upload production diagnostics and ranking audit
        uses: actions/upload-artifact@v4
        with:
          name: ai-future-radar-push-${{ github.run_number }}
          path: |
            run.log
            artifacts/ranking_audit/
            artifacts/free_model_registry.runtime.yaml
          retention-days: 14
