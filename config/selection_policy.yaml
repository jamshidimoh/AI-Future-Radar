# Production runtime verification trigger: diversity policy is intentional.
selection:
  max_posts: 3
  candidate_window: 8
  max_items_per_source: 2
  max_items_per_content_type: 2
  story_similarity_threshold: 0.45
  diversity_mode: adaptive
  diversity_weight: 11.0
  similarity_penalty: 16.0
  entity_repeat_penalty: 10.0
  leader_repeat_penalty: 12.0
  history_topic_penalty: 8.0
  history_entity_penalty: 7.0
  preferred_max_same_source: 1
  distinct_sources_first: true
  replacement_buffer: 3
  diversity_quality_floor_ratio: 0.88
  target_quality_floor_ratio: 0.92
  freshness_weight: 10.0
  freshness_half_life_hours: 24.0

editorial:
  leader_priority_weight: 2
  leader_protected_max: 2
  technical_depth_penalty: 3
  community_penalty: 30
  rotation_days: 7
  mission_aware: true
  strict_relevance: true

# Unified production selection contract:
# - max_posts=3 is the normal publication capacity.
# - candidate_window=6 keeps the canonical bounded replacement pool for QA/rejection.
# - max_items_per_source=2 remains the adaptive ceiling and hard source cap. One item
#   per source is preferred first; a second item is allowed only during adaptive backfill.
# - The additive Mind/Ideas/Voices lane may add up to 2 qualifying special items per run.
#   The lane is score/rank-driven within the existing bounded replacement pool, with
#   the existing normal score floor and rank window still enforced.
# - Qualifying scope includes influential technology/AI leaders and CEOs, scientists,
#   theorists, public intellectuals, sociologists, scientifically grounded futurists,
#   their substantive interviews/podcasts/talks/conversations, and AI-relevant work
#   on consciousness, philosophy of mind/science/technology, cognitive science,
#   neuroscience/brain, genetics/genomics/synthetic biology, foresight/futures,
#   society and technology, and related interdisciplinary AI/future domains.
# - The additive lane never changes the canonical ranking formula or the first three
#   normal candidates. The effective limits remain the existing ranked pool, rank window,
#   score floor, source/deduplication rules, language, editorial quality, grounding,
#   Telegram safety, final publication contract, and the explicit two-item lane cap.
# - Community/aggregator sources remain excluded.
# - ai_core_target_min/max, mind_cognition_target and convergence_target remain explicit
#   normal-portfolio controls. They are filled after the normal eligibility/safety gates;
#   the global target quality floor does not veto an explicit mission-coverage target.
# - diversity_quality_floor_ratio=0.80 remains unchanged.
# - max_same_mission_area=2 prevents an AI-only or single-domain normal run.
# - Information gain is a bounded soft reranker; quality remains dominant.
# - Current-portfolio entity/leader repetition receives explicit soft penalties.
# - Recent publication history contributes topic/entity saturation penalties so
#   different URLs about the same saturated subject do not crowd out genuinely
#   new developments.
# - Same-story duplication remains a hard rejection at the canonical/publication
#   gates; novelty penalties do not replace semantic duplicate detection.
# - Education remains an independent scheduled product stream and is recovered fail-closed.
# - Strategic Analytical Lane remains separate and limited to one mission-critical signal.
