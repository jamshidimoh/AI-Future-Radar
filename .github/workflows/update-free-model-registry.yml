name: Update Free Model Registry

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Refresh registry
        run: python -u scripts/update_free_model_registry.py
      - name: Validate registry and router policy
        run: |
          python -m compileall -q scripts src *.py
          python -m pytest -q tests/test_free_model_registry.py tests/test_production_router_policy.py
      - name: Commit updated registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/free_model_registry.yaml
          if git diff --cached --quiet; then
            echo "Registry unchanged."
            exit 0
          fi
          git commit -m "chore: refresh free model registry [skip ci]"
          git push origin HEAD:main
