name: Test Story Rotation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Restore missing signal ranking helper
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('main.py')
          s = p.read_text(encoding='utf-8')
          anchor = '''    return max(0, 4 - tier) if tier is not None else 0\n\ndef _leader_activity_signal(item):\n'''
          helper = '''    return max(0, 4 - tier) if tier is not None else 0\n\ndef _apply_signal_ranking(items):\n    """Historical pre-selection signal uplift: 30% signal on top of pre-signal editorial score."""\n    for item in items:\n        try:\n            base = float(item.get("editorial_score_pre_signal", item.get("editorial_score", 0)) or 0.0)\n        except (TypeError, ValueError):\n            base = 0.0\n        try:\n            signal = float(item.get("signal_score", 0) or 0.0)\n        except (TypeError, ValueError):\n            signal = 0.0\n        item["editorial_score_pre_signal"] = round(base, 2)\n        item["editorial_score"] = round(base + 0.30 * signal, 2)\n    return items\n\ndef _leader_activity_signal(item):\n'''
          if 'def _apply_signal_ranking(' not in s:
              if anchor not in s:
                  raise SystemExit('signal ranking helper insertion anchor not found')
              p.write_text(s.replace(anchor, helper, 1), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py
          if git diff --cached --quiet; then
            echo "Signal ranking helper already present."
          else
            git commit -m "fix: restore signal ranking helper [signal-helper-restored]"
            git push origin HEAD:main
          fi
      - name: Compile Python modules
        run: python -m compileall -q main.py src
      - name: Run Python unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Test story clustering and source rotation
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "src")
          from semantic_dedup import deduplicate_semantically
          from editorial import enrich_items, select_editorial
          items = [
              {"title": "OpenAI launches new reasoning model", "summary": "AI reasoning model", "category": "ai", "source": "Source A", "content_type": "official", "source_tier": 1, "official": True, "published": ""},
              {"title": "OpenAI unveils its new reasoning model", "summary": "same AI model story", "category": "ai", "source": "Source B", "content_type": "news", "source_tier": 2, "official": False, "published": ""},
              {"title": "Stanford releases new AI agent benchmark", "summary": "agent benchmark", "category": "ai", "source": "Source C", "content_type": "research", "source_tier": 1, "official": True, "published": ""},
          ]
          for item in items: item["_ai_link"] = True
          enriched = enrich_items(items,{"Sam Altman":10},source_history=[{"ts":0,"source":"Source A"}],policy={"rotation_days":7,"technical_depth_penalty":3})
          enriched.sort(key=lambda x:x["editorial_score"],reverse=True)
          kept = deduplicate_semantically(enriched,[],threshold=0.45)
          selected = select_editorial(kept,max_posts=3,max_per_source=2,max_per_type=2)
          assert len(selected)==2, selected
          assert {x["source"] for x in selected}=={"Source A","Source C"}, selected
          print("STORY_ROTATION_OK")
          PY
      - name: Cleanup one-shot repair hook
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git rm -f .github/workflows/test-rotation.yml || true
          cat > .github/workflows/test-rotation.yml <<'EOF'
          name: Test Story Rotation
          on:
            push:
              branches:
                - main
            pull_request:
              branches:
                - main
          permissions:
            contents: read
          jobs:
            test:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v6
                - uses: actions/setup-python@v6
                  with:
                    python-version: "3.11"
                - name: Install dependencies
                  run: python -m pip install -r requirements.txt
                - name: Compile Python modules
                  run: python -m compileall -q main.py src
                - name: Run Python unit tests
                  run: python -m unittest discover -s tests -p 'test_*.py' -v
                - name: Test story clustering and source rotation
                  run: |
                    python - <<'PY'
                    import sys
                    sys.path.insert(0, "src")
                    from semantic_dedup import deduplicate_semantically
                    from editorial import enrich_items, select_editorial
                    items = [
                        {"title": "OpenAI launches new reasoning model", "summary": "AI reasoning model", "category": "ai", "source": "Source A", "content_type": "official", "source_tier": 1, "official": True, "published": ""},
                        {"title": "OpenAI unveils its new reasoning model", "summary": "same AI model story", "category": "ai", "source": "Source B", "content_type": "news", "source_tier": 2, "official": False, "published": ""},
                        {"title": "Stanford releases new AI agent benchmark", "summary": "agent benchmark", "category": "ai", "source": "Source C", "content_type": "research", "source_tier": 1, "official": True, "published": ""},
                    ]
                    for item in items: item["_ai_link"] = True
                    enriched = enrich_items(items,{"Sam Altman":10},source_history=[{"ts":0,"source":"Source A"}],policy={"rotation_days":7,"technical_depth_penalty":3})
                    enriched.sort(key=lambda x:x["editorial_score"],reverse=True)
                    kept = deduplicate_semantically(enriched,[],threshold=0.45)
                    selected = select_editorial(kept,max_posts=3,max_per_source=2,max_per_type=2)
                    assert len(selected)==2, selected
                    assert {x["source"] for x in selected}=={"Source A","Source C"}, selected
                    print("STORY_ROTATION_OK")
                    PY
          EOF
          git add .github/workflows/test-rotation.yml
          git commit -m "chore: restore test rotation workflow [skip ci]"
          for i in 1 2 3; do git push origin HEAD:main && break || { git fetch origin main; git rebase origin/main; sleep $((i*2)); }; done
