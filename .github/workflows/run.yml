name: Run AI Future Radar Bot
# Closure evidence: production workflow trigger marker (application fingerprint excludes CI workflows).
# Closure evidence cycle marker: 1390.

on:
  push:
    branches: [main]
  schedule:
    # Tehran publication windows: 05:17, 10:47, 13:47, 17:47, 20:47, 22:47 Tehran (UTC+3:30). GitHub Actions cron is UTC.
    - cron: "47 1 * * *"
    - cron: "17 7,10,14,17,19 * * *"
  workflow_dispatch:

concurrency:
  # State-only persistence pushes are intentionally skipped by the run-bot job.
  # Keep them in a separate concurrency group so their no-op workflow run cannot
  # replace a queued, real production attempt while another attempt is persisting.
  group: "${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore: persist production state [skip ci]') && 'ai-future-radar-state-only' || 'ai-future-radar-production' }}"
  # Serialize real production attempts. Cancelling one mid-publication can leave
  # delivery and persisted state ambiguous and invalidates closure evidence.
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-bot:
    if: "github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore: persist production state [skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout latest main state
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 50

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Set up ephemeral OmniRoute
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install and start ephemeral OmniRoute
        timeout-minutes: 40
        env:
          PORT: 20128
          OMNIROUTE_SERVER_HOST: 127.0.0.1
          REQUIRE_API_KEY: "false"
          NODE_ENV: production
          DATA_DIR: /tmp/omniroute-data
          OMNIROUTE_ENABLE_NARA: ${{ vars.OMNIROUTE_ENABLE_NARA || '0' }}
          # Recurring/free provider credentials used by OmniRoute auto-routing. Verified published pin: 3.8.50.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HF_TOKEN: ${{ secrets.HUGGINGFACE_API_KEY || secrets.HF_TOKEN }}
          NARAROUTER_API_KEY: ${{ secrets.NARAROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          LLM7_API_KEY: ${{ secrets.LLM7_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          ANYAPI_API_KEY: ${{ secrets.ANYAPI_API_KEY }}
          API_AIRFORCE_API_KEY: ${{ secrets.API_AIRFORCE_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # One-time/free-trial credits are intentionally NOT in the automatic pool.
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$DATA_DIR"
          OMNIROUTE_VERSION=3.8.50
          OMNIROUTE_COMMIT=5458026c216f77a3da68ea49152dc33470cfe2cb
          OMNIROUTE_DIR="$RUNNER_TEMP/OmniRoute"
          OMNIROUTE_BIN_DIR="$RUNNER_TEMP/omniroute-bin"
          OMNIROUTE_READY_LOCAL=0

          # Install from an immutable, audited source tag rather than a mutable global package.
          # This upstream tag has a stale lockfile (npm ci reports missing
          # brace-expansion@1.1.21), so reconcile only the ephemeral checkout's lockfile
          # from the pinned package.json with lifecycle scripts disabled, then clean-install.
          if ! timeout 60s git clone --depth 1 --branch "v${OMNIROUTE_VERSION}" https://github.com/diegosouzapw/OmniRoute.git "$OMNIROUTE_DIR"; then
            echo "[OmniRoute] source checkout failed; production router will use its hard fallback"
          elif ! (cd "$OMNIROUTE_DIR" && test "$(git rev-parse HEAD)" = "$OMNIROUTE_COMMIT"); then
            echo "[OmniRoute] source revision did not match the pinned release commit; production router will use its hard fallback"
          elif ! (cd "$OMNIROUTE_DIR" && HUSKY=0 timeout 180s npm install --package-lock-only --ignore-scripts --include=dev --no-audit --no-fund --prefer-offline --no-progress); then
            echo "[OmniRoute] pinned-source lockfile reconciliation timed out or failed; production router will use its hard fallback"
          elif ! (cd "$OMNIROUTE_DIR" && HUSKY=0 timeout 420s npm ci --include=dev --no-audit --no-fund --prefer-offline --no-progress); then
            echo "[OmniRoute] clean dependency installation timed out or failed after lockfile reconciliation; production router will use its hard fallback"
          # Radar consumes the HTTP inference API only. OmniRoute's supported
          # backend-only build keeps every route.ts handler and stubs the dashboard
          # UI, avoiding the expensive static page-generation phase on hosted runners.
          elif ! (cd "$OMNIROUTE_DIR" && timeout 720s npm run build:backend); then
            echo "[OmniRoute] backend-only production build timed out or failed; production router will use its hard fallback"
          else
            mkdir -p "$OMNIROUTE_BIN_DIR"
            cat > "$OMNIROUTE_BIN_DIR/omniroute" <<EOF
          #!/usr/bin/env bash
          exec node "$OMNIROUTE_DIR/bin/omniroute.mjs" "\$@"
          EOF
            chmod +x "$OMNIROUTE_BIN_DIR/omniroute"
            export PATH="$OMNIROUTE_BIN_DIR:$PATH"
            echo "$OMNIROUTE_BIN_DIR" >> "$GITHUB_PATH"
            OMNIROUTE_READY_LOCAL=1
          fi

          if [ "$OMNIROUTE_READY_LOCAL" -ne 1 ]; then
            echo "OMNIROUTE_READY=0" >> "$GITHUB_ENV"
            exit 0
          fi
          if ! timeout 10s omniroute --version; then
            echo "[OmniRoute] version check failed; production router will use its hard fallback"
            echo "OMNIROUTE_READY=0" >> "$GITHUB_ENV"
            exit 0
          fi
          # Use the source checkout's supported production runner; the published
          # CLI server launcher is for the packaged artifact and expects app/server.js.
          (
            cd "$OMNIROUTE_DIR"
            nohup npm run start > /tmp/omniroute.log 2>&1 &
          )
          HEALTHY=0
          for attempt in $(seq 1 30); do
            if curl -4 -fsS --max-time 5 http://127.0.0.1:20128/healthz >/tmp/omniroute-healthz.json 2>/dev/null; then
              HEALTHY=1
              echo "[OmniRoute] healthz=healthy attempt=${attempt}"
              break
            fi
            sleep 2
          done
          if [ "${HEALTHY}" -ne 1 ]; then
            echo "[OmniRoute] healthz readiness failed; production router will use its hard fallback"
            tail -n 120 /tmp/omniroute.log || true
            echo "OMNIROUTE_READY=0" >> "$GITHUB_ENV"
            exit 0
          fi
          MODEL_READY=0
          for attempt in $(seq 1 30); do
            if curl -4 -fsS --max-time 10 http://127.0.0.1:20128/v1/models >/tmp/omniroute-models.json 2>/dev/null; then
              MODEL_READY=1
              echo "[OmniRoute] models=responsive attempt=${attempt}"
              break
            fi
            sleep 2
          done
          if [ "${MODEL_READY}" -ne 1 ]; then
            echo "[OmniRoute] initial /v1/models catalog not ready; continuing with provider provisioning"
            tail -n 80 /tmp/omniroute.log || true
          fi
          # /v1/models can be temporarily unavailable while OmniRoute is starting.
          # Never let an empty/missing catalog turn a provider-readiness condition
          # into a hard failure of the entire production pipeline.
          if [ ! -s /tmp/omniroute-models.json ]; then
            printf '%s\n' '{"data":[]}' > /tmp/omniroute-models.json
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          try:
              payload = json.loads(Path("/tmp/omniroute-models.json").read_text(encoding="utf-8"))
          except Exception as exc:
              print(f"[OmniRoute] catalog parse warning: {exc}")
              payload = {}
          models = payload.get("data") or payload.get("models") or []
          print(f"[OmniRoute] discovered_models={len(models) if isinstance(models, list) else 0}")
          if not models:
              print("[OmniRoute] warning: no models advertised; production router will use its hard fallback")
          PY

          echo "[OmniRoute] provisioning free/low-cost Radar providers"
          add_provider() {
            local provider="$1"
            local credential_env="$2"
            if [ -n "${!credential_env:-}" ]; then
              echo "[OmniRoute] provisioning ${provider}"
              timeout 20s omniroute providers add "$provider" --credential-env "$credential_env" || echo "[OmniRoute] $provider: provisioning timed out or failed; continuing"
            else
              echo "[OmniRoute] ${provider}: skipped (credential not present)"
            fi
          }
          # Core recurring/free pool.
          add_provider groq GROQ_API_KEY
          add_provider huggingface HF_TOKEN
          if [ "${OMNIROUTE_ENABLE_NARA:-0}" = "1" ]; then
            add_provider nara NARAROUTER_API_KEY
          else
            echo "[OmniRoute] nara: deferred from auto-pool until the account Telegram gate is resolved; direct fallback observes persisted provider health"
          fi
          add_provider mistral MISTRAL_API_KEY
          add_provider llm7 LLM7_API_KEY
          add_provider nvidia NVIDIA_API_KEY
          add_provider anyapi ANYAPI_API_KEY
          add_provider api-airforce API_AIRFORCE_API_KEY
          add_provider sambanova SAMBANOVA_API_KEY
          # Cloudflare requires provider-specific accountId data; credential-env alone cannot supply it.
          # Keep the secret available to the Radar, but do not create a malformed OmniRoute connection.
          echo "[OmniRoute] cloudflare-ai: deferred (requires accountId in provider-specific connection data)"
          # One-time/signup-credit provider remains outside automatic routing.
          echo "[OmniRoute] one-time credit provider retained by Radar, not OmniRoute auto-pool: deepseek"
          echo "[OmniRoute] credential presence inventory (names only):"
          for credential in GROQ_API_KEY HF_TOKEN NARAROUTER_API_KEY MISTRAL_API_KEY LLM7_API_KEY NVIDIA_API_KEY ANYAPI_API_KEY API_AIRFORCE_API_KEY CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DEEPSEEK_API_KEY SAMBANOVA_API_KEY TYPESAFE_API_KEY; do
            if [ -n "${!credential:-}" ]; then
              echo "[OmniRoute] ${credential}=present"
            else
              echo "[OmniRoute] ${credential}=missing"
            fi
          done
          echo "[OmniRoute] configured provider connections (redacted):"
          timeout 15s omniroute providers list --json || echo "[OmniRoute] provider listing timed out; continuing with fallback"
          echo "[OmniRoute] validating local provider configuration without inference calls:"
          timeout 20s omniroute providers validate || echo "[OmniRoute] provider validation timed out; continuing with fallback"
          echo "[OmniRoute] validating post-provision model catalog"
          curl -4 -fsS --connect-timeout 3 --max-time 10 http://127.0.0.1:20128/v1/models >/tmp/omniroute-post-models.json 2>/dev/null || true
          MODEL_COUNT=$(python - <<'PY'
          import json
          from pathlib import Path
          try:
              payload = json.loads(Path('/tmp/omniroute-post-models.json').read_text(encoding='utf-8'))
              rows = payload.get('data') or payload.get('models') or []
              print(len(rows) if isinstance(rows, list) else 0)
          except Exception:
              print(0)
          PY
          )
          echo "[OmniRoute] post_provision_models=${MODEL_COUNT}"
          echo "[OmniRoute] running structured auto/smart inference smoke-test"
          READY=0
          for attempt in $(seq 1 6); do
            if curl -4 -fsS --max-time 20 http://127.0.0.1:20128/v1/chat/completions -H "Content-Type: application/json" -d '{"model":"auto/smart","messages":[{"role":"user","content":"Return a JSON object with exactly one key, ok, set to true."}],"response_format":{"type":"json_object"},"max_tokens":32,"temperature":0}' >/tmp/omniroute-smoke.json 2>/tmp/omniroute-smoke.err; then
              if python - <<'PY'
          import json
          from pathlib import Path

          try:
              payload = json.loads(Path("/tmp/omniroute-smoke.json").read_text(encoding="utf-8"))
              choices = payload.get("choices") or []
              content = (choices[0].get("message") or {}).get("content") if choices else None
              result = json.loads(str(content or ""))
              healthy = isinstance(result, dict) and result.get("ok") is True
          except (OSError, ValueError, TypeError, AttributeError):
              healthy = False

          if not healthy:
              raise SystemExit(1)
          PY
              then
                READY=1
                echo "[OmniRoute] structured_json_inference_smoke=healthy attempt=${attempt}"
                break
              fi
            fi
            echo "[OmniRoute] structured_json_inference_smoke attempt=${attempt} failed"
            tail -n 20 /tmp/omniroute-smoke.err || true
            sleep 3
          done
          echo "[OmniRoute] ready=${READY}"
          echo "OMNIROUTE_READY=${READY}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # Closure evidence trigger: workflow-only change; production application fingerprint excludes CI workflow files.
      - name: Run production regression checks
        run: python -m pytest -q tests/test_omniroute_workflow_contract.py tests/test_editorial_quality_policy.py tests/test_education_recovery_fallback.py tests/test_production_acceptance_guard.py tests/test_production_acceptance_contract.py tests/test_telegram_format.py tests/test_production_router_policy.py tests/test_free_model_registry.py tests/test_free_model_intelligence.py tests/test_free_model_evidence.py tests/test_litellm_registry_integration.py tests/test_critical_ai_incident_priority.py tests/test_event_identity_regression.py tests/test_llm_router_resilience.py tests/test_llm_health_persistence.py tests/test_production_contract.py tests/test_publication_summary_budget.py tests/test_replacement_buffer_contract.py tests/test_schedule_contract.py tests/test_unified_editorial_selection.py tests/test_semantic_story_regression.py tests/test_protected_leader_semantic_dedup.py tests/test_strategic_analytical_lane.py tests/test_final_publication_guard.py tests/test_cross_language_publication_integration.py tests/test_source_authority.py tests/test_google_news_canonical_resolution.py tests/test_production_closure_gate_integrity.py tests/test_protected_editorial_lane.py tests/test_publication_guard_corroboration.py tests/test_voices_perspectives_lane.py tests/test_summary_depth.py tests/test_expert_registry_contract.py tests/test_people_watch.py tests/test_people_acceptance.py tests/test_production_lazy_replacement.py tests/test_production_closure_contract.py

      - name: Verify provider-failure isolation with integration regressions
        run: |
          python -m pytest -q tests/test_llm_router_resilience.py tests/test_production_lazy_replacement.py::test_provider_failure_for_one_summary_does_not_abort_other_publication
          echo "[Provider Failure Isolation Evidence] PASS (targeted integration regressions passed)"

      - name: Verify late-QA replacement with integration regressions
        run: |
          python -m pytest -q tests/test_production_lazy_replacement.py::test_late_publication_qa_rejection_sends_eligible_ranked_replacement tests/test_selection_refill_after_late_dedup.py
          echo "[QA Replacement Evidence] PASS (targeted integration regressions passed)"

      - name: Refresh and validate free-model registry
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          KIRAAI_API_KEY: ${{ secrets.KIRAAI_API_KEY }}
          NARAROUTER_API_KEY: ${{ secrets.NARAROUTER_API_KEY }}
          FREE_LLM_ROUTER_API_KEY: ${{ secrets.FREE_LLM_ROUTER_API_KEY }}
        run: |
          set +e
          python -u scripts/refresh_free_model_registry.py --strict
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "[Free Model Registry] refresh unavailable; continuing with committed/validated runtime fallbacks status=$status"
          else
            echo "[Free Model Registry] refresh completed successfully"
          fi
          exit 0

      - name: Bridge Free LLM Router discovery into runtime registry
        env:
          FREE_LLM_ROUTER_API_KEY: ${{ secrets.FREE_LLM_ROUTER_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set +e
          python -u scripts/bridge_free_llm_router.py
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "[Free LLM Router Bridge] unavailable; continuing with validated runtime fallbacks status=$status"
          else
            echo "[Free LLM Router Bridge] completed successfully"
          fi
          exit 0

      - name: Telegram production preflight
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
        run: python -u scripts/telegram_preflight.py

      - name: Run bot with ranking audit
        env:
          PYTHONUNBUFFERED: 1
          RADAR_PRODUCTION_MODE: 1
          RADAR_WATCHDOG_MINUTES: 90
          RADAR_SUMMARY_WORKERS: 1
          AI_RADAR_EDITORIAL_REVIEW: 1
          RADAR_ENABLE_OPENROUTER_FREE_ROUTER: 0
          RADAR_ENABLE_HF_FALLBACK: 1
          RADAR_MAX_LLM_ATTEMPTS: 10
          RADAR_LLM_MAX_TOKENS: 700
          RADAR_ROUTER_BUDGET_SECONDS: 60

          OMNIROUTE_API_KEY: ""
          OMNIROUTE_MODEL: auto/smart
          OMNIROUTE_TIMEOUT_SECONDS: 8
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          KIRAAI_API_KEY: ${{ secrets.KIRAAI_API_KEY }}
          FREE_LLM_ROUTER_API_KEY: ${{ secrets.FREE_LLM_ROUTER_API_KEY }}
          NARAROUTER_API_KEY: ${{ secrets.NARAROUTER_API_KEY }}
          HF_TOKEN: ${{ secrets.HUGGINGFACE_API_KEY || secrets.HF_TOKEN }}
          HF_MODEL: ${{ vars.HF_MODEL }}
          HF_POLICY: free-first
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE || secrets.TYPESAFE_API_KEY }}
          AI_RADAR_TYPESAFE_RERANK_MODE: active
          AI_RADAR_TYPESAFE_RERANK_WEIGHT: 0.20
        run: |
          set -euo pipefail
          if [ "${OMNIROUTE_READY:-0}" = "1" ]; then
            export OMNIROUTE_BASE_URL="http://127.0.0.1:20128"
          else
            unset OMNIROUTE_BASE_URL || true
            echo "[OmniRoute] unavailable; bypassing primary router and using hard fallback"
          fi
          python -u scripts/production_with_protected_lane.py 2>&1 | tee run.log

      - name: Recover required Education publication
        if: always()
        env:
          PYTHONUNBUFFERED: 1
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          KIRAAI_API_KEY: ${{ secrets.KIRAAI_API_KEY }}
          FREE_LLM_ROUTER_API_KEY: ${{ secrets.FREE_LLM_ROUTER_API_KEY }}
          NARAROUTER_API_KEY: ${{ secrets.NARAROUTER_API_KEY }}
          HF_TOKEN: ${{ secrets.HUGGINGFACE_API_KEY || secrets.HF_TOKEN }}
          HF_MODEL: ${{ vars.HF_MODEL }}
          HF_POLICY: free-first
          RADAR_ENABLE_OPENROUTER_FREE_ROUTER: 0
          FORCE_EDUCATION_PUBLICATION: false
        run: |
          if [ -f run.log ]; then
            python -u scripts/education_recovery.py
          else
            echo "[Education Recovery] skipped: runtime log unavailable"
          fi

      - name: Enforce runtime production acceptance
        if: always()
        run: |
          if [ -f run.log ]; then
            python -u scripts/production_acceptance_guard.py run.log
          else
            echo "[Production Acceptance] BLOCKED: runtime log unavailable"
            exit 1
          fi

      - name: Update persistent LLM health from runtime evidence
        if: always()
        run: python -u scripts/update_llm_health_state.py run.log

      - name: Persist production state
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          STATE_DIR="$(mktemp -d)"
          STATE_FILES="data/seen.json data/telegram_feedback.json data/education_state.json data/publication_state.json data/llm_health.json"
          for f in $STATE_FILES; do
            mkdir -p "$STATE_DIR/$(dirname "$f")"
            cp "$f" "$STATE_DIR/$f"
          done
          for attempt in 1 2 3; do
            git fetch origin main --depth=50
            git reset --hard origin/main
            python - "$STATE_DIR" <<'PY'
          import json
          import pathlib
          import sys

          from scripts.llm_health_state_merge import merge_llm_health_state
          from scripts.update_llm_health_state import clear_successful_health_records

          root = pathlib.Path(".")
          local_root = pathlib.Path(sys.argv[1])

          def load(path, default):
              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  return default

          def dump(path, value):
              path.write_text(json.dumps(value, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          def merge_list(a, b):
              out = list(a or [])
              seen = {json.dumps(x, ensure_ascii=False, sort_keys=True) for x in out}
              for value in b or []:
                  marker = json.dumps(value, ensure_ascii=False, sort_keys=True)
                  if marker not in seen:
                      out.append(value)
                      seen.add(marker)
              return out

          remote_seen = load(root / "data/seen.json", {})
          local_seen = load(local_root / "data/seen.json", {})
          if isinstance(remote_seen, dict) and isinstance(local_seen, dict):
              merged_seen = dict(remote_seen)
              for key in ("seen_hashes", "seen_signatures", "seen_identities"):
                  merged_seen[key] = merge_list(remote_seen.get(key), local_seen.get(key))
              dump(root / "data/seen.json", merged_seen)

          remote_feedback = load(root / "data/telegram_feedback.json", {})
          local_feedback = load(local_root / "data/telegram_feedback.json", {})
          if isinstance(remote_feedback, dict) and isinstance(local_feedback, dict):
              merged_feedback = dict(remote_feedback)
              messages = dict(remote_feedback.get("messages") or {})
              messages.update(local_feedback.get("messages") or {})
              merged_feedback["messages"] = messages
              for key in ("last_update_id", "updated_at"):
                  merged_feedback[key] = max(int(remote_feedback.get(key, 0) or 0), int(local_feedback.get(key, 0) or 0))
              dump(root / "data/telegram_feedback.json", merged_feedback)

          remote_education = load(root / "data/education_state.json", {})
          local_education = load(local_root / "data/education_state.json", {})
          if isinstance(remote_education, dict) and isinstance(local_education, dict):
              merged_education = dict(remote_education)
              merged_education["completed"] = merge_list(remote_education.get("completed"), local_education.get("completed"))
              for key in ("next_slot", "next_lesson", "updated_at"):
                  merged_education[key] = max(int(remote_education.get(key, 0) or 0), int(local_education.get(key, 0) or 0))
              dump(root / "data/education_state.json", merged_education)

          remote_publication = load(root / "data/publication_state.json", {})
          local_publication = load(local_root / "data/publication_state.json", {})
          if isinstance(remote_publication, dict) and isinstance(local_publication, dict):
              merged_publication = dict(remote_publication)
              for key in ("run_number", "last_education_run"):
                  merged_publication[key] = max(int(remote_publication.get(key, 0) or 0), int(local_publication.get(key, 0) or 0))
              merged_publication["last_education_slot"] = str(local_publication.get("last_education_slot") or remote_publication.get("last_education_slot") or "")
              for key in ("last_published_news_score", "last_published_normal_news_score"):
                  local_value = local_publication.get(key)
                  merged_publication[key] = local_value if isinstance(local_value, (int, float)) else remote_publication.get(key)
              remote_people = remote_publication.get("people_bootstrap")
              local_people = local_publication.get("people_bootstrap")
              if isinstance(local_people, dict):
                  local_delivered = int(local_people.get("delivered_count", 0) or 0)
                  remote_delivered = int((remote_people or {}).get("delivered_count", 0) or 0) if isinstance(remote_people, dict) else 0
                  if str(local_people.get("status") or "") == "complete" or local_delivered >= remote_delivered:
                      merged_publication["people_bootstrap"] = local_people
              elif isinstance(remote_people, dict):
                  merged_publication["people_bootstrap"] = remote_people
              dump(root / "data/publication_state.json", merged_publication)

          remote_health = load(root / "data/llm_health.json", {})
          local_health = load(local_root / "data/llm_health.json", {})
          if isinstance(remote_health, dict) and isinstance(local_health, dict):
              merged_health = merge_llm_health_state(remote_health, local_health)
              # Reapply ordered success evidence after max-merging state so an
              # older cooldown cannot be resurrected after current-run success.
              runtime_log = pathlib.Path("run.log")
              if runtime_log.exists():
                  before_models = len(merged_health.get("models", {}))
                  before_providers = len(merged_health.get("providers", {}))
                  merged_health = clear_successful_health_records(
                      merged_health,
                      runtime_log.read_text(encoding="utf-8", errors="replace").splitlines(),
                  )
                  removed_models = before_models - len(merged_health.get("models", {}))
                  removed_providers = before_providers - len(merged_health.get("providers", {}))
                  print(
                      "[LLM Health Merge] reapplied current-run success events "
                      f"cleared_models={removed_models} cleared_providers={removed_providers}"
                  )
              dump(root / "data/llm_health.json", merged_health)
              timestamp = merged_health.get("updated_at") or (merged_health.get("telemetry") or {}).get("updated_at", 0)
              print(f"[LLM Health Merge] selected_snapshot_updated_at={timestamp}")

          PY
            git add data/seen.json data/telegram_feedback.json data/education_state.json data/publication_state.json data/llm_health.json
            if git diff --cached --quiet; then
              echo "No production state changes to commit."
              exit 0
            fi
            git commit -m "chore: persist production state [skip ci]"
            if git push origin HEAD:main; then
              echo "Production state persisted on attempt ${attempt} with remote-state merge."
              exit 0
            fi
            git reset --hard origin/main
            sleep $((attempt * 2))
          done
          echo "Unable to persist production state after 3 attempts."
          exit 1

      - name: Upload production diagnostics and ranking audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-future-radar-push-${{ github.run_number }}
          path: |
            run.log
            artifacts/ranking_audit/
            artifacts/free_model_registry.runtime.yaml
          retention-days: 14
          if-no-files-found: warn
          compression-level: 6
