name: One-shot E2E Production + Education Validation

on:
  push:
    branches: [main]
    paths:
      - '.e2e_education_trigger'

concurrency:
  group: ai-future-radar-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  e2e:
    if: startsWith(github.event.head_commit.message, '[RUN E2E EDUCATION]')
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Regression contract checks
        run: python -m pytest -q tests/test_education_recovery_fallback.py tests/test_production_contract.py tests/test_unified_editorial_selection.py tests/test_source_authority.py tests/test_cross_language_publication_integration.py tests/test_production_acceptance_guard.py
      - name: Refresh free-model registry
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          KIRAAI_API_KEY: ${{ secrets.KIRAAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NARAROUTER_API_KEY: ${{ secrets.NARAROUTER_API_KEY }}
          FREE_LLM_ROUTER_API_KEY: ${{ secrets.FREE_LLM_ROUTER_API_KEY }}
        run: python -u scripts/refresh_free_model_registry.py --strict
      - name: Bridge free router
        env:
          FREE_LLM_ROUTER_API_KEY: ${{ secrets.FREE_LLM_ROUTER_API_KEY }}
        run: python -u scripts/bridge_free_llm_router.py
      - name: Telegram preflight
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
        run: python -u scripts/telegram_preflight.py
      - name: Run production path
        env:
          PYTHONUNBUFFERED: 1
          RADAR_PRODUCTION_MODE: 1
          RADAR_WATCHDOG_MINUTES: 22
          RADAR_SUMMARY_WORKERS: 1
          AI_RADAR_EDITORIAL_REVIEW: 0
          RADAR_ENABLE_GEMINI_FALLBACK: 0
          RADAR_ENABLE_HF_FALLBACK: 1
          RADAR_LLM_MAX_TOKENS: 1100
          RADAR_ROUTER_BUDGET_SECONDS: 24
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          KIRAAI_API_KEY: ${{ secrets.KIRAAI_API_KEY }}
          FREE_LLM_ROUTER_API_KEY: ${{ secrets.FREE_LLM_ROUTER_API_KEY }}
          NARAROUTER_API_KEY: ${{ secrets.NARAROUTER_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_MODEL: ${{ vars.HF_MODEL }}
          HF_POLICY: free-first
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: timeout 24m bash -o pipefail -c 'python -u scripts/production_with_ranking_audit.py 2>&1 | tee run.log'
      - name: Recover and publish Education
        if: always()
        env:
          PYTHONUNBUFFERED: 1
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          KIRAAI_API_KEY: ${{ secrets.KIRAAI_API_KEY }}
          FREE_LLM_ROUTER_API_KEY: ${{ secrets.FREE_LLM_ROUTER_API_KEY }}
          NARAROUTER_API_KEY: ${{ secrets.NARAROUTER_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_MODEL: ${{ vars.HF_MODEL }}
          HF_POLICY: free-first
          FORCE_EDUCATION_PUBLICATION: true
        run: python -u scripts/education_recovery.py
      - name: Production acceptance
        if: always()
        run: python -u scripts/production_acceptance_guard.py run.log
      - name: Persist production state
        if: always()
        run: |
          set -euo pipefail
          STATE_DIR="$(mktemp -d)"
          for f in data/seen.json data/telegram_feedback.json data/education_state.json data/publication_state.json data/llm_health.json; do
            mkdir -p "$STATE_DIR/$(dirname "$f")"
            cp "$f" "$STATE_DIR/$f"
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main --depth=20
          git reset --hard origin/main
          for f in data/seen.json data/telegram_feedback.json data/education_state.json data/publication_state.json data/llm_health.json; do cp "$STATE_DIR/$f" "$f"; done
          git add data/seen.json data/telegram_feedback.json data/education_state.json data/publication_state.json data/llm_health.json
          if git diff --cached --quiet; then echo 'No production state changes to commit.'; else git commit -m 'chore: persist production state [skip ci]'; git push origin HEAD:main; fi
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-future-radar-e2e-education-${{ github.run_number }}
          path: |
            run.log
            artifacts/ranking_audit/
            artifacts/free_model_registry.runtime.yaml
          retention-days: 14
          if-no-files-found: warn
