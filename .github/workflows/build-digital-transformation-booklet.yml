name: Build Digital Transformation Booklet

on:
  push:
    paths:
      - 'digital_transformation_booklet/chapter-01/source/**'
      - 'digital_transformation_booklet/chapter-01/generate_outputs.py'
      - 'tools/harden_rtl_docx.py'
      - 'tools/validate_visual_layout.py'
      - '.github/workflows/build-digital-transformation-booklet.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: digital-transformation-booklet
  cancel-in-progress: false

jobs:
  build-chapter-01:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system fonts and PDF renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core libreoffice

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install document dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install python-docx reportlab arabic-reshaper python-bidi pymupdf

      - name: Generate Word and provisional PDF
        run: python digital_transformation_booklet/chapter-01/generate_outputs.py

      - name: Harden canonical Word RTL
        run: |
          python tools/harden_rtl_docx.py \
            digital_transformation_booklet/chapter-01/docx/فصل-01-تحول-دیجیتال-2-0.docx \
            --locale fa-IR \
            --validate

      - name: Render publication PDF from hardened Word output
        run: |
          rm -f digital_transformation_booklet/chapter-01/pdf/*.pdf
          soffice --headless --convert-to pdf --outdir digital_transformation_booklet/chapter-01/pdf digital_transformation_booklet/chapter-01/docx/فصل-01-تحول-دیجیتال-2-0.docx
          test -s digital_transformation_booklet/chapter-01/pdf/فصل-01-تحول-دیجیتال-2-0.pdf

      - name: Validate document structure
        run: |
          test -s digital_transformation_booklet/chapter-01/docx/فصل-01-تحول-دیجیتال-2-0.docx
          test -s digital_transformation_booklet/chapter-01/pdf/فصل-01-تحول-دیجیتال-2-0.pdf
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          p=Path('digital_transformation_booklet/chapter-01/docx/فصل-01-تحول-دیجیتال-2-0.docx')
          with ZipFile(p) as z:
              assert 'word/document.xml' in z.namelist()
          q=Path('digital_transformation_booklet/chapter-01/pdf/فصل-01-تحول-دیجیتال-2-0.pdf')
          assert q.read_bytes().startswith(b'%PDF')
          print('document validation: PASS')
          PY

      - name: Run canonical visual layout QA
        run: python tools/validate_visual_layout.py

      - name: Upload QA diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter-01-visual-qa
          path: |
            digital_transformation_booklet/chapter-01/reports/**
            digital_transformation_booklet/chapter-01/pdf/*.pdf
            digital_transformation_booklet/chapter-01/docx/*.docx
          if-no-files-found: warn

      - name: Commit generated artifacts only after QA
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add digital_transformation_booklet/chapter-01/docx digital_transformation_booklet/chapter-01/pdf digital_transformation_booklet/chapter-01/reports
          if git diff --cached --quiet; then
            echo 'No artifact changes.'
          else
            git commit -m 'build: publish QA-approved chapter 01 Word and PDF [skip ci]'
            git push
          fi
