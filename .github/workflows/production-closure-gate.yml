name: Production Closure Gate

on:
  workflow_run:
    workflows: ["Run AI Future Radar Bot"]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  closure-evidence:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled' || github.event.workflow_run.conclusion == 'timed_out' }}
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate production evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TRIGGER_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          TRIGGER_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request

          repo = os.environ["REPO"]
          token = os.environ["GH_TOKEN"]
          trigger_conclusion = os.environ.get("TRIGGER_CONCLUSION", "unknown")
          trigger_run_number = os.environ.get("TRIGGER_RUN_NUMBER", "unknown")
          base = f"https://api.github.com/repos/{repo}"
          headers = {"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"}

          def get_json(path):
              req = urllib.request.Request(base + path, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(NoRedirect)

          def get_text(path):
              req = urllib.request.Request(base + path, headers=headers)
              try:
                  with opener.open(req, timeout=30) as response:
                      return response.read().decode("utf-8", errors="replace")
              except urllib.error.HTTPError as exc:
                  if exc.code not in (301, 302, 303, 307, 308):
                      raise
                  location = exc.headers.get("Location")
                  if not location:
                      raise RuntimeError("GitHub log redirect did not include a Location header") from exc
                  with urllib.request.urlopen(urllib.request.Request(location), timeout=30) as response:
                      return response.read().decode("utf-8", errors="replace")

          def has(text, pattern):
              return re.search(pattern, text, re.I | re.M) is not None

          def tier0_quality_floor_clean(text):
              floors = [float(m.group(1)) for m in re.finditer(r"tier0_quality_floor(?:=|:)\s*([-+]?\d+(?:\.\d+)?)", text, re.I)]
              floor = floors[-1] if floors else 60.0
              published = [float(m.group(1)) for m in re.finditer(r"\[Publication Policy\]\s+PUBLISH TIER0\b.*?score=([-+]?\d+(?:\.\d+)?)", text)]
              return all(score >= floor for score in published)

          print(f"TRIGGER: Run #{trigger_run_number} conclusion={trigger_conclusion}")
          runs_data = get_json("/actions/workflows/run.yml/runs?branch=main&per_page=20")
          runs = [r for r in runs_data.get("workflow_runs", []) if r.get("name") == "Run AI Future Radar Bot"]

          executable = []
          excluded = []
          for run in runs:
              if run.get("conclusion") != "success":
                  excluded.append((run.get("run_number"), run.get("conclusion"), "workflow_not_success"))
                  continue
              jobs = get_json(f"/actions/runs/{run['id']}/jobs?per_page=50").get("jobs", [])
              bot_jobs = [j for j in jobs if j.get("name") == "run-bot"]
              if not bot_jobs:
                  excluded.append((run.get("run_number"), run.get("conclusion"), "run-bot_missing"))
                  continue
              bot = bot_jobs[0]
              if bot.get("conclusion") != "success":
                  excluded.append((run.get("run_number"), bot.get("conclusion"), "run-bot_not_success"))
                  continue
              steps = {s.get("name"): s.get("conclusion") for s in bot.get("steps", [])}
              if steps.get("Run bot with ranking audit") != "success":
                  excluded.append((run.get("run_number"), bot.get("conclusion"), "runtime_not_reached"))
                  continue
              if steps.get("Enforce runtime production acceptance") != "success":
                  excluded.append((run.get("run_number"), bot.get("conclusion"), "runtime_acceptance_missing"))
                  continue
              executable.append(run)

          if len(executable) < 3:
              print(f"CLOSURE: IN PROGRESS — only {len(executable)} executable production runs observed; 3 required.")
              print("Excluded runs:", excluded)
              sys.exit(0)

          window = executable[:3]
          recent = executable[:12]
          print("Closure window:", [(r.get("run_number"), r.get("id"), r.get("head_sha", "")[:8]) for r in window])

          logs = {}
          errors = {}
          metadata = {}
          for run in recent:
              jobs = get_json(f"/actions/runs/{run['id']}/jobs?per_page=50").get("jobs", [])
              bot_jobs = [j for j in jobs if j.get("name") == "run-bot"]
              if not bot_jobs:
                  errors[run["run_number"]] = "run-bot job not found"
                  continue
              bot = bot_jobs[0]
              metadata[run["run_number"]] = {
                  "created_at": run.get("created_at"),
                  "head_sha": run.get("head_sha"),
                  "event": run.get("event"),
              }
              try:
                  logs[run["run_number"]] = get_text(f"/actions/jobs/{bot['id']}/logs")
              except Exception as exc:
                  errors[run["run_number"]] = f"{type(exc).__name__}: {exc}"

          if errors or len(logs) < 3:
              print("CLOSURE: BLOCKED — production evidence logs are incomplete; cannot certify closure")
              print("Log errors:", errors)
              sys.exit(1)

          def any_recent(pattern):
              return any(has(text, pattern) for text in logs.values())

          def all_runs(pattern):
              return all(has(logs[r.get("run_number")], pattern) for r in window)

          published_run = any_recent(r"\[Telegram Published\]")
          observed_zero_publish = any_recent(r"Posts sent: 0/") and any_recent(r"normal_news=0[^\n]*tier0_news=0")
          fail_closed_regression = any_recent(r"\[Fail-Closed Acceptance Evidence\] PASS")
          zero_publish_evidence = observed_zero_publish or fail_closed_regression
          history_dedup_clean = any_recent(r"\[Story Identity\] history_duplicates=0")
          actual_duplicate_event = r"(?:\[Telegram Published\].*duplicate|\[Publication Ledger\].*duplicate publication|\[Publication Contract\].*duplicate publication)"
          no_duplicate_publication = not any_recent(actual_duplicate_event)
          duplicate_free = history_dedup_clean and no_duplicate_publication
          image_contract = any_recent(r"full_text=\d+ photo=(?:enabled|disabled) single_message=true")
          ranking_contract = all_runs(r"\[Normal Ranking Window\].*candidate_window=\d+") and not any_recent(r"normal_rank=\d{2,}")
          qa_replacement = any_recent(r"(?:translation/QA failed|Editorial Value Gate.*rejected|publishable candidate prepared)")
          leader_watch = all_runs(r"\[Protected Leader Eligibility\] candidates=\d+") and all_runs(r"\[Leader Protection Audit\]")
          provider_success = any_recent(r"\[Light Router\] success=")
          provider_failure_observed = any_recent(r"\[Light Router\] disabled=") or any_recent(r"(?:429|quota|timeout|5\d{2}|401|403)")
          provider_isolated = provider_failure_observed and provider_success
          state_persisted = all_runs(r"Production state persisted")
          mission_portfolio = all_runs(r"mission_aware=true") and not any_recent(r"generic low[- ]signal")
          tier0_quality_floor = all(tier0_quality_floor_clean(logs[r.get("run_number")]) for r in window)

          education_published = any_recent(r"\[Education Published\].*telegram_delivery=successful")
          education_recovery_confirmed = any_recent(r"\[Education Recovery\] CONFIRMED")
          education_not_due_all = all_runs(r"\[Education Recovery\].*due=false")
          education_contract_not_due = all_runs(r"\[Production Contract\].*education=not_due")
          education_evidence = (
              (education_published and education_recovery_confirmed)
              or education_not_due_all
              or education_contract_not_due
          )

          evidence = {
              "01_three_successful_runs": len(window) == 3,
              "02_publish_and_fail_closed_zero": published_run and zero_publish_evidence,
              "03_no_duplicate_publication": duplicate_free,
              "04_image_preserves_full_text": image_contract,
              "05_rank_within_window_no_bypass": ranking_contract,
              "06_replacement_after_qa": qa_replacement,
              "07_leader_watch_eligible": leader_watch,
              "08_provider_failure_isolated": provider_isolated,
              "09_state_after_confirmed_delivery": state_persisted,
              "10_mission_portfolio_not_generic": mission_portfolio,
              "11_tier0_quality_floor": tier0_quality_floor,
              "12_education_cadence_contract": education_evidence,
          }

          for key, value in evidence.items():
              print(f"EVIDENCE {key}={'PASS' if value else 'BLOCKED'}")
          print(f"TIER0_QUALITY_FLOOR clean={tier0_quality_floor}")
          print(f"EDUCATION_EVIDENCE published={education_published} recovery={education_recovery_confirmed} not_due_all={education_not_due_all} contract_not_due={education_contract_not_due}")
          print(f"FAIL_CLOSED_EVIDENCE observed_zero={observed_zero_publish} regression_contract={fail_closed_regression}")

          blocked = [key for key, value in evidence.items() if not value]
          if blocked:
              print("CLOSURE: BLOCKED — unresolved evidence:", ", ".join(blocked))
              print("CLOSURE: ACCEPTANCE IN PROGRESS")
              sys.exit(1)
          print("CLOSURE: CLOSED — deterministic gates and production evidence checks passed.")
          PY
