name: One-shot Production Repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[repair-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Patch production contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          main = Path('main.py')
          text = main.read_text(encoding='utf-8')
          needle = 'def _direct_interview_signal(item): return has_interview_evidence(item)\n'
          insert = '''def _direct_interview_signal(item): return has_interview_evidence(item)\n\ndef _leader_source_authority(item):\n    """Return a normalized, higher-is-better authority score for leader sources."""\n    try:\n        existing = item.get("leader_source_authority")\n        if existing is not None:\n            return int(existing)\n    except (AttributeError, TypeError, ValueError):\n        pass\n    try:\n        tier = _source_tier(item)\n    except Exception:\n        tier = None\n    try:\n        tier = int(tier) if tier is not None else None\n    except (TypeError, ValueError):\n        tier = None\n    if tier is None:\n        return 0\n    return max(0, 4 - tier)\n'''
          if 'def _leader_source_authority(' not in text:
              if needle not in text:
                  raise SystemExit('main insertion anchor not found')
              text = text.replace(needle, insert, 1)
          main.write_text(text, encoding='utf-8')

          g = Path('src/fetch_google_news.py')
          text = g.read_text(encoding='utf-8')
          old = '''    workers = min(max_workers or _MAX_WORKERS, max(1, len(queries)))\n    if leader_query_mode and workers == 1 and len(queries) > 1:\n        workers = min(_MAX_WORKERS, len(queries)); print(f"[Leader Discovery Parallel] workers={workers}", flush=True)\n'''
          new = '''    workers = min(max_workers or _MAX_WORKERS, max(1, len(queries)))\n    if leader_query_mode and workers > 1:\n        print(f"[Leader Discovery Parallel] workers={workers}", flush=True)\n'''
          if old not in text:
              raise SystemExit('google-news worker block not found')
          g.write_text(text.replace(old, new, 1), encoding='utf-8')
          
          t = Path('tests/test_leader_source_authority_contract.py')
          t.write_text('''from main import _leader_source_authority\n\ndef test_leader_source_authority_is_higher_for_better_source_tier():\n    assert _leader_source_authority({"source": "Reuters", "source_tier": 2}) == 2\n    assert _leader_source_authority({"source": "Other", "source_tier": 3}) == 1\n\ndef test_low_authority_google_news_metadata_is_corrected():\n    assert _leader_source_authority({"source": "Google News (Bitcoin World)", "source_tier": 1}) == 1\n''', encoding='utf-8')
          PY
          python -m compileall -q main.py src
          python -m pytest -q tests/test_leader_source_authority_contract.py tests/test_period_ranked_pipeline.py tests/test_source_authority_production_regression.py
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py src/fetch_google_news.py tests/test_leader_source_authority_contract.py
          git commit -m "fix: restore leader source authority and bound discovery concurrency [repair-done]"
          git push origin HEAD:main
      - name: Remove one-shot workflow
        run: |
          git rm .github/workflows/one-shot-production-repair.yml
          git commit -m "chore: remove one-shot production repair [skip ci]"
          git push origin HEAD:main
